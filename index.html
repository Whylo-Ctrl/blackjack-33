    ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
    const giveUp = setTimeout(() => { if(this.ws === ws && !this.ready){ try{ ws.close(); }catch(e){} } }, 9000);
    ws.onopen = () => {
      if(this.ws !== ws) return;
      // CONNECT: MQTT 3.1.1, clean session, keep-alive 45s (+ username/password if the relay wants one)
      const fl = 2 | (this.user ? 128 : 0) | (this.pass ? 64 : 0);
      this.raw(mqttPacket(0x10, [...mqttStr('MQTT'), 4, fl, 0, 45, ...mqttStr(this.cid), ...(this.user ? mqttStr(this.user) : []), ...(this.pass ? mqttStr(this.pass) : [])]));
    };
    ws.onmessage = e => { if(this.ws === ws){ this.lastIn = Date.now(); this.feed(new Uint8Array(e.data)); } };
    ws.onclose = () => { clearTimeout(giveUp); if(this.ws !== ws) return; this.ws = null; this.setReady(false); this.retry(); };
    ws.onerror = () => {};

  retry(){

  setReady(v){ if(this.ready !== v){ this.ready = v; this.onChange && this.onChange(); } }

  feed(chunk){
    let b = this.buf.length ? (() => { const x = new Uint8Array(this.buf.length + chunk.length); x.set(this.buf); x.set(chunk, this.buf.length); return x; })() : chunk;
    let i = 0;
    while(true){
      if(b.length - i < 2) break;
      let mult = 1, len = 0, j = i + 1, byte;
      do{ if(j >= b.length){ len = -1; break; } byte = b[j++]; len += (byte & 127) * mult; mult *= 128; }while(byte & 128);
      if(len < 0 || j + len > b.length) break;
      this.packet(b[i], b.subarray(j, j + len));
      i = j + len;
    }
    this.buf = i < b.length ? b.slice(i) : new Uint8Array(0);
  }
  packet(h, body){
    const type = h >> 4;
    if(type === 2){ // CONNACK
      if(body[1] === 0){
        this.backoff = 800; this.setReady(true);
        for(const t of this.subs) this.sendSub(t);
      } else { try{ this.ws.close(); }catch(e){} }
    } else if(type === 3){ // PUBLISH
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = TD.decode(body.subarray(2, 2 + tl));
      const start = 2 + tl + (qos ? 2 : 0);
      try{ this.onMsg(topic, body.slice(start)); }catch(e){ console.warn(e); }
    }
  }
  sendSub(topic){ const id = this.pid = (this.pid % 65000) + 1; this.raw(mqttPacket(0x82, [id >> 8, id & 255, ...mqttStr(topic), 0])); }
  subscribe(topic){ this.subs.add(topic); if(this.ready) this.sendSub(topic); }
  publish(topic, payload){
    if(!this.ready) return false;
    const t = mqttStr(topic), body = new Uint8Array(t.length + payload.length);
    body.set(t); body.set(payload, t.length);

  }
  keepAlive(){
    if(!this.ws || this.ws.readyState !== 1) return;
    if(this.ready && Date.now() - this.lastIn > 50000){ try{ this.ws.close(); }catch(e){} return; } // dead link
    this.raw(new Uint8Array([0xC0, 0]));
  }
  close(){
    this.closed = true; bgClear(this.timer); clearTimeout(this.rt);
    const ws = this.ws; this.ws = null; this.ready = false;
    if(ws){ try{ if(ws.readyState === 1) ws.send(new Uint8Array([0xE0, 0])); ws.close(); }catch(e){} }
  }
}

/* ---------- table crypto: key and topic names come from the table code ---------- */
async function sha256(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(s))); }
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
async function roomSecrets(code){
  const t = await sha256('whylos-casino-topic:' + code), k = await sha256('whylos-casino-key:' + code);
  return {topic: RELAY_NS + hex(t).slice(0, 24), key: await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt', 'decrypt'])};
}
async function streamBytes(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
const CAN_ZIP = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function sealMsg(key, obj){
  let data = TE.encode(JSON.stringify(obj)), flag = 0;
  if(CAN_ZIP && data.length > 300){ try{ data = await streamBytes(data, new CompressionStream('deflate-raw')); flag = 1; }catch(e){} }
  const plain = new Uint8Array(data.length + 1); plain[0] = flag; plain.set(data, 1);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function openMsg(key, bytes){
  try{
    if(bytes.length < 30) return null;
    const plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes.subarray(0, 12)}, key, bytes.subarray(12)));
    let data = plain.subarray(1);
    if(plain[0] === 1){ if(!CAN_ZIP) return null; data = await streamBytes(data, new DecompressionStream('deflate-raw')); }
    return JSON.parse(TD.decode(data));
  }catch(e){ return null; }
}

/* ---------- a table's relay hub: every link, ordered sends, de-duplication ---------- */
function byteSig(b){ let h = 2166136261 >>> 0; const n = b.length, step = Math.max(1, Math.floor(n/96)); for(let i = 0; i < n; i += step){ h ^= b[i]; h = Math.imul(h, 16777619) >>> 0; } for(let i = Math.max(0, n - 24); i < n; i++){ h ^= b[i]; h = Math.imul(h, 16777619) >>> 0; } return n + ':' + h; }

  constructor(code, onEnvelope){
    this.code = code; this.onEnvelope = onEnvelope; this.secrets = null;
    this.nonce = Math.random().toString(36).slice(2, 10); this.seq = 0;
    this.seen = new Map(), this.bseen = new Set(); this.sendQ = Promise.resolve(); this.recvQ = Promise.resolve();
    this.pending = new Map(); this.listeners = new Set(); this.closed = false; this.subs = [];
    this.links = [];
  }
  async start(){
    this.secrets = await roomSecrets(this.code);
    if(this.closed) return;
    this.links = RELAYS.map(u => new MqttLink(u, (t, b) => this.incoming(t, b), () => this.changed()));
    for(const t of this.subs) this.links.forEach(l => l.subscribe(t));
  }
  topic(sub){ return this.secrets.topic + '/' + sub; }
  listen(sub){ const t = this.topic(sub); this.subs.push(t); this.links.forEach(l => l.subscribe(t)); }
  liveCount(){ return this.links.filter(l => l.ready).length; }
  changed(){ for(const f of this.listeners) f(this.liveCount()); }
  onLinks(f){ this.listeners.add(f); }
  waitLive(ms){
    return new Promise(res => {
      if(this.liveCount()) return res(true);
      const f = n => { if(n){ this.listeners.delete(f); clearTimeout(to); res(true); } };
      const to = setTimeout(() => { this.listeners.delete(f); res(false); }, ms);
      this.listeners.add(f);
    });
  }
  /* send(sub, msg, key): with a key, a newer message replaces an older one still waiting (used for full table states) */
  send(sub, msg, key){
    if(this.closed || !this.secrets) return;
    const env = {f:MY_ID, s:this.nonce, m:msg};
    if(key){
      const had = this.pending.has(key);
      this.pending.set(key, env);
      if(had) return;
    }
    this.sendQ = this.sendQ.then(async () => {
      let e = env;
      if(key){ e = this.pending.get(key); this.pending.delete(key); if(!e) return; }
      e.n = ++this.seq;
      const bytes = await sealMsg(this.secrets.key, e);
      const t = this.topic(sub);
      for(const l of this.links) l.publish(t, bytes);
    }).catch(err => console.warn('relay send', err));
  }
  incoming(topic, bytes){
    if(this.closed || !this.secrets) return;
    // the same sealed bytes arrive once per relay: drop the copies before doing any crypto work
    const sig = byteSig(bytes);
    if(this.bseen.has(sig)) return;
    this.bseen.add(sig); if(this.bseen.size > 400){ const it = this.bseen.values(); for(let k = 0; k < 100; k++) this.bseen.delete(it.next().value); }

    this.recvQ = this.recvQ.then(async () => {
      const env = await openMsg(this.secrets.key, bytes);
      if(!env || typeof env !== 'object' || !env.f || !env.s || typeof env.n !== 'number' || env.f === MY_ID && env.s === this.nonce) return;
      const k = env.f + '#' + env.s;

      if(!s){ s = {set:new Set(), max:0}; this.seen.set(k, s); if(this.seen.size > 200) this.seen.delete(this.seen.keys().next().value); }
      if(s.set.has(env.n) || env.n < s.max - 400) return;

      if(s.set.size > 600){ for(const n of s.set){ if(n < s.max - 400) s.set.delete(n); } }
      env.newest = env.n >= s.max;
      this.onEnvelope(topic.slice(this.secrets.topic.length + 1), env);
    }).catch(err => console.warn('relay recv', err)).then(() => { this.pendingIn--; });
  }
  close(){ this.closed = true; this.links.forEach(l => l.close()); this.links = []; this.listeners.clear(); }
}

/* A host-side stand-in for one player's connection (same shape the game engine already uses). */
class RelayConn {
  constructor(hub, clientId){ this.hub = hub; this.peerId = clientId; this.open = true; this.h = {}; }
  on(ev, fn){ this.h[ev] = fn; return this; }
  emit(ev, x){ const f = this.h[ev]; if(f) try{ f(x); }catch(e){ console.warn(e); } }
  send(msg){ if(this.open) this.hub.send('c/' + this.peerId, msg, msg && msg.t === 'state' ? 'st:' + this.peerId : null); }
  close(){ if(!this.open) return; this.open = false; this.emit('close'); }
}

/* ---------- hosting ---------- */
async function createTable(){
  const name = readName(); if(!name) return;
  if(!netSupported()) return homeError("This browser can't do online play. Try Chrome, Safari, Edge, or Firefox.");
  setHomeBusy('Opening your table...');
  myName = name;
  const code = Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join('');
  const h = new RelayHub(code, (sub, env) => hostEnvelope(h, sub, env));
  hub = h;
  try{ await h.start(); }catch(e){ if(hub === h){ hub = null; h.close(); homeError(NO_RELAY); } return; }
  h.listen('h');
  const ok = await h.waitLive(12000);
  if(hub !== h) return;
  if(!ok){ hub = null; h.close(); return homeError(NO_RELAY); }
  isHost = true; G = newGame(code);
  setRoomURL(code);
  handleJoin({id:MY_ID, name, look:myLookCode()}, null);
  const sg = store.get('startGame', 'blackjack');
  if(GAMES[sg] && sg !== G.settings.game){ G.settings.game = sg; G.events = []; broadcast(); }
  startHostLoop();
}
function hostEnvelope(h, sub, env){
  if(hub !== h || !G || sub !== 'h') return;
  const msg = env.m; if(!msg || typeof msg !== 'object') return;
  const id = String(env.f).slice(0, 40);
  if(msg.t === 'join'){
    if(String(msg.id) !== id) return;
    const c = new RelayConn(h, id);
    setupHostConn(c);
    handleJoin(msg, c);
    return;
  }
  const c = conns.get(id);
  if(c) c.emit('data', msg);
}

  conn.on('data', msg => {
    if(!G || !msg || typeof msg !== 'object') return;
    if(msg.t === 'join'){ handleJoin(msg, conn); return; }
    if(conn.clientId && conns.get(conn.clientId) === conn) hostHandle(conn.clientId, msg);
  });
  conn.on('close', () => {
    if(!G || !conn.clientId || conns.get(conn.clientId) !== conn) return;
    conns.delete(conn.clientId);
    const p = P(conn.clientId);
    if(p && p.connected){ markAway(p); broadcast(); }

/* ---------- joining ---------- */
async function joinTable(code){
  const name = readName(); if(!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 5) return showHomeMsg('Table codes are 5 characters long.');
  if(!netSupported()) return homeError("This browser can't do online play. Try Chrome, Safari, Edge, or Firefox.");
  setHomeBusy(`Finding table ${code}...`);
  joinCode = code; myName = name; isHost = false; hostSender = null;
  startClient();
}
async function startClient(){
  if(hub){ const old = hub; hub = null; old.close(); }
  const h = new RelayHub(joinCode, (sub, env) => clientEnvelope(h, sub, env));
  hub = h;
  try{ await h.start(); }catch(e){ if(hub === h){ if(!S) homeError(NO_RELAY); else showLost(); } return; }
  h.listen('c/' + MY_ID);
  let wasLive = false;
  h.onLinks(n => {               // a relay came back after a drop: say hello again
    if(hub !== h) return;
    if(n && !wasLive && S) sendJoin();
    wasLive = n > 0;
  });
  const ok = await h.waitLive(12000);
  if(hub !== h) return;
  if(!ok){ if(!S) homeError(NO_RELAY); else if(!lostShown) showLost(); return; }
  wasLive = true;
  sendJoin();
  startPing();
}
function sendJoin(){
  if(!hub) return;
  hub.send('h', {t:'join', id:MY_ID, name:myName, look:myLookCode()});
  clearTimeout(joinTimer);
  joinTimer = setTimeout(() => {
    if(!S) homeError(`Couldn't find table ${joinCode}. Check the code, and make sure the host still has the game open.`);
    else if(!lostShown && Date.now() - lastHostMsg > 9000) showLost();
  }, 12000);
}
function clientEnvelope(h, sub, env){
  if(hub !== h) return;
  const msg = env.m; if(!msg || typeof msg !== 'object') return;
  if(msg.t === 'state'){
    if(hostSender && env.f !== hostSender) return;
    if(!env.newest) return;
    if(!msg.s || msg.s.hostId !== env.f) return;
    hostSender = env.f;
    lastHostMsg = Date.now();
    clearTimeout(joinTimer); if(lostShown) hideLost(); onState(msg.s);
  }
  else if(hostSender && env.f !== hostSender) return;
  else if(msg.t === 'reject'){ homeError(msg.reason || 'The host turned you away.'); }
  else if(msg.t === 'closed'){ leaveLocal(); renderHome('The host closed the table. Thanks for playing!', true); }
}
function startPing(){
  bgClear(pingTimer);
  pingTimer = bgEvery(() => {
    if(hub && hub.liveCount()) hub.send('h', {t:'ping'});
    if(S && !isHost && !lostShown && Date.now() - lastHostMsg > 15000) showLost();
  }, 3000);
}
function showLost(msg){
  lostShown = true;
  dialog({kind:'lost', title:'Connection lost', ok:'Reconnect', cancel:'Leave',
    text: msg || "Lost connection to the table. This happens when the host's screen locks, their tab closes, or someone's internet drops. It reconnects by itself when things come back.",
    onOk: reconnect, onCancel: () => { leaveLocal(); renderHome(); }});
}
function hideLost(){ lostShown = false; if(modalKind === 'lost') closeModal(); }
function reconnect(){
  lostShown = false; lastHostMsg = Date.now();
  if(hub && hub.liveCount()) sendJoin();
  else startClient();
}

/* ---------- leaving ---------- */
function leaveLocal(keepURL){
  bgClear(pingTimer); clearTimeout(joinTimer); bgClear(hostTimer); clearInterval(chaosTimer);
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
  const h = hub; hub = null; hostSender = null;
  if(h) setTimeout(() => h.close(), 700);
  conns.clear(); G = null; S = null; isHost = false; lostShown = false; joinCode = null;
  closeModal(); if(!keepURL) setRoomURL(null);

}

  if(!isHost && hub){ hub.send('h', {t:'leave'}); }
  leaveLocal(); renderHome();
}

      x.fillStyle = skin; x.beginPath(); x.moveTo(C - 16, 0); x.lineTo(C, 20); x.lineTo(C + 16, 0); x.closePath(); x.fill();

  /* ---------- hair: chunky plastic hair pieces, merged into one mesh per style ---------- */
  function hairGeo(style){
    return cg('hair_' + style, () => {
      const P = [];
      const cap = (h = 0.062) => P.push(part(HW + 0.018, h, HD + 0.018, 0.045, [0, HH/2 + 0.012 - h/2 + 0.02, -0.003]));
      const back = (to) => { const top = HH/2 + 0.01, h = top - to; P.push(part(HW + 0.018, h, 0.045, 0.02, [0, top - h/2, -FZ + 0.012])); };
      const sides = (to, depth = 0.13, z = -0.03) => { const top = HH/2 - 0.005, h = top - to; for(const s of [-1, 1]) P.push(part(0.026, h, depth, 0.011, [s*(HW/2 + 0.01), top - h/2, z])); };
      const fringe = () => P.push(part(0.17, 0.034, 0.03, 0.012, [0.022, HH/2 - 0.012, FZ + 0.004], [0, 0, -0.12]));
      if(style === 'short'){ cap(); back(-0.02); sides(0.03, 0.11, -0.04); fringe(); }
      else if(style === 'buzz'){ P.push(part(HW + 0.008, 0.07, HD + 0.008, 0.05, [0, HH/2 - 0.027, -0.002])); P.push(part(HW + 0.008, 0.11, 0.03, 0.014, [0, 0.0, -FZ + 0.01])); }
      else if(style === 'long'){ cap(); back(-0.27); sides(-0.2, 0.15, -0.025); fringe(); }
      else if(style === 'bob'){ cap(); back(-0.1); sides(-0.085, 0.19, -0.012); P.push(part(HW + 0.006, 0.036, 0.026, 0.012, [0, HH/2 - 0.016, FZ + 0.004])); }
      else if(style === 'bun'){ cap(); back(-0.03); sides(0.03, 0.11, -0.04); P.push(part(0.11, 0.1, 0.1, 0.045, [0, HH/2 + 0.07, -0.05])); }
      else if(style === 'ponytail'){ cap(); back(-0.02); sides(0.03, 0.11, -0.04); fringe();
        P.push(part(0.075, 0.24, 0.06, 0.026, [0, -0.06, -FZ - 0.04], [0.22, 0, 0])); }
      else if(style === 'curly'){
        const b = (x, y, z, s = 0.082) => P.push(part(s, s, s, s*0.42, [x, y, z]));
        for(const xx of [-0.085, 0, 0.085]) for(const zz of [-0.07, 0.0, 0.07]) b(xx, HH/2 + 0.02, zz);
        for(const xx of [-0.085, 0, 0.085]) for(const yy of [0.05, -0.025]) b(xx, yy, -FZ - 0.005);
        for(const s of [-1, 1]) for(const zz of [-0.05, 0.03]) b(s*(HW/2 + 0.01), 0.055, zz, 0.07);
        for(const xx of [-0.06, 0.04]) b(xx, HH/2 + 0.004, FZ - 0.01, 0.07);
      }
      else if(style === 'mohawk'){ P.push(part(0.046, 0.085, HD + 0.03, 0.018, [0, HH/2 + 0.035, -0.008])); P.push(part(0.046, 0.12, 0.04, 0.016, [0, 0.03, -FZ - 0.008])); }
      else if(style === 'swept'){ cap(0.07); back(-0.06); sides(-0.03, 0.15, -0.025);
        P.push(part(0.2, 0.055, 0.05, 0.022, [0.03, HH/2 - 0.005, FZ + 0.006], [0.15, 0, -0.32]));   // the big sweep over the forehead
        P.push(part(0.032, 0.17, 0.12, 0.014, [-(HW/2 + 0.018), -0.005, 0.035], [0, 0, 0.06])); }
      if(!P.length) return null;
      return geo.merge(...P);
    });
  }
  function addHat(head, look){
    const h = look.hat; if(h === 'none') return;

      for(const [x, z] of [[-0.08, 0.075], [0, 0.075], [0.08, 0.075], [-0.08, -0.08], [0.08, -0.08]]) add(head, RB(0.028, 0.04, 0.028, 0.008), m, [x, top + 0.06, z - 0.004]);
      add(head, RB(0.026, 0.026, 0.01, 0.006), plastic('#c41230', {rough:0.1, coat:1, env:1.2}), [0, top + 0.025, 0.088]); }

  }
  function addGlasses(head, look){

  function addBeard(head, look){
    const b = look.beard; if(b === 'none') return;
    if(b === 'stubble'){ const n = add(head, cg('stubbleQ', () => geo.quad(0.17, 0.11)), mat({color:'#ffffff', map:stubbleTex(), rough:0.6, blend:'alpha', depthWrite:false}), [0, -0.052, FZ + 0.0006]); n.castShadow = false; return; }
    const m = plastic(look.hairColor, {rough:0.5, coat:0.25});
    const P = [part(0.09, 0.016, 0.02, 0.007, [0, -0.02, FZ + 0.004])];   // mustache

  }

  /* ---------- avatar ---------- */
  function build(lookIn, opts = {}){
    const look = cleanLook(opts.special === 'myla' && !(lookIn && lookIn.skin) ? MYLA_LOOK : lookIn), standing = !!opts.standing, special = opts.special || null;
    // the imported cartoon models, once they are unpacked (the Buckshot dealer keeps his hooded look)
    if(typeof W3S !== 'undefined' && W3S.use()){ try{ return W3S.build(look, opts); }catch(e){ console.warn('model avatar failed', e); } }
    const dealer = special === 'dealer', fem = look.face === 'lashes' && !dealer;
    const root = new Node(); root.name = 'avatar';
    const body = new Node(); root.add(body);
    const baseY = standing ? 0.8 : 0.66;
    body.pos = [0, baseY, 0];
    const skinHex = dealer ? '#d9d2c6' : look.skin, skin = W3H.skinMaterial(skinHex);
    const topHex = dealer ? '#151012' : look.topColor, topM = cloth(topHex, look.top);
    // body + the printed front of the outfit
    add(body, RB(TW, TH, TD, 0.045), topM, [0, TH/2 - 0.01, 0]);
    const shirtTex = canvasTex(240, 274, (x, W, H) => drawShirt(x, W, H, look, dealer ? 'robe' : look.top, special)); shirtTex.own = true;
    const front = add(body, cg('shirtQ', () => geo.quad(TW - 0.08, TH - 0.09)), mat({color:'#ffffff', map:shirtTex, rough:look.top === 'leather' ? 0.3 : 0.62, coat:look.top === 'leather' ? 0.45 : 0.08, env:look.top === 'leather' ? 0.6 : 0.22}), [0, TH/2 - 0.01, TD/2 + 0.0003]);
    front.castShadow = false;
    if(look.top === 'hoodie' && !special) add(body, RB(0.27, 0.1, 0.07, 0.028), cloth(shade(topHex, -0.18)), [0, TH - 0.04, -TD/2 - 0.012]);
    if(!dealer){ add(body, RB(TW + 0.004, 0.032, TD + 0.004, 0.012), plastic('#1a1210', {rough:0.4, coat:0.4}), [0, 0.0, 0]);
      add(body, RB(0.04, 0.026, 0.01, 0.005), plastic('#c9b07a', {rough:0.25, metal:1}), [0, 0.0, TD/2 + 0.004]); }
    // neck + head
    add(body, RB(0.12, 0.05, 0.11, 0.02), skin, [0, TH - 0.01, 0]);
    const headPivot = new Node(); headPivot.pos = [0, TH + 0.005, 0]; body.add(headPivot);
    const head = new Node(); head.pos = [0, HH/2 + 0.012, 0]; headPivot.add(head);
    add(head, RB(HW, HH, HD, 0.06, 4), dealer ? plastic(skinHex, {rough:0.7, coat:0}) : skin);
    let eyes = null, brows = null, mouth = null;
    if(dealer){
      const mask = add(head, cg('dealerQ', () => geo.quad(0.17, 0.16)), mat({color:'#ffffff', map:dealerFaceTex(), rough:0.7}), [0, -0.005, FZ + 0.0006]); mask.castShadow = false;
      const glow = mat({color:'#ff2a1a', unlit:true, emissive:'#ff2a1a', emisMult:6});
      for(const s of [-1, 1]) add(head, cg('dEye', () => geo.sphere(0.0075, 10, 8)), glow, [s*0.035, 0.014, FZ + 0.002]).castShadow = false;
      // a hood around the head, open at the front, with a peak that shades the face
      const hood = plastic('#0b0909', {rough:0.9, coat:0, env:0.1});
      add(head, cg('hood', () => geo.merge(part(HW + 0.06, 0.035, HD + 0.04, 0.016, [0, HH/2 + 0.02, -0.012]),
        part(0.028, HH + 0.07, HD + 0.04, 0.01, [-(HW/2 + 0.018), -0.01, -0.012]), part(0.028, HH + 0.07, HD + 0.04, 0.01, [HW/2 + 0.018, -0.01, -0.012]),
        part(HW + 0.06, HH + 0.07, 0.028, 0.01, [0, -0.01, -(FZ + 0.03)]), part(HW + 0.06, 0.032, 0.05, 0.012, [0, HH/2 + 0.004, FZ + 0.008], [0.25, 0, 0]))), hood);
    } else {
      // eyes: glossy dark ovals with a white glint, in groups that blink and glance around
      const eyeM = plastic(shade(look.eyes, -0.5), {rough:0.2, coat:0.5, env:0.45}), glint = mat({color:'#ffffff', unlit:true});
      eyes = [];
      for(const s of [-1, 1]){
        const grp = new Node(); grp.pos = [s*0.05, 0.014, FZ]; head.add(grp);
        add(grp, cg('eyeball', () => geo.sphere(1, 16, 12)), eyeM, null, null, [0.017, 0.026, 0.007]);
        add(grp, cg('glint', () => geo.sphere(0.0048, 8, 6)), glint, [-0.0052, 0.0095, 0.0052]).castShadow = false;
        if(fem) add(grp, RB(0.016, 0.005, 0.004, 0.002), plastic('#111111'), [-s*0.016, 0.021, 0.002], [0, 0, -s*0.6]);

      }

      const browHex = look.hair === 'bald' || ['#f0f0f0', '#e9e4da', '#e8d6a0'].includes(look.hairColor) ? shade(look.hairColor === '#e9e4da' ? '#9a8f80' : '#5a3a22', -0.1) : shade(look.hairColor, -0.15);
      brows = [];
      for(const s of [-1, 1]){ const b = add(head, RB(0.042, 0.011, 0.007, 0.004), plastic(browHex, {rough:0.5}), [s*0.05, 0.054, FZ + 0.001]); b.castShadow = false; brows.push({n:b, s}); }
      // mouth decal (swapped for each expression, opens and closes while talking)
      const mouthM = mat({color:'#ffffff', map:mouthTex('smile', fem), rough:0.5, blend:'alpha', depthWrite:false});
      const mq = add(head, cg('mouthQ', () => geo.quad(0.092, 0.052)), mouthM, [0, -0.054, FZ + 0.0012]); mq.castShadow = false;
      mouth = {mat:mouthM, kind:'smile', lips:fem};
      if(fem){ const bm = mat({color:'#ffffff', map:blushTex(), rough:0.6, blend:'alpha', depthWrite:false});
        for(const s of [-1, 1]) add(head, cg('blushQ', () => geo.quad(0.046, 0.03)), bm, [s*0.082, -0.026, FZ + 0.0008]).castShadow = false; }

      add(head, hg, plastic(light ? shade(look.hairColor, -0.16) : look.hairColor, {rough:light ? 0.55 : 0.4, coat:light ? 0.12 : 0.28, env:light ? 0.25 : 0.4})); } }

    const pantsM = cloth(dealer ? '#0b0909' : look.pants), shoeM = plastic(dealer ? '#0b0909' : look.shoes, {rough:0.4, coat:0.35});
    if(dealer){ // a long robe instead of trousers

    } else {
      add(root, RB(TW - 0.02, 0.12, TD - 0.01, 0.03), pantsM, [0, baseY - 0.04, 0]);
      for(const s of [-1, 1]){

        } else {
          add(root, RB(LW, 0.15, 0.43, 0.035), pantsM, [s*0.085, 0.585, 0.15]);
          add(root, RB(LW - 0.01, 0.34, LW - 0.01, 0.033), pantsM, [s*0.085, 0.42, 0.31]);
          add(root, RB(LW, 0.085, 0.22, 0.032), shoeM, [s*0.085, 0.23, 0.36]);
        }
      }
    }
    // arms
    const longSleeve = ['hoodie','suit','shirt','leather','blazer'].includes(look.top) || special === 'myla' || dealer;
    const bareUpper = look.top === 'jersey' && !special;
    const armOpts = () => ({upperMat:bareUpper ? skin : topM, foreMat:longSleeve ? topM : skin,

      upper:standing ? 0.29 : 0.28, fore:standing ? 0.27 : 0.255, w:fem ? AW*0.94 : AW, handScale:fem ? 1.08 : 1.15});

      lookTarget:null, headYaw:0, headPitch:0, breathe:Math.random()*6, lean:0, gaze:[0, 0], saccade:0, browT:[0, 0], browK:[0, 0],

  }

  /* ---------- per-frame life: expressions, blinking, talking, eyes, head turn, breathing ---------- */
  // brow pose per mood: [lift, tilt] (tilt > 0 = angry, inner ends down)
  const BROW = {smile:[0, 0], neutral:[0, 0], happy:[0.005, 0], shock:[0.012, -0.05], sad:[0.004, -0.38], angry:[-0.004, 0.45], grin:[0.004, 0.08], talk:[0.002, 0]};
  function setExpression(av, e, secs = 0){ av.baseExpr = av.baseExpr || 'smile'; if(secs > 0){ av.tempExpr = e; av.exprUntil = performance.now()/1000 + secs; } else av.baseExpr = e; }
  function talk(av, secs = 1.6){ av.talkUntil = performance.now()/1000 + secs; }
  function update(av, dt){
    if(av.skinned) return W3S.update(av, dt);
    const now = performance.now()/1000;
    const e = av.tempExpr && now < av.exprUntil ? av.tempExpr : (av.baseExpr || 'smile');
    const talking = now < av.talkUntil && av.special !== 'dealer';
    av.expr = e;
    // blinking
    av.blinkAt -= dt; if(av.blinkAt < 0){ av.blink = Math.min(1, av.blink + dt/0.06); if(av.blinkAt < -0.14){ av.blinkAt = 2 + Math.random()*4; } } else av.blink = Math.max(0, av.blink - dt/0.09);
    // mouth
    if(av.mouth){
      let kind = MOUTH_OF[e] || 'smile';
      if(talking){ const ph = now*9 + av.breathe; kind = Math.sin(ph)*Math.sin(ph*0.47 + 1.3) > -0.1 ? 'open' : 'smile'; }
      if(kind !== av.mouth.kind){ av.mouth.kind = kind; av.mouth.mat.map = mouthTex(kind, av.mouth.lips); }
    }
    // brows ease toward the mood
    if(av.brows){
      const b = BROW[e] || BROW.smile, k = 1 - Math.exp(-dt*10);
      av.browK[0] += (b[0] - av.browK[0])*k; av.browK[1] += (b[1] - av.browK[1])*k;
      for(const B of av.brows){ B.n.pos = [B.s*0.05, 0.054 + av.browK[0]*F, FZ + 0.001]; B.n.rot = [0, 0, B.s*av.browK[1]]; }
    }
    // breathing + lean
    av.breathe += dt; av.body.scl = [1, 1 + Math.sin(av.breathe*1.6)*0.006, 1];
    av.body.rot = [av.lean, 0, 0];
    // head turn toward a world point
    let yaw = Math.sin(av.breathe*0.31)*0.12, pitch = 0.06 + Math.sin(av.breathe*0.23)*0.03;
    if(av.lookTarget){
      const hp = av.headPivot.worldPos(), d = V.sub(av.lookTarget, hp);
      const inv = G3.qInv(av.root.worldQuat()), ld = G3.qRot(inv, d);
      yaw = Math.max(-1.0, Math.min(1.0, Math.atan2(ld[0], ld[2]))); pitch = Math.max(-0.5, Math.min(0.6, -Math.atan2(ld[1], Math.hypot(ld[0], ld[2]))));
    }
    const k = 1 - Math.exp(-dt*5);

    av.headPivot.rot = [av.headPitch, av.headYaw, 0];
    // eyes: glance ahead of the head toward the target, small saccades; blinks squash them flat
    if(av.eyes){
      av.saccade -= dt; if(av.saccade < 0){ av.saccade = 0.6 + Math.random()*2.2; av.sacc = [(Math.random() - 0.5)*0.12, (Math.random() - 0.5)*0.06]; }
      const gy = Math.max(-0.38, Math.min(0.38, (yaw - av.headYaw)*1.4 + (av.sacc ? av.sacc[0] : 0))), gp = Math.max(-0.25, Math.min(0.25, (pitch - av.headPitch)*1.2 + (av.sacc ? av.sacc[1] : 0)));
      const ke = 1 - Math.exp(-dt*25); av.gaze[0] += (gy - av.gaze[0])*ke; av.gaze[1] += (gp - av.gaze[1])*ke;

  /* ---------------- HUD labels ---------------- */

  // close-up that fits a w x h patch of the table (metres) into the free space between the top bars and the console

W3.games.blackjack = (() => {

  const handFor = (fx, fz) => W3H.handQ(V.norm([fx, -0.25, fz]), [0, 1, 0]);

  function key(S){ return S.settings.target; }
  // fill the middle seats first so everyone gets a good view of Myla
  const ORDER = [2, 3, 1, 4, 0, 5];
  const seatIx = (n) => n < ORDER.length ? ORDER[n] : null;
  const mySeat = () => { const n = W3.seatOf(MY_ID); return n < 0 ? null : seatIx(n); };
  function build(ctx){
    X = ctx; cards = new Map(); piles = new Map(); seen = {round:null, phase:null};
    const room = W3R.casino(); ctx.scene.add(room.root);
    T = W3T.blackjack(S.settings.target); ctx.scene.add(T.root);
    D = ctx.actor('myla', null, {standing:true, special:'myla'}); ctx.place(D, V.add(T.dealer.pos, [0, -0.07, 0]), 0);

  }
  /* ---------- positions ---------- */
  const seatAt = (s, r, da = 0) => [T.C[0] + Math.cos(s.ang + da)*r, TOP, T.C[1] + Math.sin(s.ang + da)*r];
  const spotPos = (s, k) => k === 'main' ? seatAt(s, 0.9) : k === 'pp' ? seatAt(s, 1.02, 0.075) : k === 'p21' ? seatAt(s, 1.02, -0.075)

  /* ---------- people ---------- */
  function restDealer(now){
    for(const [k, x] of [['R', -0.3], ['L', 0.3]]){
      const c = D.arms[k];
      const p = [x, TOP + 0.035, T.dealer.pos[2] + 0.36];
      if(now){ c.pos = p; c.q = handFor(-x*0.4, 1); W3H.setPose(c.arm.hand, 'relaxed', 0.0001); }

  }
  function restPlayer(A, s, dur = 0.4){
    const ps = [];

      ps.push(X.arm(c, [r[0], TOP + 0.028, r[1]], {dur, q:X.hq(A, [-c.out*0.25, -0.15, 1]), pose:'relaxed'})); }
    return Promise.all(ps);
  }
  function syncPlayers(){
    const want = new Set(['myla']);
    S.players.forEach((p, n) => {
      const i = seatIx(n); if(i == null) return;
      const s = T.seats[i]; want.add(p.id);
      const A = X.actor(p.id, W3.lookOf(p), {});
      if(A.seat !== i){ A.seat = i; X.place(A, s.chair, s.yaw); restPlayer(A, s, 0.0001); }
      A.isMe = p.id === MY_ID; A.av.headPivot.visible = !A.isMe;
      A.p = p;
    });
    for(const id of [...X.actors.keys()]) if(!want.has(id)){ X.removeActor(id); clearPiles(id); }
  }

  /* ---------- cards ---------- */
  function wantCards(){
    const out = [];
    S.dealer.hand.forEach((c, i) => out.push({id:c.id, c, owner:'D', i, n:S.dealer.hand.length}));
    S.players.forEach((p, n) => { const si = seatIx(n); if(si != null && p.inRound) p.hand.forEach((c, i) => out.push({id:c.id, c, owner:si, pid:p.id, i, n:p.hand.length})); });
    return out;
  }
  const slot = (w) => w.owner === 'D' ? T.dealerCards(w.i, w.n) : T.seats[w.owner].cards(w.i, w.n);
  function syncCards(){
    const want = wantCards(), ids = new Set(want.map(w => w.id));

  async function dealCard(r){

    node.pos = V.add(T.shoe, [0, -0.01, 0.05]); node.visible = true;
    const dir = V.norm(V.sub(to, T.shoe));
    const hand = X.arm(L, X.reach(L, V.add(to, [0, 0.05, 0]), 0.85, TOP + 0.06), {dur:0.12, lift:0.02, q:handFor(dir[0], dir[2]), pose:'relaxed'});

    await hand;
  }
  async function flipCard(r){
    const R = D.arms.R, p = r.node.pos.slice();
    await X.arm(R, X.reach(R, V.add(p, [0.02, 0.02, -0.03])), {dur:0.25, pose:'pinch', q:handFor(0.2, 1)});
    await X.fly(r.node, V.add(p, [0, 0, 0]), {dur:0.32, lift:0.05, flip:0, A:D});
    r.landed = true; refreshLabels();
    restDealer();
  }
  async function peekHole(){
    const r = [...cards.values()].find(x => x.owner === 'D' && x.i === 1); if(!r) return;
    const R = D.arms.R;
    await X.arm(R, X.reach(R, V.add(r.node.pos, [0.02, 0.015, -0.04])), {dur:0.25, pose:'pinch', q:handFor(0.1, 1)});
    await G3.tween(r.node, 'tilt', -0.45, 0.25); await wait(0.5); await G3.tween(r.node, 'tilt', 0, 0.2);
    restDealer();
  }
  async function sweepCards(list){
    const R = D.arms.R; const disc = T.discard;
    const xs = list.map(r => r.node.pos[0]); const minX = Math.min(...xs), maxX = Math.max(...xs);
    await X.arm(R, [Math.max(-0.55, minX), TOP + 0.03, T.dealer.pos[2] + 0.5], {dur:0.3, pose:'flat', q:handFor(0.3, 1)});
    const hand = X.arm(R, [Math.min(0.0, maxX), TOP + 0.03, T.dealer.pos[2] + 0.45], {dur:0.45, pose:'flat'});
    await Promise.all(list.map((r, k) => wait(k*0.03).then(() => X.fly(r.node, V.add(disc, [0, 0.01 + k*0.0005, 0]), {dur:0.42, lift:0.08, flip:Math.PI, yaw:0.5, A:D}))));
    await hand;
    for(const r of list) X.forget(r.node);
    restDealer();
  }

  /* ---------- player gestures ---------- */
  function tapFor(A, r){
    return X.gesture(A, async () => {
      const s = T.seats[A.seat], c = A.arms.R, p = seatAt(s, 0.8, -0.04);
      await X.arm(c, [p[0], TOP + 0.07, p[2]], {dur:0.22, pose:'point', q:X.hq(A, [0.2, -0.75, 0.6])});
      for(let k = 0; k < 2; k++){ await X.arm(c, [p[0], TOP + 0.03, p[2]], {dur:0.09}); await X.arm(c, [p[0], TOP + 0.07, p[2]], {dur:0.1}); }
      await restPlayer(A, s, 0.35);
    });
  }
  function waveFor(A){
    return X.gesture(A, async () => {

      const t = [-Math.sin(s.ang)*0.07, 0, Math.cos(s.ang)*0.07];
      await X.arm(c, [p[0], TOP + 0.09, p[2]], {dur:0.25, pose:'flat', q:X.hq(A, [0.15, -0.2, 1])});
      for(let k = 0; k < 2; k++){ await X.arm(c, V.add([p[0], TOP + 0.09, p[2]], t), {dur:0.13}); await X.arm(c, V.sub([p[0], TOP + 0.09, p[2]], t), {dur:0.13}); }
      await restPlayer(A, s, 0.35);
    });
  }
  function cheerFor(A, big){
    W3P.setExpression(A.av, 'happy', 3);
    if(!big) return;
    return X.gesture(A, async () => {
      const s = T.seats[A.seat], c = A.arms.L, p = A.arms.L.pos || s.rest.L;
      const up = X.local(A, [0.22, 1.2, 0.3]);
      await X.arm(c, up, {dur:0.25, pose:'fist', q:X.hq(A, [0, 1, 0.2], [0, 0, -1])});
      await X.arm(c, V.add(up, [0, -0.08, 0]), {dur:0.15}); await X.arm(c, up, {dur:0.15});
      await restPlayer(A, s, 0.4);
    });
  }
  function upsetFor(A){

      const s = T.seats[A.seat];
      await Promise.all(['R', 'L'].map(k => { const c = A.arms[k]; return X.arm(c, X.local(A, [c.out*0.16, 1.02, 0.32]), {dur:0.3, pose:'spread', q:X.hq(A, [-c.out*0.3, 0.6, 0.6], [0, 0.3, -1])}); }));

    });
  }
  // chips: from the player's rack to a spot (bet) or back again

      const s = T.seats[A.seat], c = A.arms.R;

      const a = fromSpot ? spot : rack, b = fromSpot ? rack : spot;
      await X.arm(c, [a[0], TOP + 0.03, a[2]], {dur:0.24, pose:'pinch', q:X.hq(A, [0.1, -0.7, 0.7])});
      const chip = W3A.singleChip(W3A.splitAmount(amt)[0] || 1); X.scene.add(chip); X.carry(chip, c, [0, 0, -0.006], qEuler(Math.PI/2, 0, 0));

  function collectFor(A, keys){

        X.arm(L, V.add([main[0], TOP + 0.03, main[2]], X.ldir(A, [0.08, 0, 0])), {dur:0.3, pose:'cup', q:X.hq(A, [-0.6, -0.3, 0.7])})]);

  /* ---------- chip piles ---------- */

    const b = p.bets || {};
    if(S.phase === 'betting' || S.phase === 'lobby' || !p.inRound){ if(S.phase === 'betting'){ w.main = b.main || 0; w.pp = b.pp || 0; w.p21 = b.p21 || 0; } return w; }
    w.main = p.main || b.main || 0;

      for(const k of ['main', 'pp', 'p21', 'pay', 'payPP', 'pay21']){

  async function payOut(A, k, amt){

  }
  function syncRacks(){

      const P = pilesOf(p.id); if(!P.rack || P.rack.amt !== p.chips) setPile(p.id, 'rack', p.chips); }
  }

  /* ---------- reactions from state changes ---------- */
  function reactions(prev){
    if(!prev) return;
    for(const p of S.players){
      const A = X.actors.get(p.id), q = prev.players.find(x => x.id === p.id); if(!A || !q) continue;
      if(p.status === 'stand' && q.status === 'playing' && !p.doubled && S.phase !== 'results') waveFor(A);
      if(p.status === 'bust' && q.status !== 'bust') upsetFor(A);
      if(p.status === 'blackjack' && q.status !== 'blackjack') cheerFor(A, true);
      if(S.phase === 'results' && prev.phase !== 'results' && p.inRound){
        if(p.delta > 0) cheerFor(A, p.delta >= p.main*1.5); else if(p.delta < 0 && p.status !== 'bust') W3P.setExpression(A.av, 'sad', 3);
      }

    if(S.sayId !== prev.sayId) W3P.talk(D.av, Math.min(3.5, 0.8 + (S.say || '').length*0.045));
  }

  /* ---------- labels ---------- */
  function shownValue(list){
    const cs = list.filter(r => r.landed && !r.back).sort((a, b) => a.i - b.i).map(r => r.node.cardKey).filter(Boolean)
      .map(k => ({r:k.slice(0, -1), s:k.slice(-1)}));
    return cs.length ? handValue(cs, S.settings.target).total : null;
  }
  function refreshLabels(){
    if(!T || !S) return;
    const L = [];
    const all = [...cards.values()];
    // the dealer's total
    const dl = all.filter(r => r.owner === 'D');
    if(dl.length){ const v = shownValue(dl), hidden = dl.some(r => r.back || !r.landed);
      if(v != null) L.push({key:'dtot', at:V.add(T.dealerCards(0, 1), [0, 0.03, -0.07]), html:`${S.dealer.bj && !hidden ? 'BJ' : v}`, cls:'w3tot' + (v > S.settings.target ? ' bust' : '')}); }
    S.players.forEach((p, n) => {
      const i = seatIx(n); if(i == null) return;
      const A = X.actors.get(p.id); if(!A) return;
      const s = T.seats[i], mine = p.id === MY_ID;
      const turn = S.phase === 'playing' && S.turn === p.id;
      if(!mine) L.push({key:'n' + p.id, at:() => V.add(A.av.headPivot.worldPos(), [0, 0.34, 0]),
        html:`<b>${esc(p.name)}</b><span>${short(p.chips)}</span>`, cls:'w3name' + (turn ? ' turn' : '') + (!p.connected ? ' away' : '')});
      const mineCards = all.filter(r => r.pid === p.id);
      if(mineCards.length){
        const v = shownValue(mineCards); const res = S.phase === 'results' && p.inRound && p.result;
        let html = v == null ? '' : p.status === 'blackjack' && mineCards.every(r => r.landed) ? 'BJ' : p.status === 'bust' && mineCards.every(r => r.landed) ? 'BUST' : String(v), cls = 'w3tot';
        if(res){ const d = p.delta; html = p.result === 'bj' ? `BJ +${short(d)}` : d > 0 ? `+${short(d)}` : d < 0 ? `${p.status === 'bust' ? 'BUST' : 'LOST'} ${short(-d)}` : 'PUSH'; cls += d > 0 ? ' win' : d < 0 ? ' lose' : ' push'; }
        else if(p.status === 'bust') cls += ' bust';
        if(turn) cls += ' turn';
        if(html) L.push({key:'t' + p.id, at:V.add(s.cards(0, 1), [0, 0.035, 0]), html, cls});
      } else if(S.phase === 'betting' && !mine && p.ready) L.push({key:'t' + p.id, at:V.add(spotPos(s, 'main'), [0, 0.05, 0]), html:'&#10003;', cls:'w3tot ok'});
    });
    L.push(...W3.sayLabel('MYLA', () => V.add(D.av.headPivot.worldPos(), [0, 0.38, 0])));
    X.labels(L);
  }

  /* ---------- sync ---------- */
  let prevS = null;
  function sync(ctx, S){
    X = ctx;
    syncPlayers();
    reactions(prevS);
    syncCards();
    syncPiles();
    refreshLabels();
    prevS = S;
  }
  function frame(ctx, dt){

      await X.arm(c, X.local(A, [-0.3, 1.55, 0.12]), {dur:0.35, pose:'flat', q:X.hq(A, [0, 1, 0.1], [0, 0, -1])});
      for(let k = 0; k < 2; k++){ await X.arm(c, X.local(A, [-0.36, 1.55, 0.12]), {dur:0.16}); await X.arm(c, X.local(A, [-0.24, 1.55, 0.12]), {dur:0.16}); }
      await X.arm(c, X.local(A, [-0.25, 0.82, 0.04]), {dur:0.4, pose:'relaxed', q:X.hq(A, [0, -1, 0.15], [-1, 0, 0])});
    });
  }
  function frame(ctx, dt){
    if(!A) return;

    A.av.lookTarget = V.add(X.cam.pos, [0, -0.1, 0]);

  function camera(ctx){
    const now = performance.now();
    if(now - panel.t > 400){ panel.t = now; const p = document.querySelector('#creator .crPanel'); const W = innerWidth, H = innerHeight;
      if(p){ const r = p.getBoundingClientRect(); const side = r.left > W*0.3; panel.side = side; panel.w = side ? W - r.left : 0; panel.h = side ? 0 : H - r.top; } }
    const W = innerWidth, H = innerHeight;
    const region = Math.max(0.3, (H - (panel.h || 0))/H);

/* =====================================================================
   3D BACCARAT: every seat has its own Player / Banker / Tie / Pair
   boxes, Myla deals the two hands from the shoe and flips them, the
   player who has the shoe this round gives the signal, chips get paid
   or swept.
   ===================================================================== */
W3.games.baccarat = (() => {
  const {Node, geo, mat, V, qEuler, wait, canvasTex} = G3;
  const TOP = W3T.TOP;
  const C = [0, -0.42], R = 1.2;
  const ORDER = [2, 3, 1, 4, 0, 5];
  // per seat: [radius, angle offset, box radius]
  const ZONES = {P:[0.97, 0, 0.085], B:[0.81, 0, 0.075], T:[0.67, 0, 0.055], PP:[1.07, 0.085, 0.04], BP:[1.07, -0.085, 0.04]};
  const PAYS = {P:1, B:0.95, T:8, PP:11, BP:11};
  const LBL = {P:'PLAYER', B:'BANKER', T:'TIE', PP:'P PAIR', BP:'B PAIR'};
  let X = null, T = null, D = null, piles = new Map(), cards = new Map(), prevS = null;
  const seats = () => T.seats;
  const zonePos = (s, k) => { const [r, da] = ZONES[k]; return [C[0] + Math.cos(s.ang + da)*r, TOP, C[1] + Math.sin(s.ang + da)*r]; };
  const HAND = {P:[-0.2, C[1] + 0.33], B:[0.2, C[1] + 0.33]};
  const cardSpot = (side, i) => i < 2 ? [HAND[side][0] + (i - 0.5)*0.07, TOP + 0.001 + i*0.0006, HAND[side][1]] : [HAND[side][0] + (side === 'P' ? -0.1 : 0.1), TOP + 0.002, HAND[side][1] + 0.01];

  let feltCache = null;
  function feltTex(){
    return feltCache || (feltCache = canvasTex(2048, 1024, (x, W, H) => {
      W3A.feltNoise(x, W, H, '#7a1020', 16);
      const g = x.createRadialGradient(W/2, 0, 50, W/2, 0, W*0.62); g.addColorStop(0, 'rgba(255,255,255,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0.3)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      const px = (xx) => (xx + R)/(2*R)*W, py = (zz) => (zz - C[1])/R*H, s = W/(2*R), gold = '#e9c76a';
      x.strokeStyle = gold; x.lineWidth = 4;
      for(const r of [0.6, 0.74, 0.89, 1.04]){ x.beginPath(); x.arc(px(C[0]), py(C[1]), r*s, 0.04*Math.PI, 0.96*Math.PI); x.stroke(); }
      W3T.arcText(x, 'BANKER PAYS 0.95 TO 1', px(C[0]), py(C[1]), 0.52*s, Math.PI/2, `bold ${0.04*s}px Georgia, serif`, gold, 1.05);
      W3T.arcText(x, 'TIE PAYS 8 TO 1  ·  PAIRS PAY 11 TO 1', px(C[0]), py(C[1]), 0.44*s, Math.PI/2, `${0.026*s}px Georgia, serif`, 'rgba(233,199,106,0.8)', 1.1);
      x.font = `italic ${0.08*s}px Georgia, serif`; x.fillStyle = 'rgba(233,199,106,0.35)'; x.textAlign = 'center'; x.fillText("Whylo's Baccarat", px(C[0]), py(C[1]) + 0.24*s);
      // card boxes for the two hands
      for(const [k, [hx, hz]] of Object.entries(HAND)){ x.strokeStyle = k === 'P' ? '#9fc6ff' : '#ff9fa8'; x.lineWidth = 4; x.strokeRect(px(hx - 0.17), py(hz - 0.07), 0.34*s, 0.15*s);
        x.fillStyle = x.strokeStyle; x.font = `bold ${0.03*s}px Arial`; x.fillText(k === 'P' ? 'PLAYER' : 'BANKER', px(hx), py(hz + 0.11)); }
      for(const st of W3T.SEATS_BJ){
        for(const k of Object.keys(ZONES)){ const p = zonePos(st, k), r = ZONES[k][2];
          x.save(); x.translate(px(p[0]), py(p[2]));
          x.fillStyle = k === 'P' || k === 'PP' ? 'rgba(40,90,200,0.35)' : k === 'B' || k === 'BP' ? 'rgba(200,40,60,0.35)' : 'rgba(30,140,80,0.4)';
          x.beginPath(); x.arc(0, 0, r*s, 0, Math.PI*2); x.fill(); x.strokeStyle = gold; x.lineWidth = 3; x.stroke();
          x.rotate(st.ang - Math.PI/2); x.fillStyle = '#f6e7c0'; x.font = `bold ${(k.length > 1 ? 0.016 : 0.022)*s}px Arial`; x.textAlign = 'center'; x.textBaseline = 'middle';
          x.fillText(LBL[k], 0, 0); x.restore(); }
      }
    }));
  }

  function build(ctx){
    X = ctx; piles = new Map(); cards = new Map(); prevS = null;
    const room = W3R.casino(); ctx.scene.add(room.root);
    T = W3T.blackjack(21, feltTex()); ctx.scene.add(T.root);
    D = ctx.actor('myla', null, {standing:true, special:'myla'}); ctx.place(D, V.add(T.dealer.pos, [0, -0.07, 0]), 0);
    restDealer(true);
    return {env:room.env};
  }
  const seatIx = (n) => n < ORDER.length ? ORDER[n] : null;
  const mySeat = () => { const n = W3.seatOf(MY_ID); return n < 0 ? null : seatIx(n); };
  function restDealer(now){
    for(const [k, x] of [['R', -0.3], ['L', 0.3]]){
      const c = D.arms[k], p = [x, TOP + 0.035, T.dealer.pos[2] + 0.36], q = W3H.handQ(V.norm([x*0.4, -0.25, 1]), [0, 1, 0]);
      if(now){ c.pos = p; c.q = q; } else X.arm(c, p, {dur:0.35, q, pose:'relaxed'});
    }
  }
  function restPlayer(A, dur = 0.4){
    const s = seats()[A.seat], ps = [];
    for(const k of ['R', 'L']){ const c = A.arms[k], r = s.rest[k];
      ps.push(X.arm(c, [r[0], TOP + 0.028, r[1]], {dur, q:X.hq(A, [-c.out*0.25, -0.15, 1]), pose:'relaxed'})); }
    return Promise.all(ps);
  }
  function syncPlayers(){
    const want = new Set(['myla']);
    S.players.forEach((p, n) => {
      const i = seatIx(n); if(i == null) return; want.add(p.id);
      const s = seats()[i], A = X.actor(p.id, W3.lookOf(p), {});
      if(A.seat !== i){ A.seat = i; X.place(A, s.chair, s.yaw); restPlayer(A, 0.0001); }
      A.isMe = p.id === MY_ID; A.av.headPivot.visible = !A.isMe; A.p = p;
    });
    for(const id of [...X.actors.keys()]) if(!want.has(id)){ X.removeActor(id); dropPiles(id); }
  }

  /* ---------- cards ---------- */
  function syncCards(){
    const b = S.bac || {player:[], banker:[]};
    const want = [...b.player.map((c, i) => ({id:c.id ?? ('P' + i + c.r + c.s), c, side:'P', i})), ...b.banker.map((c, i) => ({id:c.id ?? ('B' + i + c.r + c.s), c, side:'B', i}))];
    const ids = new Set(want.map(w => w.id));
    const gone = [...cards.values()].filter(r => !ids.has(r.id));
    if(gone.length){ for(const r of gone) cards.delete(r.id); X.gesture(D, () => sweepCards(gone)); }
    // deal in the order they were revealed: P1 B1 P2 B2 (then the thirds)
    const fresh = want.filter(w => !cards.has(w.id)).sort((a, b2) => (a.i - b2.i) || (a.side === 'P' ? -1 : 1));
    const by = b.by && X.actors.get(b.by);
    for(const w of fresh){
      const node = W3A.card(w.c); node.visible = false; X.scene.add(node); X.orient(node, -0.5, Math.PI, 0); node.pos = T.shoe.slice();
      const r = {id:w.id, node, side:w.side, i:w.i, landed:false, c:w.c}; cards.set(w.id, r);
      if(by && by.seat != null) X.gesture(by, async () => {   // the shooter calls for the card with a flick of the hand
        const c = by.arms.R, p = zonePos(seats()[by.seat], 'T');
        await X.arm(c, [p[0], TOP + 0.06, p[2]], {dur:0.25, pose:'flat', q:X.hq(by, [0.1, -0.4, 1])});
        await X.arm(c, [p[0], TOP + 0.03, p[2]], {dur:0.12}); await restPlayer(by, 0.35);
      });
      X.gesture(D, () => dealCard(r));
    }
    if(fresh.length) X.gesture(D, async () => { await wait(0.2); restDealer(); });
  }
  async function dealCard(r){
    const L = D.arms.L, R2 = D.arms.R, to = cardSpot(r.side, r.i), yaw = r.i >= 2 ? Math.PI/2 : 0;
    await X.arm(L, V.add(T.shoe, [-0.01, 0, 0.03]), {dur:0.12, pose:'pinch', q:W3H.handQ(V.norm([-0.3, -0.25, 0.9]), [0, 1, 0])});
    r.node.pos = V.add(T.shoe, [0, -0.01, 0.05]); r.node.visible = true;
    const hand = X.arm(L, X.reach(L, V.add(to, [0, 0.05, 0]), 0.9, TOP + 0.06), {dur:0.18, lift:0.02, pose:'relaxed'});
    await X.fly(r.node, to, {dur:0.3, lift:0.04, yaw, A:D});
    await hand;
    // flip it face up
    await X.arm(R2, X.reach(R2, V.add(to, [0.02, 0.02, -0.03])), {dur:0.16, pose:'pinch', q:W3H.handQ(V.norm([0.2, -0.25, 1]), [0, 1, 0])});
    await X.fly(r.node, to, {dur:0.26, lift:0.05, flip:0, A:D});
    r.landed = true; refreshLabels();
  }
  async function sweepCards(list){
    const R2 = D.arms.R;
    await X.arm(R2, [-0.25, TOP + 0.03, C[1] + 0.3], {dur:0.25, pose:'flat', q:W3H.handQ(V.norm([0.3, -0.2, 1]), [0, 1, 0])});
    const hand = X.arm(R2, [0.15, TOP + 0.03, C[1] + 0.28], {dur:0.4, pose:'flat'});
    await Promise.all(list.map((r, k) => wait(k*0.04).then(() => X.fly(r.node, V.add(T.discard, [0, 0.01 + k*0.0005, 0]), {dur:0.4, lift:0.08, flip:Math.PI, yaw:0.4, A:D}))));
    await hand; for(const r of list) X.forget(r.node); restDealer();
  }

  /* ---------- chips ---------- */
  const won = (k, b) => b && b.winner && ((k === 'P' && b.winner === 'P') || (k === 'B' && b.winner === 'B') || (k === 'T' && b.winner === 'T') || (k === 'PP' && b.pPair) || (k === 'BP' && b.bPair));
  const pushed = (k, b) => b && b.winner === 'T' && (k === 'P' || k === 'B');
  function pilesOf(id){ if(!piles.has(id)) piles.set(id, {}); return piles.get(id); }
  function setPile(A, key, amt, pos){
    const P = pilesOf(A.id), cur = P[key];
    if(cur && cur.amt === amt) return;
    if(cur && cur.node) X.forget(cur.node);
    if(!amt){ P[key] = {amt:0, node:null, sched:cur ? cur.sched : 0}; return; }
    const n = W3A.pile(amt, {maxCol:8}); n.pos = pos.slice(); n.pos[1] = TOP + 0.0007; X.scene.add(n);
    P[key] = {amt, node:n, sched:cur ? cur.sched : amt};
  }
  function dropPiles(id){ const P = piles.get(id); if(!P) return; for(const k in P) if(P[k].node) X.forget(P[k].node); piles.delete(id); }
  const rackPos = (A) => { const s = seats()[A.seat]; return [C[0] + Math.cos(s.ang - 0.03)*1.13, TOP, C[1] + Math.sin(s.ang - 0.03)*1.13]; };
  const keyPos = (A, key) => { const s = seats()[A.seat]; if(key.startsWith('pay:')) return V.add(zonePos(s, key.slice(4)), [Math.cos(s.ang + Math.PI/2)*0.045, 0, Math.sin(s.ang + Math.PI/2)*0.045]); return zonePos(s, key); };
  function chipTo(A, key, amt, onArrive, back){
    return X.gesture(A, async () => {
      const c = A.arms.R, rack = rackPos(A), spot = keyPos(A, key), from = back ? spot : rack, dest = back ? rack : spot;
      await X.arm(c, X.reach(c, V.add(from, [0, 0.03, 0])), {dur:0.24, pose:'pinch', q:X.hq(A, [0.1, -0.7, 0.7])});
      const chip = W3A.singleChip(W3A.splitAmount(amt)[0] || 1); X.scene.add(chip); X.carry(chip, c, [0, 0, -0.006], qEuler(Math.PI/2, 0, 0));
      if(back) onArrive && onArrive();
      await X.arm(c, X.reach(c, V.add(dest, [0, 0.03, 0])), {dur:0.32, lift:0.06});
      X.forget(chip); if(!back) onArrive && onArrive();
      await restPlayer(A, 0.3);
    });
  }
  function collect(A, keys){
    return X.gesture(A, async () => {
      const c = A.arms.R, P = pilesOf(A.id), rack = rackPos(A);
      const nodes = keys.map(k => P[k] && P[k].node).filter(Boolean);
      if(nodes.length){ await X.arm(c, X.reach(c, V.add(nodes[0].pos, [0, 0.03, 0])), {dur:0.3, pose:'cup', q:X.hq(A, [0.4, -0.4, 0.7])});
        await Promise.all(nodes.map((n, i) => wait(i*0.05).then(() => X.fly(n, V.add(rack, [0, 0, 0]), {dur:0.4, lift:0.04, A})))); }
      for(const k of keys) setPile(A, k, 0, [0, 0, 0]);
      await restPlayer(A, 0.3);
    });
  }
  function syncPiles(){
    const b = S.phase === 'results' ? S.bac : null;
    for(const p of S.players){
      const A = X.actors.get(p.id); if(!A || A.seat == null) continue;
      const P = pilesOf(p.id), want = {};
      const bets = (S.phase === 'betting' || p.inRound) && S.phase !== 'lobby' ? (p.bets || {}) : {};
      for(const [k, amt] of Object.entries(bets)){ if(!ZONES[k]) continue;
        if(b && b.winner){ if(won(k, b)){ want[k] = amt; want['pay:' + k] = Math.floor(amt*PAYS[k]); } else want[k] = pushed(k, b) ? amt : 0; }
        else want[k] = amt; }
      const keys = new Set([...Object.keys(P).filter(k => k !== 'rack'), ...Object.keys(want)]), back = [];
      for(const key of keys){
        const target = want[key] || 0, cur = P[key] || {amt:0, sched:0};
        if(cur.sched === target) continue;
        const was = cur.sched; P[key] = {...cur, sched:target};
        if(key.startsWith('pay:')){ if(target > was) X.gesture(D, () => payOut(A, key, target)); else if(!target) back.push(key); continue; }
        if(target > was) chipTo(A, key, target - was, () => setPile(A, key, target, keyPos(A, key)));
        else if(S.phase === 'betting' || S.phase === 'lobby'){ if(target) chipTo(A, key, was - target, () => setPile(A, key, target, keyPos(A, key)), true); else back.push(key); }
        else X.gesture(D, () => sweep(A, key));
      }
      if(back.length) collect(A, back);
    }
  }
  async function payOut(A, key, amt){
    const R2 = D.arms.R, from = V.add(T.tray, [-0.1, 0, 0]), to = keyPos(A, key);
    await X.arm(R2, X.reach(R2, V.add(from, [0, 0.03, 0])), {dur:0.25, pose:'pinch', q:W3H.handQ(V.norm([0, -0.3, 1]), [0, 1, 0])});
    const n = W3A.pile(amt, {maxCol:8}); n.pos = from; X.scene.add(n);
    const hand = X.arm(R2, X.reach(R2, V.add(to, [0, 0.04, 0]), 1, TOP + 0.05), {dur:0.3});
    await X.fly(n, [to[0], TOP + 0.0007, to[2]], {dur:0.42, lift:0.04, A:D});
    X.forget(n); setPile(A, key, amt, to); await hand; restDealer();
  }
  async function sweep(A, key){
    const P = pilesOf(A.id), cur = P[key]; if(!cur || !cur.node) return;
    const n = cur.node; P[key] = {amt:0, node:null, sched:0};
    const R2 = D.arms.R;
    await X.arm(R2, X.reach(R2, V.add(n.pos, [0, 0.03, 0])), {dur:0.25, pose:'cup', q:W3H.handQ(V.norm([0.3, -0.4, 1]), [0, 1, 0])});
    await X.fly(n, V.add(T.tray, [0.08, 0.005, 0]), {dur:0.38, lift:0.03, A:D});
    X.forget(n); restDealer();
  }
  function syncRacks(){
    for(const p of S.players){ const A = X.actors.get(p.id); if(!A || A.seat == null || A.qn) continue;
      const P = pilesOf(p.id); if(!P.rack || P.rack.amt !== p.chips) setPile(A, 'rack', p.chips, rackPos(A)); }
  }

  /* ---------- labels ---------- */
  function refreshLabels(){
    if(!T) return;
    const L = [], b = S.bac || {player:[], banker:[], history:[]};
    S.players.forEach((p, n) => {
      const i = seatIx(n); if(i == null || p.id === MY_ID) return;
      const A = X.actors.get(p.id); if(!A) return;
      let em = '';
      if(S.phase === 'betting') em = p.ready ? (p.bet ? `BET ${short(p.bet)}` : 'SITTING OUT') : 'BETTING...';
      else if(S.phase === 'results' && p.inRound) em = p.delta > 0 ? `+${short(p.delta)}` : p.delta < 0 ? `-${short(-p.delta)}` : 'PUSH';
      if(b.by === p.id && (S.phase === 'dealing' || S.phase === 'shooter')) em = 'HAS THE SHOE';
      L.push({key:'n' + p.id, at:() => V.add(A.av.headPivot.worldPos(), [0, 0.34, 0]), html:`<b>${esc(p.name)}</b><span>${short(p.chips)}</span>${em ? `<em>${em}</em>` : ''}`,
        cls:'w3name' + (S.phase === 'shooter' && S.turn === p.id ? ' turn' : '') + (!p.connected ? ' away' : '')});
    });
    for(const side of ['P', 'B']){
      const list = [...cards.values()].filter(r => r.side === side && r.landed);
      if(!list.length) continue;
      const v = bacTotal(list.map(r => r.c)), win = S.phase === 'results' && b.winner === side;
      L.push({key:'tot' + side, at:V.add([HAND[side][0], TOP, HAND[side][1]], [0, 0.04, 0.1]), html:`${side === 'P' ? 'PLAYER' : 'BANKER'} ${v}`, cls:'w3tot' + (win ? ' win' : '') + (S.phase === 'results' && b.winner === 'T' ? ' push' : '')});
    }
    if(b.history && b.history.length) L.push({key:'road', at:V.add(T.shoe, [0.05, 0.3, -0.05]), html:b.history.slice(-10).map(x => `<i class="${x === 'P' ? 'black' : x === 'B' ? 'red' : 'green'}">${x}</i>`).join(''), cls:'w3hist road'});
    L.push(...W3.sayLabel('MYLA', () => V.add(D.av.headPivot.worldPos(), [0, 0.38, 0])));
    X.labels(L);
  }

  function sync(ctx){
    X = ctx;
    syncPlayers(); syncCards(); syncPiles(); refreshLabels();
    if(prevS && S.sayId !== prevS.sayId) W3P.talk(D.av, Math.min(3.5, 0.8 + (S.say || '').length*0.045));
    if(prevS && S.phase === 'results' && prevS.phase !== 'results') for(const p of S.players){ const A = X.actors.get(p.id); if(A && p.inRound) W3P.setExpression(A.av, p.delta > 0 ? 'happy' : p.delta < 0 ? 'sad' : 'smile', 3); }
    prevS = S;
  }
  function frame(ctx, dt){
    syncRacks();
    const sh = S.phase === 'shooter' && S.turn ? X.actors.get(S.turn) : null;
    D.av.lookTarget = sh ? sh.av.headPivot.worldPos() : S.phase === 'dealing' ? [0, TOP, C[1] + 0.33] : [0, 1.0, 0.6];
    for(const A of X.actors.values()){ if(A === D || A.seat == null) continue;
      A.av.lookTarget = S.phase === 'dealing' || S.phase === 'results' ? [0, TOP, C[1] + 0.33] : V.add(D.av.headPivot.worldPos(), [0, -0.1, 0]); }
    if((frame.t = (frame.t || 0) + dt) > 0.5){ frame.t = 0; refreshLabels(); }
  }
  function idle(ctx, A){
    if(A === D || A.seat == null) return;
    const s = seats()[A.seat], k = Math.random() < 0.5 ? 'R' : 'L', c = A.arms[k], r = s.rest[k];
    X.gesture(A, () => X.arm(c, V.add([r[0], TOP + 0.028, r[1]], [(Math.random() - 0.5)*0.05, 0, (Math.random() - 0.5)*0.05]), {dur:0.6, pose:Math.random() < 0.4 ? 'flat' : 'relaxed'}));
  }

/* =====================================================================
   3D BUCKSHOT: the basement, The Dealer, a real pump shotgun that

   ===================================================================== */
W3.games.buckshot = (() => {
  const {Node, geo, mat, V, qEuler, qMul, qRot, wait, tween} = G3;
  const TOP = W3T.TOP;
  const SEATS = [[0, 0.88], [-0.5, 0.84], [0.5, 0.84], [-0.98, 0.15], [0.98, 0.15], [-0.98, -0.42]].map(([x, z], i) => {
    const yaw = Math.atan2(-x, -z);
    const fx = Math.sin(yaw), fz = Math.cos(yaw);   // forward (toward the table)
    const rx = -fz, rz = fx;                          // the player's right
    const edge = [x + fx*0.33, z + fz*0.33];
    return {i, chair:[x, 0, z], yaw, fwd:[fx, 0, fz], right:[rx, 0, rz],
      rest:{R:[edge[0] + rx*0.13, edge[1] + rz*0.13], L:[edge[0] - rx*0.13, edge[1] - rz*0.13]},
      items:(k) => [edge[0] + fx*0.1 + rx*(-0.22 + k*0.09), TOP, edge[1] + fz*0.1 + rz*(-0.22 + k*0.09)],
      eye:[x + fx*0.12, 1.2, z + fz*0.12]};
  });
  const DEALER = {chair:[0, 0, -0.9], yaw:0};
  DEALER.items = (k) => [-0.25 + k*0.09, TOP, -0.42];
  let X = null, D = null, gun = null, prevB = null, shellsOnTable = [], itemNodes = new Map(), shake = 0, flashLight = null;
  let holder = null, gunAim = null, gunGrip = 'hold';

  /* ---------- models ---------- */
  function buildGun(){
    const g = new Node(); g.name = 'gun';
    const steel = mat({color:'#23262b', rough:0.32, metal:0.85}), wood = mat({color:'#ffffff', map:W3A.woodTex('#5a2c12'), rough:0.45, env:0.5, uv:[1, 1, 0, 0]});
    // muzzle points +Z; the grip sits at the origin
    const stock = new Node(geo.roundBox(0.045, 0.1, 0.32, 0.015, 2), wood); stock.pos = [0, -0.035, -0.2]; stock.q = qEuler(-0.12, 0, 0); g.add(stock);
    const grip = new Node(geo.roundBox(0.04, 0.07, 0.08, 0.012, 2), wood); grip.pos = [0, -0.02, -0.02]; g.add(grip);
    const recv = new Node(geo.roundBox(0.05, 0.075, 0.22, 0.008, 2), steel); recv.pos = [0, 0.02, 0.1]; g.add(recv);
    const guard = new Node(geo.torus(0.022, 0.004, 16, 6), steel); guard.pos = [0, -0.02, 0.04]; guard.q = qEuler(0, Math.PI/2, 0); g.add(guard);
    const barrel = new Node(geo.cylinder(0.014, 0.014, 0.5, 14), steel); barrel.q = qEuler(Math.PI/2, 0, 0); barrel.pos = [0, 0.035, 0.46]; g.add(barrel);
    const tube = new Node(geo.cylinder(0.011, 0.011, 0.38, 12), steel); tube.q = qEuler(Math.PI/2, 0, 0); tube.pos = [0, 0.008, 0.4]; g.add(tube);
    const pump = new Node(geo.roundBox(0.042, 0.04, 0.16, 0.014, 2), wood); pump.pos = [0, 0.008, 0.36]; g.add(pump);
    const flash = new Node(geo.sphere(0.06, 12, 8), mat({color:'#fff2b0', unlit:true, emissive:'#ffcc55', emisMult:3, blend:'add', depthWrite:false})); flash.visible = false; flash.castShadow = false; g.add(flash);

    const pumpPt = new Node(); pumpPt.pos = [0, -0.005, 0.36]; g.add(pumpPt);
    const muzzle = new Node(); g.add(muzzle);
    const setSaw = (on) => { const len = on ? 0.24 : 0.5; barrel.geoLen = len; barrel.scl = [1, len/0.5, 1]; barrel.pos = [0, 0.035, 0.21 + len/2]; muzzle.pos = [0, 0.035, 0.21 + len]; flash.pos = muzzle.pos.slice(); };

  function shellNode(live){

    const brass = new Node(geo.cylinder(0.0115, 0.0115, 0.014, 12), mat({color:'#d8b04a', rough:0.25, metal:1})); brass.pos = [0, -0.028, 0]; s.add(brass);

  function itemNode(k){

      const l = new Node(geo.cylinder(0.033, 0.033, 0.004, 24), mat({color:'#cfe8ff', rough:0.05, env:1.6, alpha:0.45, blend:'alpha'})); l.pos = [0, 0.008, 0]; g.add(l);
      const h = new Node(geo.capsule(0.008, 0.07, 8, 3), mat({color:'#3a2010', rough:0.5})); h.q = qEuler(Math.PI/2, 0, 0); h.pos = [0, 0.008, 0.04]; g.add(h); }
    else if(k === 'saw'){ const b = new Node(geo.box(0.17, 0.004, 0.05), mat({color:'#b9bec6', rough:0.25, metal:1})); b.pos = [0.03, 0.004, 0]; g.add(b);
      const h = new Node(geo.roundBox(0.06, 0.02, 0.06, 0.008, 2), mat({color:'#7a1f1a', rough:0.5})); h.pos = [-0.08, 0.01, 0]; g.add(h); }
    else if(k === 'beer'){ const c = new Node(geo.cylinder(0.022, 0.022, 0.08, 16), mat({color:'#d8a72a', rough:0.25, metal:0.9})); c.pos = [0, 0.04, 0]; g.add(c); }
    else { for(const s of [-1, 1]){ const r = new Node(geo.torus(0.022, 0.005, 20, 6), mat({color:'#c9cdd3', rough:0.2, metal:1})); r.pos = [s*0.03, 0.005, 0]; r.q = qEuler(Math.PI/2, 0, 0); g.add(r); } }
    g.kind = k; return g;
  }

  /* ---------- build ---------- */
  function build(ctx){
    X = ctx; prevB = null; shellsOnTable = []; itemNodes = new Map(); holder = null; gunAim = null; shake = 0;
    const room = W3R.basement(); ctx.scene.add(room.root);
    const env = {...room.env, points:room.env.points.slice()};
    flashLight = {pos:[0, 1, 0], color:[0, 0, 0], range:3}; env.points.push(flashLight);
    const wood = mat({color:'#ffffff', map:W3A.woodTex('#3b2a1c'), rough:0.7, env:0.2, uv:[2, 1, 0, 0]});
    const top = new Node(geo.roundBox(1.5, 0.06, 1.35, 0.01, 2), wood); top.pos = [0, TOP - 0.03, -0.02]; ctx.scene.add(top);
    for(const [x, z] of [[-0.65, -0.6], [0.65, -0.6], [-0.65, 0.55], [0.65, 0.55]]){ const l = new Node(geo.box(0.07, TOP - 0.06, 0.07), mat({color:'#241810', rough:0.8})); l.pos = [x, (TOP - 0.06)/2, z]; ctx.scene.add(l); }
    const stain = new Node(geo.plane(0.4, 0.3), mat({color:'#3a0606', rough:0.6, alpha:0.55, blend:'alpha', depthWrite:false})); stain.pos = [0.32, TOP + 0.001, 0.1]; stain.q = qEuler(0, 0.6, 0); stain.castShadow = false; ctx.scene.add(stain);
    const chairM = mat({color:'#2a2622', rough:0.6, metal:0.5});
    for(const s of SEATS){ const c = new Node(); c.pos = s.chair.slice(); c.q = qEuler(0, s.yaw, 0);
      const seat = new Node(geo.box(0.42, 0.04, 0.4), chairM); seat.pos = [0, 0.5, 0]; c.add(seat);
      const back = new Node(geo.box(0.42, 0.45, 0.03), chairM); back.pos = [0, 0.74, -0.2]; c.add(back);
      for(const [lx, lz] of [[-0.18, -0.18], [0.18, -0.18], [-0.18, 0.18], [0.18, 0.18]]){ const l = new Node(geo.cylinder(0.012, 0.012, 0.5, 8), chairM); l.pos = [lx, 0.25, lz]; c.add(l); }
      ctx.scene.add(c); }
    gun = buildGun(); ctx.scene.add(gun.root); gunRest(true);
    D = ctx.actor('dealer', {skin:'#f7d7c1', top:'tee', topColor:'#151515'}, {special:'dealer'}); ctx.place(D, DEALER.chair, 0);
    restOf(D, true);
    return {env};
  }
  const seatOfId = (id) => { const n = W3.seatOf(id); return n >= 0 && n < SEATS.length ? n : null; };
  const actorOf = (id) => id === 'dealer' ? D : X.actors.get(id);
  function restOf(A, now){
    const ps = [];
    for(const k of ['R', 'L']){ const c = A.arms[k];
      let p, q;
      if(A === D){ const x = k === 'R' ? -0.17 : 0.17; p = [x, TOP + 0.03, -0.5]; q = W3H.handQ(V.norm([-x, -0.2, 1]), [0, 1, 0]); }
      else { const s = SEATS[A.seat], r = s.rest[k]; p = [r[0], TOP + 0.028, r[1]]; q = X.hq(A, [-c.out*0.25, -0.15, 1]); }
      if(now){ c.pos = p; c.q = q; } else ps.push(X.arm(c, p, {dur:0.4, q, pose:'relaxed'}));
    }
    return Promise.all(ps);
  }
  function syncPlayers(){
    const want = new Set(['dealer']);
    S.players.forEach((p, n) => {
      if(n >= SEATS.length) return; want.add(p.id);
      const s = SEATS[n], A = X.actor(p.id, W3.lookOf(p), {});
      if(A.seat !== n){ A.seat = n; X.place(A, s.chair, s.yaw); restOf(A, true); }
      A.isMe = p.id === MY_ID; A.av.headPivot.visible = !A.isMe; A.p = p;
    });
    for(const id of [...X.actors.keys()]) if(!want.has(id)){ X.removeActor(id); clearItems(id); }
  }

  /* ---------- the gun ---------- */
  // gunAim: {pos, q} the gun's world transform; holder's hands follow the grip and the pump
  function gunRest(now){
    const pos = [0.05, TOP + 0.03, 0.05], q = qMul(qEuler(0, Math.PI/2 + 0.3, 0), qEuler(0, 0, Math.PI/2));

  const headOf = (A) => V.add(A.av.headPivot.worldPos(), [0, 0.14, 0]);

    const f = A === D ? [0, 0, 1] : SEATS[A.seat].fwd;
    const base = A === D ? [0.04, 1.0, -0.5] : V.add(A.av.root.pos, V.add(V.scale(f, 0.4), [0, 1.0, 0]));

  }
  function lookQ(dir){ // +Z of the gun along dir, +Y roughly up

  async function pickUp(A){

    await Promise.all([tween(gun.root, 'pos', h.pos, 0.38, 'inOut'), tween(gun.root, 'q', h.q, 0.38)]);
  }
  async function aimAt(A, targetHead){

    let pos, q;
    if(self){ // barrel under the chin, the stock out over the table
      const hd = headOf(A), f = A === D ? [0, 0, 1] : SEATS[A.seat].fwd;
      const muzzle = V.add(hd, V.add(V.scale(f, 0.13), [0, -0.2, 0]));
      const dir = V.norm(V.add(V.scale(f, -0.85), [0, 0.52, 0]));

    } else { const h = holdPose(A); pos = V.add(h.pos, [0, 0.07, 0]); q = lookQ(V.sub(targetHead, V.add(pos, qRot(h.q, [0, 0, 0.45])))); gunGrip = 'hold'; }

  }
  function fire(live, A){

    setTimeout(() => { gun.flash.visible = false; flashLight.color = [0, 0, 0]; }, 90);

    // recoil
    const back = V.sub(gun.root.pos, qRot(gun.root.q, [0, -0.02, 0.07]));

  }
  function ejectShell(live){
    const s = shellNode(live); X.scene.add(s); s.pos = gun.root.pos.slice(); s.q = gun.root.q;
    const to = [(Math.random() - 0.5)*0.5, TOP + 0.012, -0.1 + (Math.random() - 0.5)*0.3];

  /* ---------- shells shown at each load ---------- */
  function showLoad(load){
    for(const s of shellsOnTable) X.forget(s); shellsOnTable = [];

    const nodes = list.map((live, i) => { const s = shellNode(live); s.pos = [(i - (list.length - 1)/2)*0.05, TOP + 0.028, -0.15]; s.q = qEuler(0, 0, 0); X.scene.add(s); return s; });

      await wait(1.3);
      await pickUp(D);
      for(const s of nodes){ await X.fly(s, gun.root.pos, {dur:0.14, lift:0.04, A:D}); X.forget(s); }

      await gunRest(); await restOf(D);
    });
  }

  /* ---------- items ---------- */
  function clearItems(id){ const L = itemNodes.get(id); if(L) for(const n of L) X.forget(n); itemNodes.delete(id); }
  function itemSpot(id, k){ if(id === 'dealer') return DEALER.items(k); const n = seatOfId(id); return n == null ? null : SEATS[n].items(k); }
  function syncItems(b, used){
    const owners = ['dealer', ...b.order];
    for(const id of owners){
      const want = (b.items && b.items[id]) || [];

        useItem(id, gone);

      while(L.length > want.length){ X.forget(L.pop()); }

        const n = itemNode(k), p = itemSpot(id, i); if(!p){ return; } n.pos = V.add(p, [0, 0.002, 0]); X.scene.add(n); L[i] = n;
      });
      L.forEach((n, i) => { const p = itemSpot(id, i); if(p && V.len(V.sub(n.pos, p)) > 0.01) X.fly(n, V.add(p, [0, 0.002, 0]), {dur:0.3}); });

  function useItem(id, node){
    const A = actorOf(id); if(!A || !node){ if(node) X.forget(node); return; }
    X.gesture(A, async () => {
      const c = A.arms.L; A.busyLeft = true;
      await X.arm(c, X.reach(c, V.add(node.pos, [0, 0.03, 0])), {dur:0.25, pose:'pinch'});

      if(node.kind === 'glass') await X.arm(c, face, {dur:0.35, pose:'hold'});
      else if(node.kind === 'beer'){ await X.arm(c, V.add(face, [0, -0.06, 0]), {dur:0.35, pose:'hold'}); await wait(0.3); }
      else if(node.kind === 'saw'){ const p = gun.muzzle.worldPos(); await X.arm(c, X.reach(c, p), {dur:0.3, pose:'grip'}); for(let k = 0; k < 3; k++){ await X.arm(c, X.reach(c, V.add(p, [0.05, 0, 0])), {dur:0.09}); await X.arm(c, X.reach(c, p), {dur:0.09}); } gun.setSaw(true); }
      else { const t = id === 'dealer' ? (S.bs && S.bs.turn && actorOf(bsNextFor()) || D) : D; X.drop(node); await X.fly(node, V.add(t.av.root.pos, [0, TOP + 0.01, 0]), {dur:0.5, lift:0.25, A}); }

  }

  /* ---------- labels ---------- */
  function refreshLabels(){
    const L = [], b = S.bs;
    S.players.forEach((p, n) => {
      if(n >= SEATS.length) return; const A = X.actors.get(p.id); if(!A) return;
      const lives = b && b.order.includes(p.id) ? livesHTML(b.lives[p.id] || 0, b.max[p.id] || 0) : '';
      const turn = b && b.stage === 'turn' && b.turn === p.id;
      let em = '';
      if(!b && S.phase === 'betting') em = p.ready ? (p.bet ? `STAKE ${short(p.bet)}` : 'SITTING OUT') : 'DECIDING...';
      if(b && b.cuffed && b.cuffed[p.id]) em = 'CUFFED';
      if(b && b.order.includes(p.id) && !(b.lives[p.id] > 0)) em = 'DOWN';
      if(p.id === MY_ID){ if(lives) L.push({key:'me', at:V.add(SEATS[n].items(5), [0, 0.03, 0]), html:lives, cls:'w3name bs'}); return; }
      L.push({key:'n' + p.id, at:() => V.add(A.av.headPivot.worldPos(), [0, 0.34, 0]), html:`<b>${esc(p.name)}</b>${lives}${em ? `<em>${em}</em>` : ''}`, cls:'w3name bs' + (turn ? ' turn' : '')});

W3.games.slots = (() => {

  /* ---------- art ---------- */
  const hexTex = () => cg('slHex', () => canvasTex(256, 512, (x, W, H) => {

    add(cg('cbDoor', () => geo.roundBox(0.48, 0.52, 0.012, 0.012, 2)), panelMat(), [0, 0.42, 0.183]);
    add(cg('cbDoorLine', () => geo.box(0.44, 0.008, 0.008)), rail, [0, 0.71, 0.19]);

    add(cg('cbDeckTrim', () => geo.box(0.64, 0.012, 0.012)), rail, dp(0, -0.012, 0.15), dq);

    add(cg('cbBtn2', () => geo.cylinder(0.026, 0.028, 0.016, 20)), cg('slBtn2M', () => mat({color:'#f2c544', rough:0.3, emissive:'#ffb000', emisMult:0.7})), dp(-0.24, 0.03), dq);

        await X.arm(c, X.local(D, [-0.22, 0.8, 0.06]), {dur:0.5, pose:'relaxed', q:X.hq(D, [0, -1, 0.15], [-1, 0, 0])}); });
