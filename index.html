<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<title>Blackjack 33</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Playfair+Display:wght@700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8c060; --gold-d:#8f6a1c;
  --ink:#f6f2e7; --muted:#b4c3ba;
  --card-ink:#151515; --card-red:#c41230;
  --red:#ff4d5e; --green:#3fdc8a; --blue:#55a8ff;
  --line:rgba(255,255,255,.14); --panel:rgba(0,0,0,.42);
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --ui:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --felt-bg:radial-gradient(120% 95% at 50% 25%,#1b8f55 0%,#0f6a3d 52%,#073d24 100%);
  --rail:0 0 0 10px #50301a,0 0 0 11px #7a4a2a,0 0 0 14px #2a160b,0 20px 44px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background:#0b0706 radial-gradient(130% 90% at 50% 0%,#33190f 0%,#170d09 50%,#060404 100%) fixed}
button{font:inherit;color:inherit}
#app{overflow:hidden;min-height:100vh;min-height:100dvh}
#stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;transform-origin:50% 50%;padding-bottom:env(safe-area-inset-bottom)}

/* ---------- header ---------- */
#stage.lobbymode .console{order:1;margin-top:10px}
#stage.lobbymode .tableWrap{order:2;opacity:.9}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,0,0,.5);border-bottom:1px solid rgba(232,192,96,.2);position:relative;z-index:6}
.brand{font-family:var(--serif);color:var(--gold);font-size:19px;white-space:nowrap}
.roomchip{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:11px;letter-spacing:.08em;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.roomchip b{font-family:var(--display);color:var(--gold);letter-spacing:.14em;font-weight:400;font-size:13px}
.roomchip .inv{background:var(--gold);color:#241a00;border-radius:999px;padding:3px 8px;font-weight:800;font-size:10px}
.gamechip{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#241706;background:linear-gradient(#f7e09c,#c99b3a);border-radius:999px;padding:5px 10px;white-space:nowrap;border:0;cursor:pointer}
.gamechip .short{display:none}
.gamechip em{font-style:normal;background:#8e1324;color:#ffd4d9;border-radius:999px;padding:1px 6px;font-size:9px}
.topright{margin-left:auto;display:flex;gap:6px}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;padding:0;cursor:pointer;display:grid;place-items:center}

/* ---------- dealer bar / Myla ---------- */
.tableWrap{display:flex;flex-direction:column;align-items:center;padding:4px 6px 0}
.dealerBar{position:relative;z-index:4;display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:1060px;margin-bottom:-14px;pointer-events:none}
.mylaWrap{display:flex;flex-direction:column;align-items:center;flex:none}
.myla{width:var(--av);height:var(--av);filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));overflow:visible}
.myla .mouth{transform-box:fill-box;transform-origin:center}
.myla.talking .mouth{animation:talk .15s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(1.8)}}
.nameplate{margin-top:-7px;font-family:var(--serif);font-size:10.5px;letter-spacing:.26em;color:#241706;background:linear-gradient(#f7e09c,#c99b3a);padding:2px 8px 2px 11px;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.55);position:relative}
.bubble{position:relative;background:#fffdf6;color:#1b1b1b;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:500;max-width:min(380px,62vw);line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.4);margin-bottom:28px}
.bubble::before{content:'';position:absolute;left:-7px;bottom:14px;border:7px solid transparent;border-right-color:#fffdf6;border-left:0}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ---------- blackjack table ---------- */
.table{position:relative;flex:none}
.feltLayer,.dyn{position:absolute;inset:0}
.feltLayer svg{position:absolute;left:0;top:0;overflow:visible}
.rack{position:absolute;display:flex;gap:2px;padding:3px 4px;background:linear-gradient(#34343a,#101012);border-radius:0 0 8px 8px;box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.12)}
.rack i{flex:1;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--c) 0 3px,rgba(0,0,0,.45) 3px 4px);box-shadow:inset 1px 0 0 rgba(255,255,255,.25)}
.shoe{position:absolute;border-radius:5px 12px 4px 4px;background:linear-gradient(160deg,#4a4a52,#141417 60%);box-shadow:0 5px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);transform:rotate(-10deg);z-index:1}
.shoe::before{content:'';position:absolute;left:14%;right:14%;top:16%;bottom:24%;border-radius:3px;background:#a8102a;box-shadow:inset 0 0 0 2px #fff}
.shoe::after{content:'';position:absolute;left:8%;right:8%;bottom:7%;height:13%;border-radius:2px;background:rgba(0,0,0,.65)}
.discard{position:absolute;border-radius:4px;background:linear-gradient(160deg,#3a2a1c,#1c120a);box-shadow:0 4px 8px rgba(0,0,0,.5);transform:rotate(8deg)}
.discard::before{content:'';position:absolute;inset:16% 12%;border-radius:2px;background:repeating-linear-gradient(to bottom,#fff 0 1px,#d4d0c8 1px 2px)}
.dspot{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.dspot .hand{min-height:calc(var(--cw)*1.4)}
.dspot .tb{position:static;margin-top:6px}
.dspot.peeking .card.back{animation:peek 1.3s ease-in-out .5s both}
@keyframes peek{0%,100%{transform:none}35%,65%{transform:translateY(-8px) rotate(-8deg)}}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% + var(--ph) + var(--cr) + 5px));z-index:2}
.seat.me{z-index:3}
.sh{position:relative;min-height:calc(var(--cw)*1.4);display:flex;align-items:flex-end;justify-content:center;margin-bottom:7px}
.snote{font-size:10px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase;padding-bottom:4px;white-space:nowrap}
.spot{position:relative;width:calc(var(--cr)*2);height:calc(var(--cr)*2);border-radius:50%;border:2px solid rgba(255,255,255,.55);flex:none}
.seat.me .spot{border-color:rgba(232,192,96,.9)}
.plaque{margin-top:5px;height:var(--ph);min-width:calc(var(--cr)*3.4);max-width:150px;padding:0 10px;border-radius:8px;background:linear-gradient(#222226,#0c0c0e);border:1px solid rgba(232,192,96,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.plaque b{font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plaque span{font-size:11px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.host{font-style:normal;font-size:8px;background:rgba(255,255,255,.18);padding:1px 4px;border-radius:5px;margin-left:4px;vertical-align:2px;letter-spacing:.06em}
.seat.turn .plaque{border-color:var(--gold);box-shadow:0 0 16px rgba(232,192,96,.6)}
.seat.away{opacity:.45}
.tb{position:absolute;right:-12px;top:-10px;min-width:26px;text-align:center;background:rgba(10,10,12,.9);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 7px;font-size:12px;font-weight:800;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap}
.tb.late{animation:tbIn .25s ease both}
@keyframes tbIn{from{opacity:0;transform:scale(.6)}}
.tb.bust{background:#8e1324;border-color:#ff6b7a}
.tb.bj,.tb.t33{background:linear-gradient(#f7e09c,#c99b3a);color:#241706;border-color:#fff3c4}
.rtag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:7px;background:rgba(0,0,0,.82);animation:pop .35s ease;z-index:5}
.rtag.win{color:#7dffb3;border:1px solid #3fdc8a}.rtag.lose{color:#ff8a96;border:1px solid #ff4d5e}.rtag.push{color:#ddd;border:1px solid #888}
.rtag.bj,.rtag.win33{color:#241706;background:linear-gradient(#f7e09c,#c99b3a)}
.cb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-family:var(--display);font-size:8.5px;letter-spacing:.05em;background:#3a0c14;color:#ff8a96;border:1px solid var(--red);border-radius:5px;padding:1px 5px}
.cb.pend{background:rgba(0,0,0,.6);border-style:dashed}
.ring{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;filter:drop-shadow(0 0 3px rgba(232,192,96,.9))}
.ring circle.low{stroke:var(--red)}
.stk{position:absolute;left:50%;top:50%;width:calc(var(--cr)*1.45);height:0;transform:translateX(-50%)}
.sc{position:absolute;left:0;right:0;height:calc(var(--cr)*.5);bottom:calc(var(--i)*var(--cr)*.17 - var(--cr)*.25);border-radius:50%;background:repeating-linear-gradient(90deg,var(--c) 0 16%,#fff 16% 24%);box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.25)}
.sc:last-child{background:radial-gradient(ellipse at 50% 45%,var(--c) 0 38%,rgba(255,255,255,.85) 40% 46%,var(--c) 48% 64%,transparent 66%),repeating-linear-gradient(90deg,var(--c) 0 16%,#fff 16% 24%)}
.amt{position:absolute;left:100%;top:50%;transform:translate(5px,-50%);font-size:10.5px;font-weight:800;background:rgba(0,0,0,.8);color:var(--gold);border-radius:6px;padding:1px 5px;white-space:nowrap;z-index:2}

/* ---------- cards ---------- */
.hand{display:flex;justify-content:center;align-items:flex-end;perspective:800px}
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.075);background:linear-gradient(165deg,#fff 0%,#f8f5ee 100%);color:var(--card-ink);position:relative;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.16),0 2px 3px rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.28);user-select:none;-webkit-user-select:none;font-family:var(--serif)}
.hand .card+.card{margin-left:calc(var(--cw)*-.58)}
.seat.me .hand .card+.card,.dspot .hand .card+.card{margin-left:calc(var(--cw)*-.5)}
.bh .hand .card+.card{margin-left:calc(var(--cw)*-.25)}
.hand.n4 .card+.card{margin-left:calc(var(--cw)*-.7)}
.hand.n6 .card+.card{margin-left:calc(var(--cw)*-.77)}
.seat.me .hand.n4 .card+.card,.dspot .hand.n4 .card+.card{margin-left:calc(var(--cw)*-.6)}
.seat.me .hand.n6 .card+.card,.dspot .hand.n6 .card+.card{margin-left:calc(var(--cw)*-.68)}
.tb.rw{background:#0f5e33;border-color:#3fdc8a;color:#bfffd9}.tb.rl{background:#8e1324;border-color:#ff6b7a}.tb.rp{background:#333;border-color:#888}
.card.side{transform:rotate(90deg);margin-left:calc(var(--cw)*.05)!important;margin-right:calc(var(--cw)*.2)}
.card.red{color:var(--card-red)}
.ix{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.86}
.ix.tl{top:calc(var(--cw)*.055);left:calc(var(--cw)*.06)}
.ix.br{bottom:calc(var(--cw)*.055);right:calc(var(--cw)*.06);transform:rotate(180deg)}
.ix b{font-size:calc(var(--cw)*.235);letter-spacing:-.07em}
.ix i{font-style:normal;font-size:calc(var(--cw)*.19);font-family:var(--ui)}
.pips{position:absolute;left:21%;right:21%;top:13%;bottom:13%}
.pip{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.2);line-height:1;font-family:var(--ui)}
.pip.dn{transform:translate(-50%,-50%) rotate(180deg)}
.ace{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.52);font-family:var(--ui)}
.court{position:absolute;left:19%;right:19%;top:12%;bottom:12%;border-radius:calc(var(--cw)*.03);background:linear-gradient(135deg,#fbf0cf,#e9cb83);box-shadow:inset 0 0 0 1px currentColor,inset 0 0 0 3px #fff,inset 0 0 0 4px currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center}
.court b{font-size:calc(var(--cw)*.4);line-height:1}
.court i{font-style:normal;font-size:calc(var(--cw)*.2);font-family:var(--ui);line-height:1}
.card.mini .ix.tl b{font-size:calc(var(--cw)*.34)}
.card.mini .ix.tl i{font-size:calc(var(--cw)*.28)}
.ctr{position:absolute;right:8%;bottom:6%;font-size:calc(var(--cw)*.46);font-family:var(--ui);line-height:1}
.card.back{background:#fff}
.card.back::after{content:'';position:absolute;inset:calc(var(--cw)*.055);border-radius:calc(var(--cw)*.045);background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px),#a8102a;box-shadow:inset 0 0 0 2px #a8102a,inset 0 0 0 3px rgba(255,255,255,.55)}

/* ---------- console ---------- */
.console{width:100%;max-width:780px;margin:12px auto 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.cinfo{display:flex;gap:8px 14px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.cinfo small{font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-right:4px;font-weight:700}
.ci-name{font-weight:800;font-size:15px}
.ci-name small{letter-spacing:0;font-size:12px}
.ci-bal{font-weight:800;color:var(--gold)}
.ci-bet{font-weight:800}
.ctrl{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.betrow{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.btnrow{display:flex;gap:10px;justify-content:center;width:100%;flex-wrap:wrap}
.btnrow .btn{flex:1 1 0;min-width:88px;max-width:170px}
.msg{color:var(--muted);font-size:14px;text-align:center;line-height:1.4}
.msg b{color:var(--ink)}
.timer{width:100%;max-width:520px;height:5px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%;border-radius:5px}
.timer i.low{background:var(--red)}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:#2a1d00;background:linear-gradient(180deg,#ffe7a0,#e8c060 55%,#c99b3a);box-shadow:0 4px 0 var(--gold-d),0 8px 18px rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s,filter .15s;touch-action:manipulation}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d),0 3px 8px rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn.hit{background:linear-gradient(180deg,#8ff5be,#3fdc8a 55%,#22b56a);box-shadow:0 4px 0 #14703f,0 8px 18px rgba(0,0,0,.35);color:#04301a}
.btn.stand{background:linear-gradient(180deg,#ff9aa4,#ff4d5e 55%,#de2a3d);box-shadow:0 4px 0 #7f1220,0 8px 18px rgba(0,0,0,.35);color:#fff}
.btn.dbl{background:linear-gradient(180deg,#a8d3ff,#55a8ff 55%,#2f86e6);box-shadow:0 4px 0 #154a87,0 8px 18px rgba(0,0,0,.35);color:#04203f}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:13px}
.btn.xl{font-size:18px;min-height:56px;width:100%;max-width:420px}
.chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.chip{--c:#2b6cd8;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:14px;position:relative;touch-action:manipulation;
  background:radial-gradient(circle,var(--c) 0 47%,rgba(255,255,255,.92) 48% 51%,var(--c) 52% 63%,transparent 64%),repeating-conic-gradient(var(--c) 0 25deg,#fff 25deg 40deg);
  box-shadow:0 4px 0 rgba(0,0,0,.5),0 6px 12px rgba(0,0,0,.35),inset 0 0 0 2px rgba(0,0,0,.2);transition:transform .1s}
.chip:active{transform:translateY(2px)}
.chip:disabled{opacity:.3;cursor:not-allowed}
.chip.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 10px 16px rgba(0,0,0,.45)}
.chip span{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.c10{--c:#2b6cd8}.c25{--c:#1f9d55}.c100{--c:#26262c}.c500{--c:#7b3fe4}
.betline{font-family:var(--serif);font-size:26px;line-height:1}
.betline small{font-family:var(--ui);font-size:12px;color:var(--muted);letter-spacing:.1em}
.note{font-size:13px;background:#3a0c14;border:1px solid var(--red);color:#ffb3bb;border-radius:10px;padding:6px 10px;text-align:center}
.result{font-family:var(--serif);font-size:28px;text-align:center;line-height:1.1;animation:pop .4s ease}
.result.late{animation:tbIn .3s ease both}
.result.win,.result.bj{color:var(--green)}.result.lose{color:var(--red)}.result.push{color:var(--muted)}
.result.win33,.result.bj{color:var(--gold);text-shadow:0 0 18px rgba(232,192,96,.55)}
.cursebadge{display:inline-block;font-family:var(--display);font-size:9.5px;letter-spacing:.06em;background:#3a0c14;color:#ff8a96;border:1px solid var(--red);border-radius:6px;padding:2px 6px}
.cursebadge.pending{background:transparent;border-style:dashed}

/* ---------- roulette ---------- */
.feltbox{width:100%;max-width:1000px;position:relative;background:var(--felt-bg);box-shadow:var(--rail),inset 0 0 70px rgba(0,0,0,.35);margin:2px 0 8px}
.rlTable{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px 12px;border-radius:28px}
.rlTop{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.wheelBox{width:var(--wh);height:var(--wh);flex:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.wheelBox svg{width:100%;height:100%;display:block}
.rlSide{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.rlres{font-family:var(--serif);font-size:30px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.5);background:rgba(0,0,0,.35);color:#fff}
.rlres.red{background:#c8102e}.rlres.black{background:#151515}.rlres.green{background:#0a8a45}
.rlres.spin{animation:pop .5s ease}
.hist{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:200px}
.hist i{width:22px;height:22px;border-radius:50%;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;border:1px solid rgba(255,255,255,.4)}
.hist i.red{background:#c8102e}.hist i.black{background:#151515}.hist i.green{background:#0a8a45}
.hlbl{font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.6);font-weight:800}
.board{display:grid;width:100%;max-width:900px;border:2px solid rgba(255,255,255,.8);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;background:rgba(0,0,0,.08)}
.board.h{grid-template-columns:1.1fr repeat(12,1fr) 1.25fr;grid-template-rows:repeat(3,50px) 40px 40px}
.board.v{grid-template-columns:44px 40px repeat(3,1fr);grid-template-rows:36px repeat(12,32px) 34px}
.rc{position:relative;border:0;margin:0;padding:0;background:transparent;color:#fff;font-family:var(--serif);font-size:16px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);display:grid;place-items:center;touch-action:manipulation;min-width:0}
.rc.red{background:#b3122e}.rc.black{background:#141414}.rc.green{background:#0a7a3e}
.rc.out{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.06em}
.board.v .rc.vt span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}

.dia{display:block;width:26px;height:16px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

.mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 4px;border-radius:12px;display:grid;place-items:center;font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:0;color:#fff;background:var(--c);box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.6);z-index:3;pointer-events:none;writing-mode:horizontal-tb}
.rc.out .mk{left:auto;right:4px;transform:translateY(-50%)}
.board.v .rc.out .mk{right:auto;left:50%;top:auto;bottom:2px;transform:translateX(-50%);min-width:20px;height:20px;font-size:9px}
.bz .mk{left:auto;right:-4px;top:-8px;transform:none}
.mk.mine{box-shadow:0 0 0 2px var(--gold),0 0 0 4px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.6)}
.pstrip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
.pp{background:linear-gradient(#222226,#0c0c0e);border:1px solid rgba(232,192,96,.3);border-radius:9px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.18;min-width:86px;position:relative}

/* ---------- baccarat ---------- */
.bacTable{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 12px 14px;border-radius:260px 260px 28px 28px/120px 120px 28px 28px}
.bacTable .shoe{top:16px;right:8%}
.bacPrint{font-family:var(--serif);color:rgba(232,192,96,.85);letter-spacing:.3em;font-size:12px;margin-top:-14px}
.bacHands{display:flex;gap:14px;justify-content:center;width:100%;max-width:640px}
.bh{flex:1;border:2px solid;border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;background:rgba(0,0,0,.08)}
.bh.P{border-color:rgba(110,180,255,.75)}.bh.B{border-color:rgba(255,110,125,.75)}
.bh .bl{font-family:var(--serif);letter-spacing:.24em;font-size:14px}
.bh.P .bl{color:#a9d4ff}.bh.B .bl{color:#ffb6be}
.bh .hand{min-height:calc(var(--cw)*1.4)}
.bh.won{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(232,192,96,.65)}
.bt{font-family:var(--serif);font-size:22px;min-width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3)}
.bh.won .bt{border-color:var(--gold);color:var(--gold)}
.bacBets{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px}
.bz{position:relative;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.03);color:#fff;border-radius:999px;padding:9px 10px 8px;font-family:var(--serif);font-size:19px;letter-spacing:.2em;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation;min-height:56px;justify-content:center}
.bz small{font-family:var(--ui);font-size:9.5px;letter-spacing:.14em;opacity:.8;font-weight:800;margin-top:2px}
.bz.player{color:#a9d4ff;border-color:rgba(120,190,255,.85)}
.bz.banker{color:#ffb6be;border-color:rgba(255,120,135,.85)}
.bz.tie{color:#a6f3c9;border-color:rgba(120,240,170,.85)}
.bz.pair{font-size:13px;letter-spacing:.12em}
.bz:hover{background:rgba(255,255,255,.07)}
.bz.won{animation:winpulse .8s ease-in-out infinite alternate}
.pairs{display:flex;gap:8px}.pairs .bz{flex:1}.pairs .tie{flex:1.6}
.bz .mk{left:auto;right:14px}
.road{display:grid;grid-template-rows:repeat(6,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:2px;padding:5px;background:#f4f1e8;border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.road i.e{background:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.road i{width:15px;height:15px;border-radius:50%;font-size:8.5px;font-weight:800;color:#fff;display:grid;place-items:center;font-style:normal}
.road i.P{background:#1f6fd1}.road i.B{background:#c8102e}.road i.T{background:#1f9d55}
.roadwrap{display:flex;align-items:center;gap:10px}
.roadlbl{font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.65);font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg)}

/* ---------- lobby & settings ---------- */
.panel{background:rgba(0,0,0,.45);border:1px solid rgba(232,192,96,.22);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lobby{width:100%;max-width:520px;text-align:center;align-items:center}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.bigcode{font-family:var(--display);font-size:50px;letter-spacing:.18em;color:var(--gold);line-height:1;padding-left:.18em}
.plist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0;line-height:1.4}
.settings{display:flex;flex-direction:column;gap:10px;width:100%}
.srow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.srow>label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:linear-gradient(#f7e09c,#c99b3a);color:#241706}
.seg button:disabled{cursor:default}
.seg button:disabled:not(.on){opacity:.55}

/* ---------- home ---------- */
.home{max-width:440px;margin:0 auto;padding:34px 18px 30px;display:flex;flex-direction:column;gap:18px;width:100%}
.logo{text-align:center}
.logo .n{font-family:var(--display);font-size:120px;line-height:.9;color:var(--gold);text-shadow:0 6px 0 var(--gold-d),0 14px 30px rgba(0,0,0,.5);display:block}
.logo .w{font-family:var(--serif);font-size:30px;letter-spacing:.2em;display:block;margin-top:8px}
.logo .s{display:block;font-size:12px;letter-spacing:.2em;color:var(--muted);margin-top:8px;font-weight:700}
.tag{text-align:center;color:var(--muted);margin:0;font-size:15px;line-height:1.5}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:rgba(0,0,0,.4);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font:inherit;font-size:17px;outline:none}
.inp:focus{border-color:var(--gold)}
.inp.code{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;text-align:center}
.or{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.joinrow{display:flex;gap:10px}
.joinrow .inp{flex:1;min-width:0}
.err{color:#ff9aa4;font-size:14px;text-align:center;line-height:1.4}
.err:empty{display:none}
.err.info{color:var(--muted)}
.rules{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.rules summary{cursor:pointer;font-weight:700}
.rules ul{padding-left:18px;margin:10px 0 0}
.rules li{margin:7px 0;color:#d9e6de;font-size:14px;line-height:1.4}
.rules b{color:var(--gold)}

/* ---------- overlays ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.drop{position:absolute;top:-110px;left:var(--x);font-family:var(--display);font-size:var(--s);color:var(--red);text-shadow:0 3px 0 #5a0b15;animation:fall var(--t) linear var(--dl) both}
.conf{position:absolute;top:-24px;left:var(--x);width:9px;height:14px;background:var(--c);border-radius:2px;animation:fall var(--t) cubic-bezier(.3,.6,.6,1) var(--dl) both}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(calc(100vh + 160px)) rotate(var(--r))}}
.banner{position:fixed;left:50%;top:42%;z-index:55;font-family:var(--display);font-size:clamp(34px,10vw,90px);color:var(--gold);text-shadow:0 6px 0 var(--gold-d),0 0 40px rgba(232,192,96,.7);white-space:nowrap;pointer-events:none;animation:bannerIn 2.3s ease forwards}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#toasts{position:fixed;top:calc(58px + env(safe-area-inset-top));right:10px;left:10px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.toast{background:rgba(12,12,12,.93);border:1px solid var(--line);border-left:4px solid var(--gold);padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.35;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .3s ease both}
.toast.bad{border-left-color:var(--red)}
.toast .cr{color:#ff8a96;font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.04em}
.toast.out{animation:tout .4s ease forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
#modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(0,0,0,.75);padding:16px}
#modal.show{display:grid}
.doom,.dlg{width:min(440px,100%);border-radius:22px;padding:24px 20px;text-align:center;animation:pop .4s ease}
.doom{background:radial-gradient(circle at 50% 0%,#4a0f1b,#16060a 70%);border:2px solid var(--red);box-shadow:0 0 80px rgba(255,50,80,.45)}
.doom .k{font-family:var(--display);color:#fff;font-size:14px;letter-spacing:.22em;opacity:.8}
.doom h2{font-family:var(--display);font-weight:400;color:var(--red);margin:4px 0 0;font-size:32px;line-height:1.05}
.reel{margin:18px 0 14px;height:74px;border-radius:14px;background:#000;border:3px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:clamp(16px,5.4vw,24px);color:var(--gold);padding:0 10px;box-shadow:inset 0 0 22px rgba(232,192,96,.25);line-height:1.1}
.reel.landed{animation:land .6s ease;border-color:var(--red);color:#fff;background:#5c0d1a}
@keyframes land{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg)}60%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}
.doom .desc{min-height:44px;font-size:15px;line-height:1.45;color:#ffd9dd;margin-bottom:16px}
.dlg{background:linear-gradient(#1a120d,#0e0907);border:1px solid rgba(232,192,96,.3);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left}
.dlg h3{font-family:var(--serif);font-weight:700;margin:0 0 10px;font-size:22px;color:var(--gold);text-align:center}
.dlg p{color:#e2dccd;margin:0 0 18px;line-height:1.45;text-align:center}
.dlg .btnrow{margin-top:16px}

/* ---------- curse effects ---------- */
#stage.fx-upside{transform:rotate(180deg)}
#stage.fx-mirror{transform:scaleX(-1)}
#stage.fx-disco{animation:disco 1.6s linear infinite}
@keyframes disco{from{filter:hue-rotate(0deg) saturate(2.2)}to{filter:hue-rotate(360deg) saturate(2.2)}}
#stage.fx-comic,#stage.fx-comic *{font-family:'Comic Sans MS','Comic Sans','Chalkboard SE','Comic Neue',cursive!important}
#stage.fx-wobble .card,#stage.fx-wobble .btn,#stage.fx-wobble .plaque,#stage.fx-wobble .chip,#stage.fx-wobble .myla,#stage.fx-wobble .rc,#stage.fx-wobble .bz{animation:jelly .7s ease-in-out infinite alternate}
@keyframes jelly{0%{transform:skewX(-8deg) scale(1.05,.93)}100%{transform:skewX(8deg) scale(.94,1.07)}}
#stage.fx-spin{animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#stage.fx-dizzy{animation:dizzy 3s ease-in-out infinite;filter:blur(1.5px)}
@keyframes dizzy{0%,100%{transform:rotate(-3deg) translateX(-10px)}50%{transform:rotate(3deg) translateX(10px)}}
#app.quake{animation:quake .1s linear infinite}
@keyframes quake{0%{transform:translate(0,0)}25%{transform:translate(-10px,6px) rotate(-1deg)}50%{transform:translate(9px,-6px) rotate(1deg)}75%{transform:translate(-7px,-5px)}100%{transform:translate(6px,8px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:45;display:none;background:radial-gradient(circle at var(--mx,50%) var(--my,75%),transparent 0,transparent 85px,rgba(0,0,0,.985) 145px)}
body.fx-blackout #flash{display:block}

/* ---------- responsive ---------- */
@media (min-width:720px){
  .betrow{flex-direction:row;justify-content:center;gap:16px;flex-wrap:wrap}
  .betrow .btnrow{width:auto}
  .betrow .btn.xl{width:auto;min-width:200px}
}
@media (max-width:560px){
  .brand{display:none}
  .top{padding:7px 8px;gap:6px}
  .roomchip{padding-left:9px;letter-spacing:.04em}
  .roomchip .lb{display:none}
  .bubble{font-size:13px;padding:7px 10px}
  .chip{width:52px;height:52px;font-size:13px}
  .logo .n{font-size:100px}
  .result{font-size:23px}
  .rlTop{gap:10px}
  .bz{font-size:16px;min-height:50px}
  .bz.pair{font-size:11px;letter-spacing:.06em}
  .rlTable,.bacTable{padding-left:6px;padding-right:6px}
}
@media (max-width:430px){
  .roomchip .inv{display:none}
  .gamechip .long{display:none}
  .gamechip .short{display:inline}
}

<script>

/* =====================================================================
   MYLA'S TABLE: Blackjack 33 / Blackjack 21 / Roulette / Baccarat
   Online multiplayer is peer-to-peer (PeerJS). Whoever creates the

/* ---------- rules & timing (tweak these!) ---------- */
const MIN_BET = 10;
const START_CHIPS = 1000;
const BEG_AMOUNT = 300;     // chips you get when you beg the dealer
const MAX_PLAYERS = 6;
const DECKS = 6;
const BET_TIME = 30000;     // ms to place bets
const TURN_TIME = 30000;    // ms per blackjack decision
const SPEED_TIME = 7000;    // ms per decision with the SPEED ROUND curse
const RESULT_TIME = 6500;   // ms the results stay up
const CURSE_TIME = 4500;    // extra results time when someone gets cursed
const DEAL_ANIM = 1800;     // extra time on the first turn for the deal animation
const PEEK_TIME = 1700;     // dealer checking for blackjack

const BAC_STEP = 950;       // baccarat: time between cards

const SUITS = ['♠','♥','♦','♣'];

/* ---------- roulette (European, single zero) ---------- */
const RL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RL_RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const RL_OUT = ['red','black','odd','even','low','high','d1','d2','d3','c1','c2','c3'];
function rlColor(n){ return n === 0 ? 'green' : RL_RED.has(n) ? 'red' : 'black'; }
function rlValidKey(k){ if(typeof k !== 'string') return false; if(/^n\d{1,2}$/.test(k)){ const n = +k.slice(1); return n >= 0 && n <= 36; } return RL_OUT.includes(k); }
function rlCovers(k, n){
  if(k[0] === 'n') return +k.slice(1) === n;
  if(n === 0) return false;
  switch(k){
    case 'red': return RL_RED.has(n); case 'black': return !RL_RED.has(n);
    case 'odd': return n % 2 === 1;  case 'even': return n % 2 === 0;
    case 'low': return n <= 18;      case 'high': return n >= 19;
    case 'd1': return n <= 12; case 'd2': return n >= 13 && n <= 24; case 'd3': return n >= 25;
    case 'c1': return n % 3 === 1; case 'c2': return n % 3 === 2; case 'c3': return n % 3 === 0;
  }
  return false;
}
function rlPays(k){ return k[0] === 'n' ? 35 : (k[0] === 'd' || k[0] === 'c') ? 2 : 1; }

/* ---------- baccarat (Punto Banco) ---------- */
const BAC_BETS = {P:'Player', B:'Banker', T:'Tie', PP:'Player Pair', BP:'Banker Pair'};

/* ---------- the Wheel of Doom ---------- */
// bj:true = only makes sense in blackjack
const CURSES = {

  buttons:   {name:'BUTTON CHAOS',       kind:'next', bj:true, w:1, desc:'Next hand your buttons keep jumping around.'},
};

const ROASTS = [
  "I've seen better decisions from a broken vending machine.",
  "Bold strategy. Wrong, but bold.",
  "You play like you're allergic to winning.",
  "That was so bad it should come with a warning label.",
  "Congratulations, you just paid for my vacation.",
  "I'd say better luck next time, but let's be realistic.",
  "You're the reason this casino has such nice carpets.",

  "That wasn't a bet. That was a donation.",

  "Sweetie, no.",
];
const NAMES = ["Sir Loses-a-Lot","Captain Bust","Professor 34","Chip Donor","The Human ATM","Lil' Bust","Wet Napkin","Budget Gambler","Mr. Almost","Myla's Fan","Twenty-Two","Señor Sad"];
const LINES = {
  bjBet:["Place your bets, everyone.","Chips in the circle, please.","Who's feeling lucky tonight?","Bets in, please. Good luck."],
  bjDeal:["Cards are out. Good luck.","Here we go.","Two cards each. Play smart.","Cards are out. I'm watching you."],
  rlBet:["Place your bets on the layout.","Pick your numbers, everyone.","Feeling lucky? Pick a number.","Bets on the layout, please."],
  bacBet:["Player, Banker, or Tie. Place your bets.","Who do you trust tonight, Player or Banker?","Bets on the layout, please."],

  dBust:["Dealer busts! Everybody still standing gets paid.","I went over. Don't get used to it.","Bust! Take your chips."],
  beg:["Fine, {n}. Here's 300. Everyone saw that.","I'm generous, {n}. I also have a long memory.","Take it, {n}. Try to make it last more than one hand."],
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
function rnd(n){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }catch(e){ return Math.floor(Math.random()*n); } }
const pick = a => a[rnd(a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem('bj33.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bj33.'+k, JSON.stringify(v)); }catch(e){} }
};
// One id per browser tab (survives reloads), so two tabs = two players and a reload keeps your seat.
function tabId(){
  let id = null;
  try{ id = sessionStorage.getItem('bj33.id'); }catch(e){}
  if(!id){ id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); try{ sessionStorage.setItem('bj33.id', id); }catch(e){} }
  return id;
}
const MY_ID = tabId();
const isTen = r => r === '10' || r === 'J' || r === 'Q' || r === 'K';

function handValue(cards, limit = 21, acesLow = false){
  let t = 0, aces = 0;
  for(const c of cards){
    if(!c || c.back) continue;
    if(c.r === 'A'){ if(acesLow) t += 1; else { t += 11; aces++; } }
    else if(isTen(c.r)) t += 10;
    else t += Number(c.r);
  }
  while(t > limit && aces > 0){ t -= 10; aces--; }
  return {total:t, soft:aces > 0};
}
// A "blackjack" is an Ace + a 10-value card as your first two cards (in both 21 and 33 mode).
function isNatural(cards, acesLow = false){
  return cards.length === 2 && !acesLow && cards.every(c => !c.back) && cards.some(c => c.r === 'A') && cards.some(c => isTen(c.r));
}

/* =====================================================================
   HOST: the game engine. Only runs in the browser that created the table.
   ===================================================================== */
let G = null;
const conns = new Map();   // player id -> PeerJS connection
let hostTimer = null, lastBroadcast = 0;

function newGame(code){
  return {code, round:0, phase:'lobby', settings:{game:'blackjack', target:33, doom:true},
    players:[], dealer:{hand:[],hidden:true}, dealerBJ:false,
    say:"Welcome to my table. I'm Myla. Take a seat.", sayId:1,
    turn:null, turnOrder:[], turnEnds:0, turnTotal:TURN_TIME, phaseEnds:0, phaseTotal:1,
    shoe:newShoe(), cardSeq:0, events:[], evSeq:0, hostId:MY_ID, ghosts:{},
    rl:{result:null, spinId:0, history:[]},
    bac:{seq:[], shown:0, nextAt:0, winner:null, pt:0, bt:0, history:[]}};
}
function newShoe(){ const s=[]; for(let d=0;d<DECKS;d++) for(const su of SUITS) for(const r of RANKS) s.push({r,s:su}); return shuffle(s); }
function draw(){ if(!G.shoe.length) G.shoe = newShoe(); const c = G.shoe.pop(); return {r:c.r, s:c.s, id:++G.cardSeq}; }
function P(id){ return G.players.find(p => p.id === id); }
function addEvent(e){ e.id = ++G.evSeq; G.events.push(e); if(G.events.length > 40) G.events.shift(); }
function note(text, extra = {}){ addEvent({type:'toast', text, ...extra}); }
function say(t){ G.say = t; G.sayId++; }
const GAME = () => G.settings.game;
const TGT = () => G.settings.target;
const DSTAND = () => G.settings.target === 21 ? 17 : 29;
function activeCurse(p){ return p.curse && p.curse.round <= G.round ? p.curse.id : null; }
function limitOf(p){ return activeCurse(p) === 'shrink' ? TGT() - 3 : TGT(); }
function pv(p){ return handValue(p.hand, limitOf(p), activeCurse(p) === 'aces').total; }
function pNatural(p){ return isNatural(p.hand, activeCurse(p) === 'aces'); }
function turnTime(p){ return activeCurse(p) === 'speed' ? SPEED_TIME : TURN_TIME; }
function cleanName(n){ n = String(n || '').replace(/\s+/g,' ').trim().slice(0,14); return n || 'Player'; }
const LOCKED = ['playing','peek','dealer','spinning','dealing'];

function handleJoin(msg, conn){
  if(!G) return;
  const id = String(msg.id || '').slice(0,40); if(!id) return;
  let p = P(id);
  const name = cleanName(msg.name);
  if(!p){
    if(G.players.filter(x => !x.left).length >= MAX_PLAYERS){
      if(conn){ try{ conn.send({t:'reject', reason:'That table is full (6 players max).'}); }catch(e){} setTimeout(()=>{ try{ conn.close(); }catch(e){} }, 600); }
      return;
    }
    let nm = name, k = 2;
    while(G.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = name.slice(0,11) + ' ' + (k++);
    p = {id, name:nm, baseName:nm, renamed:false, chips:START_CHIPS, bet:0, bets:{}, betOrder:[], lastBet:50, ready:false, inRound:false,
         hand:[], status:'', result:'', delta:0, doubled:false, finalTotal:null, finalLimit:null, curse:null, lastCurse:null,
         connected:true, left:false, lastSeen:Date.now(), begs:0, hits:0, wins:0, losses:0};
    const ghost = G.ghosts[id];
    if(ghost){ p.chips = ghost.chips; p.begs = ghost.begs; delete G.ghosts[id]; }
    G.players.push(p);
    if(id !== G.hostId){
      note(`${nm} sat down at the table.`);
      if(LOCKED.includes(G.phase) || G.phase === 'results') say(`Welcome, ${nm}. You're in next round.`);
    }
  } else {
    const was = p.connected; p.connected = true; p.left = false;
    if(!was) note(`${p.name} is back.`);
  }
  p.lastSeen = Date.now();
  if(conn){
    const old = conns.get(id);
    conns.set(id, conn); conn.clientId = id;
    if(old && old !== conn){ try{ old.close(); }catch(e){} }
  }
  broadcast();
}

function hostHandle(fromId, msg){
  if(!G || !msg || typeof msg !== 'object') return;
  const p = P(fromId); if(!p) return;
  p.lastSeen = Date.now();
  let changed = false;
  if(!p.connected && msg.t !== 'leave'){ p.connected = true; p.left = false; note(`${p.name} is back.`); changed = true; }
  switch(msg.t){
    case 'ping': break;
    case 'start': if(fromId === G.hostId && G.phase === 'lobby'){ startRound(); changed = true; } break;
    case 'settings': changed = changeSettings(p, msg) || changed; break;
    case 'bet': changed = placeBet(p, msg.amount) || changed; break;
    case 'chip': changed = addChip(p, msg.k, msg.amt) || changed; break;
    case 'undo': changed = undoChip(p) || changed; break;
    case 'clearbets': changed = clearChips(p) || changed; break;
    case 'done': changed = doneBetting(p) || changed; break;
    case 'act': changed = playerAct(p, msg.a) || changed; break;
    case 'beg': changed = beg(p) || changed; break;
    case 'leave': removePlayer(p); changed = true; break;
  }
  if(changed) broadcast();
}

/* ---------- settings ---------- */
function changeSettings(p, s){
  if(p.id !== G.hostId) return false;
  if(!(G.phase === 'lobby' || G.phase === 'betting' || G.phase === 'results')) return false;
  const st = G.settings, before = JSON.stringify(st);
  if(s.game && GAMES[s.game]) st.game = s.game;
  if(s.target === 21 || s.target === 33) st.target = s.target;
  if(typeof s.doom === 'boolean'){ st.doom = s.doom; if(!st.doom) G.players.forEach(x => { x.curse = null; }); }
  if(JSON.stringify(st) === before) return false;
  note(`Host switched the table to ${tableLabel(st)}.`);
  if(G.phase === 'betting'){
    for(const x of G.players){ x.chips += x.bet; x.bet = 0; x.bets = {}; x.betOrder = []; x.ready = false; x.inRound = false; }
    startRound();
  }
  return true;
}
function tableLabel(st){
  const g = st.game === 'blackjack' ? `Blackjack ${st.target}` : GAMES[st.game];
  return g + (st.doom ? ' with the Wheel of Doom' : ' (no punishments)');
}

/* ---------- round flow (all games) ---------- */
function saveGhost(p){ G.ghosts[p.id] = {chips:p.chips, begs:p.begs}; }
function startRound(){
  G.players.filter(p => p.left).forEach(saveGhost);
  G.players = G.players.filter(p => !p.left);
  G.round++; G.phase = 'betting'; G.turn = null; G.turnOrder = [];
  G.dealer = {hand:[], hidden:true}; G.dealerBJ = false;
  for(const p of G.players) Object.assign(p, {bet:0, bets:{}, betOrder:[], ready:false, inRound:false, hand:[], status:'', result:'', delta:0, doubled:false, hits:0, finalTotal:null, finalLimit:null});
  const g = GAME();
  if(g !== 'roulette' && G.shoe.length < DECKS*52*0.3){ G.shoe = newShoe(); note('Fresh shoe! Myla shuffles six decks.'); }
  if(g === 'baccarat') Object.assign(G.bac, {seq:[], shown:0, winner:null, pt:0, bt:0});
  G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME;
  say(pick(g === 'roulette' ? LINES.rlBet : g === 'baccarat' ? LINES.bacBet : LINES.bjBet));
}
function eligibleBettors(){ return G.players.filter(p => p.connected && !p.left && (p.ready || p.bet > 0 || p.chips >= MIN_BET)); }
function allBetsIn(){ const e = eligibleBettors(); return e.length > 0 && e.every(p => p.ready) && G.players.some(p => p.inRound); }
function closeBetting(){
  if(!G.players.some(p => p.inRound)){ G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME; say(pick(LINES.idle)); return; }
  const g = GAME();
  if(g === 'blackjack') deal();
  else if(g === 'roulette') rlSpin();
  else bacDeal();
}

// blackjack: one bet
function placeBet(p, amount){
  if(G.phase !== 'betting' || p.ready || GAME() !== 'blackjack') return false;
  amount = Math.floor(Number(amount) || 0);
  if(amount < MIN_BET || amount > p.chips) return false;
  p.lastBet = amount;
  if(activeCurse(p) === 'double'){
    const d = Math.min(amount*2, p.chips);
    if(d > amount) note(`DOUBLE TROUBLE! ${p.name}'s bet got doubled to ${fmt(d)}.`, {bad:true});
    amount = d;
  }
  p.bet = amount; p.chips -= amount; p.ready = true; p.inRound = true;
  return true;
}
// roulette / baccarat: many chips on many spots
function addChip(p, k, amt){
  const g = GAME();
  if(G.phase !== 'betting' || p.ready || g === 'blackjack') return false;
  if(g === 'roulette' ? !rlValidKey(k) : !BAC_BETS[k]) return false;
  amt = Math.floor(Number(amt) || 0);
  if(amt > p.chips) amt = p.chips;
  if(amt < 1) return false;
  p.bets[k] = (p.bets[k] || 0) + amt; p.betOrder.push([k, amt]);
  p.chips -= amt; p.bet += amt; p.inRound = true;
  return true;
}
function undoChip(p){
  if(G.phase !== 'betting' || p.ready || !p.betOrder.length) return false;
  const [k, amt] = p.betOrder.pop();
  p.bets[k] -= amt; if(p.bets[k] <= 0) delete p.bets[k];
  p.chips += amt; p.bet -= amt; p.inRound = p.bet > 0;
  return true;
}
function clearChips(p){
  if(G.phase !== 'betting' || p.ready || !p.bet) return false;
  p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
  return true;
}
function doneBetting(p){
  if(G.phase !== 'betting' || p.ready || GAME() === 'blackjack') return false;
  p.ready = true; p.inRound = p.bet > 0;
  return true;
}

/* ---------- blackjack ---------- */
function deal(){
  const ps = G.players.filter(p => p.inRound);
  G.phase = 'playing'; G.dealer = {hand:[], hidden:true}; G.dealerBJ = false;
  for(const p of ps){ p.hand = []; p.status = 'playing'; }
  for(let i=0;i<2;i++){ for(const p of ps) p.hand.push(draw()); G.dealer.hand.push(draw()); }
  for(const p of ps) if(pNatural(p)){ p.status = 'blackjack'; note(`${p.name} has BLACKJACK!`, {delay:1900}); }
  G.turnOrder = ps.map(p => p.id); G.turn = null;
  const up = G.dealer.hand[0].r;
  if(up === 'A' || isTen(up)){
    G.phase = 'peek'; G.phaseTotal = DEAL_ANIM + PEEK_TIME; G.phaseEnds = Date.now() + G.phaseTotal;
    say(up === 'A' ? 'Ace showing. Let me check for blackjack...' : 'Ten showing. Let me check for blackjack...');
  } else { say(pick(LINES.bjDeal)); nextTurn(DEAL_ANIM); }
}
function endPeek(){
  if(isNatural(G.dealer.hand)){ G.dealer.hidden = false; G.dealerBJ = true; say('Dealer blackjack! Sorry, everyone.'); finishBlackjack(); }
  else { G.phase = 'playing'; say('No blackjack. Your move.'); nextTurn(); }
}
function nextTurn(extra = 0){
  const order = G.turnOrder;
  let i = G.turn ? order.indexOf(G.turn) + 1 : 0;
  for(; i < order.length; i++){
    const p = P(order[i]); if(!p) continue;
    if(p.status === 'playing'){
      if(p.connected){ G.turn = p.id; G.turnTotal = turnTime(p) + extra; G.turnEnds = Date.now() + G.turnTotal; return; }
      p.status = 'stand';
    }
  }
  G.turn = null;
  dealerPlay();
}
function playerAct(p, a){
  if(G.phase !== 'playing' || G.turn !== p.id || p.status !== 'playing') return false;
  const lim = limitOf(p);
  if(a === 'hit'){
    p.hand.push(draw()); p.hits++;
    const v = pv(p);
    if(v > lim){ p.status = 'bust'; note(`${p.name} BUSTS with ${v}!`, {bad:true}); nextTurn(); }
    else if(v === lim){ p.status = 'stand'; if(v === TGT() && TGT() === 33) note(`${p.name} hit exactly 33!`); nextTurn(); }
    else { G.turnTotal = turnTime(p); G.turnEnds = Date.now() + G.turnTotal; }
    return true;
  }
  if(a === 'stand'){
    if(activeCurse(p) === 'nochicken' && p.hits === 0){ addEvent({type:'toast', to:p.id, text:'NO CHICKENS! You have to hit at least once first.', bad:true}); return true; }
    p.status = 'stand'; nextTurn(); return true;
  }
  if(a === 'double'){
    if(p.hand.length !== 2 || p.hits > 0 || p.chips < p.bet) return false;
    p.chips -= p.bet; p.bet *= 2; p.hits++; p.doubled = true;
    p.hand.push(draw());
    const v = pv(p);
    if(v > lim){ p.status = 'bust'; note(`${p.name} doubled down and BUSTED with ${v}!`, {bad:true}); }
    else { p.status = 'stand'; note(`${p.name} doubled down: ${v}.`); }
    nextTurn(); return true;
  }
  return false;
}
function dealerPlay(){
  G.phase = 'dealer'; G.dealer.hidden = false; G.turn = null;
  const live = G.players.some(p => p.inRound && p.status !== 'bust' && p.status !== 'blackjack');
  const anyBJ = G.players.some(p => p.inRound && p.status === 'blackjack');
  say(live ? "Let's see what I've got..." : anyBJ ? 'Nothing left to play for. Let me flip my card.' : "Everybody busted? I didn't even have to try.");
  const g = G;
  const step = () => {
    if(G !== g || G.phase !== 'dealer') return;
    const v = handValue(G.dealer.hand, TGT()).total;
    if(live && v < DSTAND()){ G.dealer.hand.push(draw()); broadcast(); setTimeout(step, 850); }
    else setTimeout(() => { if(G === g && G.phase === 'dealer'){ finishBlackjack(); broadcast(); } }, 650);
  };
  setTimeout(step, 900);
}
function finishBlackjack(){
  const T = TGT(), d = handValue(G.dealer.hand, T).total, dBust = d > T, dBJ = isNatural(G.dealer.hand);
  G.dealerBJ = dBJ;
  if(!dBJ) say(dBust ? pick(LINES.dBust) : `Dealer has ${d}.`);
  for(const p of G.players.filter(p => p.inRound)){
    const v = pv(p);
    p.finalTotal = v; p.finalLimit = limitOf(p);
    let res;
    if(p.status === 'blackjack') res = dBJ ? 'push' : 'bj';
    else if(dBJ) res = 'lose';
    else if(p.status === 'bust') res = 'lose';
    else if(dBust || v > d) res = (T === 33 && v === 33) ? 'win33' : 'win';
    else if(v < d) res = 'lose';
    else res = 'push';
    let delta;
    if(res === 'win'){ p.chips += p.bet*2; delta = p.bet; }
    else if(res === 'win33'){ p.chips += p.bet*3; delta = p.bet*2; }
    else if(res === 'bj'){ const w = Math.floor(p.bet*1.5); p.chips += p.bet + w; delta = w; }
    else if(res === 'push'){ p.chips += p.bet; delta = 0; }
    else delta = -p.bet;
    p.result = res; p.delta = delta;
  }
  settle();
}

/* ---------- roulette ---------- */
function rlSpin(){
  G.phase = 'spinning';
  G.rl.result = rnd(37); G.rl.spinId++;
  G.phaseTotal = SPIN_TIME; G.phaseEnds = Date.now() + SPIN_TIME;
  say('No more bets!');
}
function rlFinish(){
  const n = G.rl.result;
  G.rl.history.unshift(n); G.rl.history = G.rl.history.slice(0, 16);
  say(n === 0 ? 'Zero! Green zero.' : `${n} ${rlColor(n)}.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)) if(rlCovers(k, n)) ret += amt*(rlPays(k) + 1);
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }
  settle();
}

/* ---------- baccarat ---------- */
function bacDeal(){
  G.phase = 'dealing';
  const p1 = draw(), b1 = draw(), p2 = draw(), b2 = draw();
  const PH = [p1, p2], BH = [b1, b2], seq = [['P',p1],['B',b1],['P',p2],['B',b2]];
  const pt = bacTotal(PH), bt = bacTotal(BH);
  if(pt < 8 && bt < 8){
    let p3 = null;
    if(pt <= 5){ p3 = draw(); PH.push(p3); seq.push(['P',p3]); }
    let bDraw;
    if(p3 === null) bDraw = bt <= 5;
    else { const v = bacVal(p3); bDraw = bt <= 2 || (bt === 3 && v !== 8) || (bt === 4 && v >= 2 && v <= 7) || (bt === 5 && v >= 4 && v <= 7) || (bt === 6 && (v === 6 || v === 7)); }
    if(bDraw){ const b3 = draw(); BH.push(b3); seq.push(['B',b3]); }
  }
  Object.assign(G.bac, {seq, shown:0, nextAt:Date.now() + 700, winner:null});
  G.phaseTotal = 1; G.phaseEnds = 0;
  say('Cards, please.');
}
function bacStep(now){
  const b = G.bac;
  if(b.shown < b.seq.length){
    b.shown++;
    b.nextAt = now + (b.shown >= 4 ? BAC_STEP + 500 : BAC_STEP);
    if(b.shown === 4){
      const pt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'P').map(x => x[1])), bt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'B').map(x => x[1]));
      if(pt >= 8 || bt >= 8) say(`Natural ${Math.max(pt, bt)}!`);
      else if(b.seq.length > 4) say(b.seq[4][0] === 'P' ? 'Player draws.' : 'Banker draws.');
    } else if(b.shown === 5 && b.seq.length === 6) say('Banker draws.');
    return true;
  }
  bacFinish(); return true;
}
function bacFinish(){
  const b = G.bac;
  const PH = b.seq.filter(x => x[0] === 'P').map(x => x[1]), BH = b.seq.filter(x => x[0] === 'B').map(x => x[1]);
  const pt = bacTotal(PH), bt = bacTotal(BH);
  const w = pt > bt ? 'P' : bt > pt ? 'B' : 'T';
  const pPair = PH[0].r === PH[1].r, bPair = BH[0].r === BH[1].r;
  Object.assign(b, {winner:w, pt, bt, pPair, bPair});
  b.history.push(w); if(b.history.length > 60) b.history.shift();
  say(w === 'P' ? `Player wins, ${pt} over ${bt}.` : w === 'B' ? `Banker wins, ${bt} over ${pt}.` : `It's a tie, ${pt} all.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)){
      if(k === 'P') ret += w === 'P' ? amt*2 : w === 'T' ? amt : 0;
      else if(k === 'B') ret += w === 'B' ? amt + Math.floor(amt*0.95) : w === 'T' ? amt : 0;
      else if(k === 'T') ret += w === 'T' ? amt*9 : 0;
      else if(k === 'PP') ret += pPair ? amt*12 : 0;
      else if(k === 'BP') ret += bPair ? amt*12 : 0;
    }
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }

}

/* ---------- results + Wheel of Doom (all games) ---------- */
function settle(){
  const losers = [];
  for(const p of G.players.filter(p => p.inRound)){
    if(p.curse && p.curse.round <= G.round) p.curse = null;   // curse served
    if(p.delta > 0 || p.result === 'win' || p.result === 'bj' || p.result === 'win33'){
      p.wins++;
      if(p.renamed){ note(`${p.baseName} won their real name back!`); p.name = p.baseName; p.renamed = false; }
    }
    if(p.result === 'lose'){ p.losses++; losers.push(p); }
  }
  if(G.settings.doom) for(const p of losers) applyCurse(p);
  G.phase = 'results';
  G.phaseTotal = RESULT_TIME + (G.settings.doom && losers.length ? CURSE_TIME : 0);
  G.phaseEnds = Date.now() + G.phaseTotal;
}
function weightedPick(ids){
  const tot = ids.reduce((a,id) => a + CURSES[id].w, 0);
  let r = Math.random() * tot;
  for(const id of ids){ r -= CURSES[id].w; if(r <= 0) return id; }
  return ids[ids.length-1];
}
function applyCurse(p){
  const before = p.name;
  const id = weightedPick(Object.keys(CURSES).filter(k => k !== p.lastCurse && (GAME() === 'blackjack' || !CURSES[k].bj)));
  p.lastCurse = id;
  const c = CURSES[id], ev = {type:'curse', pid:p.id, pname:before, curse:id};
  switch(id){
    case 'tax': { const take = Math.min(p.chips, Math.max(5, Math.ceil(p.chips*0.15))); p.chips -= take; ev.amount = take; break; }
    case 'robin': {
      const amt = Math.ceil(p.chips*0.10);
      const others = G.players.filter(o => o.id !== p.id && !o.left);
      p.chips -= amt; ev.amount = amt;
      if(others.length){ const poor = others.reduce((a,b) => b.chips < a.chips ? b : a); poor.chips += amt; ev.toName = poor.name; }
      else ev.toName = "Myla's tip jar";
      break;
    }
    case 'roast': ev.line = pick(ROASTS); say(`${before}: ${ev.line}`); break;
    case 'rename': { const nn = pick(NAMES.filter(n => n !== p.name)); p.name = nn; p.renamed = true; ev.newName = nn; break; }
    case 'pity': p.chips += 50; break;
    default: if(c.kind === 'next') p.curse = {id, round:G.round + 1};
  }
  addEvent(ev);
}

function beg(p){
  if(p.chips >= MIN_BET || p.bet > 0 || p.ready || LOCKED.includes(G.phase)) return false;
  p.chips += BEG_AMOUNT; p.begs++;
  note(`${p.name} begged Myla for chips${p.begs > 1 ? ` (${p.begs} times now)` : ''}.`);
  say(pick(LINES.beg).replace('{n}', p.name));
  return true;
}
function markAway(p){
  if(!p.connected) return;
  p.connected = false;
  note(`${p.name} lost connection.`, {bad:true});
  if(G.phase === 'playing' && G.turn === p.id){ p.status = 'stand'; nextTurn(); }
}
function removePlayer(p){
  if(p.id === G.hostId) return;
  note(`${p.name} left the table.`);
  const c = conns.get(p.id); conns.delete(p.id);
  if(c) setTimeout(() => { try{ c.close(); }catch(e){} }, 300);
  if(p.inRound && LOCKED.includes(G.phase)){
    p.left = true; p.connected = false;
    if(G.turn === p.id){ p.status = 'stand'; nextTurn(); }
  } else {
    if(G.phase === 'betting'){ p.chips += p.bet; p.bet = 0; }
    saveGhost(p); G.players = G.players.filter(x => x !== p);
  }
}

function tick(){
  if(!G) return;
  const now = Date.now(); let ch = false;
  const hp = P(G.hostId); if(hp) hp.lastSeen = now;
  for(const p of G.players){
    if(p.id !== G.hostId && p.connected && now - p.lastSeen > 15000){ markAway(p); ch = true; }
  }
  switch(G.phase){
    case 'betting':
      if(allBetsIn() && G.phaseEnds - now > 1000){ G.phaseEnds = now + 1000; ch = true; }
      if(now >= G.phaseEnds){ closeBetting(); ch = true; }
      break;
    case 'peek':
      if(now >= G.phaseEnds){ endPeek(); ch = true; }
      break;
    case 'playing':
      if(G.turn && now >= G.turnEnds){
        const p = P(G.turn);
        if(p && p.status === 'playing'){ p.status = 'stand'; note(`${p.name} ran out of time and stands.`); }
        nextTurn(); ch = true;
      }
      break;
    case 'spinning':
      if(now >= G.phaseEnds){ rlFinish(); ch = true; }
      break;
    case 'dealing':
      if(now >= G.bac.nextAt){ bacStep(now); ch = true; }
      break;
    case 'results':
      if(now >= G.phaseEnds){ startRound(); ch = true; }
      break;
  }
  if(ch || now - lastBroadcast > 4000) broadcast();
}

// What each player is allowed to see (no peeking at the dealer's hole card!)
function viewFor(rid){
  const now = Date.now(), g = GAME();
  const v = {
    code:G.code, round:G.round, phase:G.phase, hostId:G.hostId, say:G.say, sayId:G.sayId, settings:{...G.settings},
    turn:G.turn, turnLeft:G.turn ? Math.max(0, G.turnEnds - now) : 0, turnTotal:G.turnTotal,
    phaseLeft:Math.max(0, G.phaseEnds - now), phaseTotal:G.phaseTotal,
    dealer:{hidden:G.dealer.hidden, bj:G.dealerBJ, hand:G.dealer.hand.map((c,i) => (G.dealer.hidden && i === 1) ? {back:true, id:c.id} : c)},
    players:G.players.map(p => {
      const ac = activeCurse(p);
      const blind = ac === 'blind' && p.id === rid && (G.phase === 'playing' || G.phase === 'peek');
      const results = G.phase === 'results' && p.finalTotal != null;
      return {id:p.id, name:p.name, baseName:p.baseName, renamed:p.renamed, chips:p.chips, bet:p.bet, bets:p.bets, ready:p.ready,
        inRound:p.inRound, hand:blind ? p.hand.map(c => ({back:true, id:c.id})) : p.hand, doubled:p.doubled,
        total:!p.hand.length || blind ? null : (results ? p.finalTotal : pv(p)),
        limit:results ? p.finalLimit : limitOf(p),
        status:p.status, result:p.result, delta:p.delta, curse:ac,
        pendingCurse:p.curse && !ac ? p.curse.id : null,
        connected:p.connected, begs:p.begs, hits:p.hits, lastBet:p.lastBet};
    }),
    events:G.events.filter(e => !e.to || e.to === rid).slice(-15),
  };
  if(g === 'roulette') v.rl = {spinId:G.rl.spinId, result:(G.phase === 'spinning' || G.phase === 'results') ? G.rl.result : null, history:G.rl.history};
  if(g === 'baccarat'){
    const shown = G.bac.seq.slice(0, G.bac.shown);
    v.bac = {player:shown.filter(x => x[0] === 'P').map(x => x[1]), banker:shown.filter(x => x[0] === 'B').map(x => x[1]),
      winner:G.phase === 'results' ? G.bac.winner : null, pPair:G.phase === 'results' && G.bac.pPair, bPair:G.phase === 'results' && G.bac.bPair,
      history:G.bac.history.slice(-36)};
  }
  return v;
}
function broadcast(){
  if(!G) return;
  lastBroadcast = Date.now();
  for(const [cid, conn] of conns){
    if(conn && conn.open){ try{ conn.send({t:'state', s:viewFor(cid)}); }catch(e){} }
  }
  onState(viewFor(MY_ID));
}
function startHostLoop(){ clearInterval(hostTimer); hostTimer = setInterval(tick, 250); }

<script>
'use strict';
/* =====================================================================
   SOUND (synthesized, no files needed)
   ===================================================================== */
const SFX = {on:store.get('sound', true), ctx:null};
function actx(){
  if(!SFX.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; try{ SFX.ctx = new C(); }catch(e){ return null; } }
  if(SFX.ctx.state === 'suspended') SFX.ctx.resume().catch(()=>{});
  return SFX.ctx;
}
function tone(f, dur, o = {}){
  const c = actx(); if(!c) return;
  const t = c.currentTime + (o.when || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
  if(o.vib){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = f*0.035; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur); }
  const v = o.vol ?? 0.12;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, o = {}){
  const c = actx(); if(!c) return;
  const t = c.currentTime + (o.when || 0), len = Math.floor(c.sampleRate*dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.value = o.freq || 2000;
  const g = c.createGain(); g.gain.value = o.vol ?? 0.2;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}
const SOUNDS = {
  card: () => noise(.08, {freq:2600, ft:'highpass', vol:.28}),
  chip: () => { tone(1900,.05,{type:'square',vol:.045}); tone(2600,.06,{type:'square',vol:.035,when:.045}); },
  turn: () => { tone(784,.14,{type:'triangle',vol:.16}); tone(1175,.22,{type:'triangle',vol:.14,when:.12}); },
  win:  () => [523,659,784,1047].forEach((f,i) => tone(f,.22,{type:'triangle',vol:.16,when:i*.09})),
  big:  () => { [523,659,784,1047,784,1047].forEach((f,i) => tone(f,.25,{type:'square',vol:.06,when:i*.11})); tone(1568,.8,{type:'triangle',vol:.14,when:.7}); },
  lose: () => { [392,370,349].forEach((f,i) => tone(f,.38,{type:'sawtooth',vol:.05,when:i*.42})); tone(330,1.1,{type:'sawtooth',vol:.05,when:1.26,vib:7}); },
  bust: () => tone(300,.45,{type:'sawtooth',vol:.07,slide:70}),

  ball: () => tone(2200 + Math.random()*500,.02,{type:'triangle',vol:.05}),
  doom: () => { tone(98,.9,{type:'sawtooth',vol:.1,slide:45}); noise(.8,{freq:300,vol:.35}); },

};
function sfx(n){ if(!SFX.on) return; try{ SOUNDS[n] && SOUNDS[n](); }catch(e){} }
let VOICE = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    VOICE = vs.find(v => /samantha|victoria|karen|zira|susan|serena|moira|tessa|ava|allison|jenny|aria|female|google us english/i.test(v.name)) || vs[0] || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function speak(text){
  if(!SFX.on || !('speechSynthesis' in window)) return;

/* =====================================================================

function toast(msg, kind = '', html = false){
  const box = $('#toasts'), t = document.createElement('div');

  box.appendChild(t);
  while(box.children.length > 4) box.children[0].remove();

}
function quake(){ const a = $('#app'); a.classList.add('quake'); sfx('quake'); buzz(700); setTimeout(() => a.classList.remove('quake'), 2300); }
function rainL(){
  const fx = $('#fx');
  for(let i=0;i<36;i++){
    const d = document.createElement('div'); d.className = 'drop'; d.textContent = 'L';
    d.style.cssText = `--x:${rnd(96)}vw;--s:${28+rnd(80)}px;--t:${(1.8+Math.random()*1.6).toFixed(2)}s;--dl:${(Math.random()*1.4).toFixed(2)}s;--r:${rnd(70)-35}deg`;

}
function banner(text){ const b = document.createElement('div'); b.className = 'banner'; b.textContent = text; document.body.appendChild(b); setTimeout(() => b.remove(), 2400); }

let modalKind = null, doomTimer = null;
function openModal(html, kind){ clearTimeout(doomTimer); const m = $('#modal'); m.innerHTML = html; m.classList.add('show'); modalKind = kind; }
function closeModal(){ clearTimeout(doomTimer); const m = $('#modal'); m.classList.remove('show'); m.innerHTML = ''; modalKind = null; }

  openModal(`<div class="dlg"><h3>${title}</h3><p>${text}</p><div class="btnrow">${cancel ? `<button class="btn ghost" id="dlgNo">${cancel}</button>` : ''}<button class="btn ${danger ? 'stand' : ''}" id="dlgYes">${ok}</button></div></div>`, kind);

function curseDetail(e, long){
  switch(e.curse){
    case 'tax':    return long ? `<br><b>-${fmt(e.amount)} chips</b>` : ` (-${fmt(e.amount)} chips)`;
    case 'robin':  return long ? `<br><b>${fmt(e.amount)} chips</b> went to <b>${esc(e.toName)}</b>.` : ` (${fmt(e.amount)} chips to ${esc(e.toName)})`;
    case 'rename': return long ? `<br>You are now <b>"${esc(e.newName)}"</b>.` : `: now called "${esc(e.newName)}"`;

let GEO = null;
function computeGeo(){
  const vw = document.documentElement.clientWidth || innerWidth, vh = innerHeight;
  const wide = vw >= 720;
  const W = Math.round(Math.min(vw - (wide ? 40 : 12), 1060));
  const barH = wide ? 86 : 66, av = wide ? 76 : 58;
  const consoleH = wide ? 170 : 255;
  let H = wide ? Math.min(W*0.56, vh - 52 - barH - consoleH + 12) : Math.min(W*1.5, vh - 52 - barH - consoleH + 12);
  H = Math.round(Math.max(wide ? 380 : 440, H));
  const rail = Math.round(Math.max(14, Math.min(26, W*0.026)));
  const y0 = Math.round(H*0.10);
  const sz = wide ? {myCw:68, oCw:46, dCw:64, myW:200, oW:128, cr:24, ph:34, gap:12} : {myCw:52, oCw:32, dCw:46, myW:184, oW:86, cr:18, ph:30, gap:6};
  const inset = rail + sz.cr + sz.ph + (wide ? 16 : 10);
  const cx = W/2, rx = W/2 - inset, ry = H - y0 - inset;
  const pts = []; let acc = 0; const N = 500;
  for(let i=0;i<=N;i++){
    const th = Math.PI/2 + (Math.PI/2 - 0.1)*i/N;
    const x = cx + rx*Math.cos(th), y = y0 + ry*Math.sin(th);
    if(i) acc += Math.hypot(x - pts[i-1].x, y - pts[i-1].y);
    pts.push({x, y, s:acc});
  }
  const along = s => { for(const q of pts) if(q.s >= s) return q; return pts[pts.length-1]; };
  const seat = (side, ring) => {
    if(side === 0) return {x:cx, y:y0 + ry};
    const q = along((sz.myW + sz.oW)/2 + sz.gap + ring*(sz.oW + sz.gap));
    let x = side < 0 ? q.x : 2*cx - q.x;
    x = Math.max(sz.oW/2 + 2, Math.min(W - sz.oW/2 - 2, x));
    return {x, y:q.y};
  };
  const rackW = Math.round(Math.min(W*0.32, 300)), rackH = wide ? 28 : 18;
  return {W, H, wide, barH, av, rail, y0, cx, rx, ry, sz, seat, rackW, rackH, dTop:4 + rackH + (wide ? 14 : 8), shoeW:wide ? 62 : 42, key:`${W}x${H}`};
}

function wheelSVG(){

  for(let i=0;i<n;i++){
    const num = RL_ORDER[i], a0 = (i - .5)*st, a1 = (i + .5)*st;
    const [x0,y0] = pt(86,a0), [x1,y1] = pt(86,a1), [x2,y2] = pt(62,a1), [x3,y3] = pt(62,a0);
    const col = num === 0 ? '#0a8a45' : RL_RED.has(num) ? '#c8102e' : '#161616';
    pockets += `<path d="M${x0} ${y0} A86 86 0 0 1 ${x1} ${y1} L${x2} ${y2} A62 62 0 0 0 ${x3} ${y3} Z" fill="${col}"/>`;
    frets += `<line x1="${x0}" y1="${y0}" x2="${x3}" y2="${y3}"/>`;
    nums += `<text transform="rotate(${(i*st).toFixed(2)}) translate(0 -78)">${num}</text>`;
  }

let wAngle = 0, bAngle = 0, lastSpinId = null, wAnim = null, bAnim = null, dAnim = null, spinP = null;

function syncWheel(){
  const wr = $('#wheelRot'), br = $('#ballRot'), ball = $('#ball');

  if(S.phase === 'spinning' && rl.result != null && rl.spinId !== lastSpinId){ lastSpinId = rl.spinId; startSpin(rl, wr, br, ball); return; }

function startSpin(rl, wr, br, ball){
  const dur = SPIN_TIME - 900;
  if(!spinP || spinP.id !== rl.spinId){
    const pa = RL_ORDER.indexOf(rl.result)*360/37;
    const sw = wAngle, ew = sw + 1120 + rnd(280);
    const target = ((pa + ew) % 360 + 360) % 360;
    const sb = bAngle; let eb = sb - 1620; eb -= (((eb - target) % 360) + 360) % 360;
    const elapsed = Math.max(0, (S.phaseTotal || SPIN_TIME) - S.phaseLeft);

  }
  [wAnim, bAnim, dAnim].forEach(a => { try{ a && a.cancel(); }catch(e){} });
  ball.style.transform = '';
  const ease = 'cubic-bezier(.1,.62,.16,1)';
  try{
    wAnim = wr.animate([{transform:`rotate(${spinP.sw}deg)`},{transform:`rotate(${spinP.ew}deg)`}], {duration:dur, easing:ease, fill:'forwards'});
    bAnim = br.animate([{transform:`rotate(${spinP.sb}deg)`},{transform:`rotate(${spinP.eb}deg)`}], {duration:dur, easing:ease, fill:'forwards'});
    dAnim = ball.animate([{transform:'translateY(0)'},{transform:'translateY(9px)', offset:.55},{transform:'translateY(5px)', offset:.7},{transform:'translateY(22px)'}], {duration:dur*.3, delay:dur*.58, easing:'ease-in', fill:'both'});
    const t = Math.min(performance.now() - spinP.t0, dur);
    wAnim.currentTime = t; bAnim.currentTime = t; dAnim.currentTime = t;
  }catch(e){
    wr.style.transform = `rotate(${wAngle}deg)`; br.style.transform = `rotate(${bAngle}deg)`; ball.style.transform = 'translateY(22px)';
  }
}

/* =====================================================================
   BLACKJACK RENDER
   ===================================================================== */
function dealerSpotHTML(){
  const g = GEO, h = S.dealer.hand, T = S.settings.target;
  const hs = handHTML(h, false);
  let badge = '';
  if(h.length){
    const hidden = h.some(c => c.back), v = handValue(h, T).total, dl = landDelay(h);
    if(S.dealer.bj) badge = `<span class="tb bj late"${dl}>BLACKJACK</span>`;
    else badge = `<span class="tb late${v > T ? ' bust' : ''}"${dl}>${hidden ? v : (v > T ? 'BUST ' + v : v)}</span>`;
  }
  return `<div class="dspot${S.phase === 'peek' ? ' peeking' : ''}" style="left:${g.cx}px;top:${g.dTop}px;--cw:${g.sz.dCw}px">${hs}${badge}</div>`;
}
function seatNote(p){
  if(!p.connected) return 'away';
  if(S.phase === 'betting') return p.ready ? '' : (p.chips < MIN_BET ? 'broke' : 'betting...');
  if(S.phase === 'lobby') return '';
  if(!p.inRound) return S.phase === 'results' ? '' : 'next hand';
  return '';
}
function resultTag(p){
  switch(p.result){
    case 'bj': return `<div class="rtag bj">BLACKJACK +${fmt(p.delta)}</div>`;
    case 'win33': return `<div class="rtag win33">33! +${fmt(p.delta)}</div>`;
    case 'win': return `<div class="rtag win">WIN +${fmt(p.delta)}</div>`;
    case 'push': return `<div class="rtag push">PUSH</div>`;
    case 'lose': return `<div class="rtag lose">${p.status === 'bust' ? 'BUST' : 'LOST'} -${fmt(-p.delta)}</div>`;
  }
  return '';
}
function seatHTML(p, pos, mine){
  const sz = GEO.sz, cw = mine ? sz.myCw : sz.oCw, mini = !mine && cw < 40, compact = !mine && !GEO.wide;
  const isTurn = S.phase === 'playing' && S.turn === p.id;
  const cards = p.inRound && p.hand.length > 0;
  const handStr = cards ? handHTML(p.hand, mini, p.doubled ? 2 : -1) : '';
  let tb = '';
  if(cards){
    const dl = landDelay(p.hand);
    if(p.status === 'blackjack') tb = `<span class="tb bj late"${dl}>BJ</span>`;
    else if(p.total == null) tb = `<span class="tb late"${dl}>?</span>`;
    else tb = `<span class="tb late${p.status === 'bust' ? ' bust' : ''}${p.total === S.settings.target && S.settings.target === 33 ? ' t33' : ''}"${dl}>${p.status === 'bust' ? 'BUST' : p.total}</span>`;
    if(compact && S.phase === 'results'){
      const r = p.result;
      tb = r === 'bj' ? '<span class="tb bj">BJ</span>' : r === 'win33' ? '<span class="tb t33">33!</span>' : r === 'win' ? `<span class="tb rw">+${short(p.delta)}</span>` : r === 'push' ? '<span class="tb rp">PUSH</span>' : `<span class="tb rl">${p.status === 'bust' ? 'BUST' : '-' + short(-p.delta)}</span>`;
    }
  }
  const c = p.curse && CURSES[p.curse], pc = p.pendingCurse && CURSES[p.pendingCurse];
  const curseB = c ? `<div class="cb" title="${esc(c.desc)}">${c.name}</div>` : (pc ? `<div class="cb pend" title="${esc(pc.desc)}">NEXT: ${pc.name}</div>` : '');
  const note = seatNote(p);
  return `<div class="seat${mine ? ' me' : ''}${isTurn ? ' turn' : ''}${!p.connected ? ' away' : ''}" style="left:${pos.x.toFixed(1)}px;top:${pos.y.toFixed(1)}px;--cw:${cw}px;--cr:${sz.cr}px;--ph:${sz.ph}px">
    ${S.phase === 'results' && p.inRound && !compact ? resultTag(p) : ''}
    <div class="sh">${cards ? handStr : (note ? `<div class="snote">${note}</div>` : '')}${tb}</div>
    <div class="spot">${p.inRound && p.bet ? chipStack(p.bet) : ''}${isTurn ? '<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" pathLength="100" data-ring="1"/></svg>' : ''}</div>
    <div class="plaque"><b>${esc(p.name)}${p.id === S.hostId ? '<i class="host">HOST</i>' : ''}</b><span>${fmt(p.chips)}</span></div>
    ${compact ? '' : curseB}
  </div>`;
}
function renderBlackjack(me){
  const ps = S.players, i = ps.findIndex(p => p.id === MY_ID);
  const rest = i >= 0 ? ps.slice(i + 1).concat(ps.slice(0, i)) : ps.slice();
  const L = Math.ceil(rest.length/2), left = rest.slice(0, L), right = rest.slice(L).reverse();
  let html = dealerSpotHTML();
  if(me) html += seatHTML(me, GEO.seat(0, 0), true);
  left.forEach((p,k) => { html += seatHTML(p, GEO.seat(-1, k), false); });
  right.forEach((p,k) => { html += seatHTML(p, GEO.seat(1, k), false); });
  $('#dyn').innerHTML = html;
}

function rlSideHTML(){

function boardHTML(vert){
  const {tot, mine} = betTotals();
  const res = S.phase === 'results' && S.rl && S.rl.result != null ? S.rl.result : null;
  const cell = (k, label, area, cls) => {
    const t = tot[k], win = res != null && rlCovers(k, res);
    return `<button class="rc ${cls}${win ? (k[0] === 'n' ? ' win' : ' cover') : ''}" data-act="rk" data-k="${k}" style="grid-area:${area}">${label}${t ? `<span class="mk${mine[k] ? ' mine' : ''}" style="--c:${chipColor(t)}">${short(t)}</span>` : ''}</button>`;
  };
  const outs = [['low','1 to 18'],['even','EVEN'],['red','<i class="dia red"></i>'],['black','<i class="dia black"></i>'],['odd','ODD'],['high','19 to 36']];
  const dz = ['1st 12','2nd 12','3rd 12'];
  let h = '';
  if(!vert){
    h += cell('n0', '0', '1/1/4/2', 'green');
    for(let j=0;j<12;j++) for(let r=0;r<3;r++){ const num = 3*(j+1) - r; h += cell('n'+num, num, `${r+1}/${j+2}/${r+2}/${j+3}`, rlColor(num)); }
    ['c3','c2','c1'].forEach((k,r) => { h += cell(k, '2 to 1', `${r+1}/14/${r+2}/15`, 'out'); });
    ['d1','d2','d3'].forEach((k,i) => { h += cell(k, dz[i], `4/${2+4*i}/5/${6+4*i}`, 'out'); });
    outs.forEach(([k,l],i) => { h += cell(k, l, `5/${2+2*i}/6/${4+2*i}`, 'out'); });
  } else {
    h += cell('n0', '0', '1/3/2/6', 'green');
    for(let r=0;r<12;r++) for(let c=0;c<3;c++){ const num = 3*r + c + 1; h += cell('n'+num, num, `${r+2}/${c+3}/${r+3}/${c+4}`, rlColor(num)); }
    ['c1','c2','c3'].forEach((k,c) => { h += cell(k, '2:1', `14/${c+3}/15/${c+4}`, 'out'); });
    ['d1','d2','d3'].forEach((k,i) => { h += cell(k, `<span>${dz[i]}</span>`, `${2+4*i}/2/${6+4*i}/3`, 'out vt'); });
    outs.forEach(([k,l],i) => { h += cell(k, k === 'red' || k === 'black' ? l : `<span>${l}</span>`, `${2+2*i}/1/${4+2*i}/2`, 'out vt'); });
  }
  return h;
}
function pstripHTML(){
  return S.players.map(p => {
    let em = '';
    if(S.phase === 'betting') em = p.bet ? `<em>BET ${fmt(p.bet)}</em>` : `<em>${p.ready ? 'SITTING OUT' : 'BETTING...'}</em>`;
    else if(S.phase === 'results' && p.inRound) em = p.delta > 0 ? `<em class="win">WON +${fmt(p.delta)}</em>` : p.delta < 0 ? `<em class="lose">LOST ${fmt(-p.delta)}</em>` : '<em>PUSH</em>';
