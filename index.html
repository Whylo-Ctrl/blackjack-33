// One id per browser tab (survives reloads), so two tabs = two players and a reload keeps your seat.
function tabId(){
  let id = null;
  try{ id = sessionStorage.getItem('bj33.id'); }catch(e){}
  if(!id){ id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); try{ sessionStorage.setItem('bj33.id', id); }catch(e){} }
  return id;
}
const MY_ID = tabId();
const isTen = r => r === '10' || r === 'J' || r === 'Q' || r === 'K';

function handValue(cards, limit = 21, acesLow = false){
  let t = 0, aces = 0;
  for(const c of cards){
    if(!c || c.back) continue;
    if(c.r === 'A'){ if(acesLow) t += 1; else { t += 11; aces++; } }
    else if(isTen(c.r)) t += 10;
    else t += Number(c.r);
  }
  while(t > limit && aces > 0){ t -= 10; aces--; }
  return {total:t, soft:aces > 0};
}
// A "blackjack" is an Ace + a 10-value card as your first two cards (in both 21 and 33 mode).
function isNatural(cards, acesLow = false){
  return cards.length === 2 && !acesLow && cards.every(c => !c.back) && cards.some(c => c.r === 'A') && cards.some(c => isTen(c.r));
}

/* =====================================================================
   HOST: the game engine. Only runs in the browser that created the table.
   ===================================================================== */
let G = null;
const conns = new Map();   // player id -> PeerJS connection
let hostTimer = null, lastBroadcast = 0;

function newGame(code){
  return {code, round:0, phase:'lobby', settings:{game:'blackjack', target:33, doom:true, impHint:true}, bs:null, imp:null,
    players:[], dealer:{hand:[],hidden:true}, dealerBJ:false,
    say:"Welcome to Whylo's. I'm Myla, your dealer tonight. Take a seat.", sayId:1,
    turn:null, turnOrder:[], turnEnds:0, turnTotal:TURN_TIME, phaseEnds:0, phaseTotal:1,
    shoe:newShoe(), cardSeq:0, events:[], evSeq:0, hostId:MY_ID, ghosts:{},
    rl:{result:null, spinId:0, history:[]},
    bac:{seq:[], shown:0, nextAt:0, winner:null, pt:0, bt:0, history:[]}};
}
function newShoe(){ const s=[]; for(let d=0;d<DECKS;d++) for(const su of SUITS) for(const r of RANKS) s.push({r,s:su}); return shuffle(s); }
function draw(){ if(!G.shoe.length) G.shoe = newShoe(); const c = G.shoe.pop(); return {r:c.r, s:c.s, id:++G.cardSeq}; }
function P(id){ return G.players.find(p => p.id === id); }
function addEvent(e){ e.id = ++G.evSeq; G.events.push(e); if(G.events.length > 40) G.events.shift(); }
function note(text, extra = {}){ addEvent({type:'toast', text, ...extra}); }
function say(t){ G.say = t; G.sayId++; }
const GAME = () => G.settings.game;
const TGT = () => G.settings.target;
const DSTAND = () => G.settings.target === 21 ? 17 : 29;
function activeCurse(p){ return p.curse && p.curse.round <= G.round ? p.curse.id : null; }
function limitOf(p){ return activeCurse(p) === 'shrink' ? TGT() - 3 : TGT(); }
function pv(p){ return handValue(p.hand, limitOf(p), activeCurse(p) === 'aces').total; }
function pNatural(p){ return isNatural(p.hand, activeCurse(p) === 'aces'); }
function turnTime(p){ return activeCurse(p) === 'speed' ? SPEED_TIME : TURN_TIME; }
function cleanName(n){ n = String(n || '').replace(/\s+/g,' ').trim().slice(0,14); return n || 'Player'; }
const LOCKED = ['playing','peek','dealer','spinning','dealing','shotgun','imp','shooter'];

function handleJoin(msg, conn){
  if(!G) return;
  const id = String(msg.id || '').slice(0,40); if(!id) return;
  let p = P(id);
  const name = cleanName(msg.name);
  if(!p){
    if(G.players.filter(x => !x.left).length >= MAX_PLAYERS){
      if(conn){ try{ conn.send({t:'reject', reason:'That table is full (6 players max).'}); }catch(e){} setTimeout(()=>{ try{ conn.close(); }catch(e){} }, 600); }
      return;
    }
    let nm = name, k = 2;
    while(G.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = name.slice(0,11) + ' ' + (k++);
    p = {id, name:nm, baseName:nm, renamed:false, chips:START_CHIPS, bet:0, bets:{}, betOrder:[], lastBets:null, lastGame:null, main:0, side:null, ready:false, inRound:false,
         hand:[], status:'', result:'', delta:0, doubled:false, finalTotal:null, finalLimit:null, curse:null, lastCurse:null,
         connected:true, left:false, lastSeen:Date.now(), begs:0, hits:0, wins:0, losses:0};
    const ghost = G.ghosts[id];
    if(ghost){ p.chips = ghost.chips; p.begs = ghost.begs; delete G.ghosts[id]; }
    G.players.push(p);
    if(id !== G.hostId){
      note(`${nm} sat down at the table.`);
      if(LOCKED.includes(G.phase) || G.phase === 'results') say(`Welcome, ${nm}. You're in next round.`);
    }
  } else {
    const was = p.connected; p.connected = true; p.left = false;
    if(!was) note(`${p.name} is back.`);
  }
  p.lastSeen = Date.now();
  if(conn){
    const old = conns.get(id);
    conns.set(id, conn); conn.clientId = id;
    if(old && old !== conn){ try{ old.close(); }catch(e){} }
  }
  broadcast();
}

function hostHandle(fromId, msg){
  if(!G || !msg || typeof msg !== 'object') return;
  const p = P(fromId); if(!p) return;
  p.lastSeen = Date.now();
  let changed = false;
  if(!p.connected && msg.t !== 'leave'){ p.connected = true; p.left = false; note(`${p.name} is back.`); changed = true; }
  switch(msg.t){
    case 'ping': break;
    case 'start': if(fromId === G.hostId && G.phase === 'lobby'){ startRound(); changed = true; } break;
    case 'settings': changed = changeSettings(p, msg) || changed; break;
    case 'rebet': changed = rebet(p) || changed; break;
    case 'x2': changed = doubleBets(p) || changed; break;
    case 'chip': changed = addChip(p, msg.k, msg.amt) || changed; break;
    case 'undo': changed = undoChip(p) || changed; break;
    case 'clearbets': changed = clearChips(p) || changed; break;
    case 'done': changed = doneBetting(p, !!msg.out) || changed; break;
    case 'act': changed = playerAct(p, msg.a) || changed; break;
    case 'shoot': if(G.phase === 'shooter' && G.turn === fromId) changed = shooterGo(false) || changed; break;
    case 'bs': changed = bsAct(p, msg) || changed; break;
    case 'imp': changed = impAct(p, msg) || changed; break;
    case 'beg': changed = beg(p) || changed; break;
    case 'leave': removePlayer(p); changed = true; break;
  }
  if(changed) broadcast();
}

/* ---------- settings ---------- */
function changeSettings(p, s){
  if(p.id !== G.hostId) return false;
  if(!(G.phase === 'lobby' || G.phase === 'betting' || G.phase === 'results')) return false;
  const st = G.settings, before = JSON.stringify(st);
  if(s.game && GAMES[s.game]) st.game = s.game;
  if(s.target === 21 || s.target === 33) st.target = s.target;
  if(typeof s.doom === 'boolean'){ st.doom = s.doom; if(!st.doom) G.players.forEach(x => { x.curse = null; }); }
  if(typeof s.impHint === 'boolean') st.impHint = s.impHint;
  if(JSON.stringify(st) === before) return false;
  note(`Host switched the table to ${tableLabel(st)}.`);
  if(G.phase === 'betting'){
    for(const x of G.players){ x.chips += x.bet; x.bet = 0; x.bets = {}; x.betOrder = []; x.ready = false; x.inRound = false; }
    startRound();
  }
  return true;
}
function tableLabel(st){
  const g = st.game === 'blackjack' ? `Blackjack ${st.target}` : GAMES[st.game];
  if(st.game === 'imposter') return g + (st.doom ? ' with the Wheel of Doom' : '');
  return g + (st.doom ? ' with the Wheel of Doom' : ' (no punishments)');
}

/* ---------- round flow (all games) ---------- */
function saveGhost(p){ G.ghosts[p.id] = {chips:p.chips, begs:p.begs}; }
function startRound(){
  G.players.filter(p => p.left).forEach(saveGhost);
  G.players = G.players.filter(p => !p.left);
  G.round++; G.phase = 'betting'; G.turn = null; G.turnOrder = [];
  G.dealer = {hand:[], hidden:true}; G.dealerBJ = false; G.bs = null; G.imp = null;
  for(const p of G.players) Object.assign(p, {bet:0, bets:{}, betOrder:[], main:0, side:null, mainDelta:0, ready:false, inRound:false, hand:[], status:'', result:'', delta:0, doubled:false, hits:0, finalTotal:null, finalLimit:null});
  const g = GAME();
  if((g === 'blackjack' || g === 'baccarat') && G.shoe.length < DECKS*52*0.3){ G.shoe = newShoe(); note('Fresh shoe! Myla shuffles six decks.'); }
  if(g === 'baccarat') Object.assign(G.bac, {seq:[], shown:0, winner:null, pt:0, bt:0});
  G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME;
  say(pick(LINES[{roulette:'rlBet', baccarat:'bacBet', buckshot:'bsBet', imposter:'impBet'}[g] || 'bjBet']));
}
function eligibleBettors(){ return G.players.filter(p => p.connected && !p.left && (p.ready || p.bet > 0 || p.chips >= MIN_BET || FREE_GAMES.includes(GAME()))); }
function allBetsIn(){ const e = eligibleBettors(); return e.length > 0 && e.every(p => p.ready) && G.players.some(p => p.inRound); }
function closeBetting(){
  const g0 = GAME();
  if(g0 === 'blackjack'){
    for(const p of G.players.filter(p => p.inRound && (p.bets.main || 0) < MIN_BET)){
      p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
      addEvent({type:'toast', to:p.id, text:`Your chips came back: you need at least ${MIN_BET} on the main circle to play a hand.`, bad:true});
    }
  }
  if(g0 === 'buckshot'){
    for(const p of G.players.filter(p => p.inRound && (p.bets.stake || 0) < MIN_BET)){
      p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
      addEvent({type:'toast', to:p.id, text:`Your chips came back: the minimum stake is ${MIN_BET}.`, bad:true});
    }
  }
  if(g0 === 'imposter' && G.players.filter(p => p.inRound).length < IMP_MIN){
    G.players.forEach(p => { p.ready = false; p.inRound = false; });
    G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME;
    say(`Imposter needs at least ${IMP_MIN} players. Invite some friends!`); return;
  }
  for(const p of G.players.filter(p => p.inRound)){ if(p.bet) p.lastBets = {...p.bets}; p.lastGame = g0; }
  if(!G.players.some(p => p.inRound)){ G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME; say(pick(LINES.idle)); return; }
  const g = GAME();
  if(g === 'blackjack') deal();
  else if(g === 'roulette') awaitShooter('spin');
  else if(g === 'buckshot') bsStart();
  else if(g === 'imposter') impStart();
  else awaitShooter('deal');
}

/* ---------- taking turns at roulette + baccarat: one player spins the wheel / deals the cards, then the job passes on ---------- */
function nextShooter(){
  const ps = G.players.filter(p => p.inRound && p.connected && !p.left);
  if(!ps.length) return null;
  const order = G.players.filter(p => ps.includes(p));
  const last = G.players.findIndex(p => p.id === G.lastShooter);
  if(last < 0) return order[0];
  for(let k = 1; k <= G.players.length; k++){ const q = G.players[(last + k) % G.players.length]; if(ps.includes(q)) return q; }
  return order[0];
}
function awaitShooter(kind){
  const s = nextShooter();
  if(!s){ if(kind === 'spin') rlSpin(); else { bacDeal(); G.bac.by = null; } return; }
  G.phase = 'shooter'; G.shoot = kind; G.lastShooter = s.id;
  G.turn = s.id; G.turnTotal = SHOOT_TIME; G.turnEnds = Date.now() + SHOOT_TIME;
  say(kind === 'spin' ? `No more bets! ${s.name}, you spin the wheel.` : `No more bets! ${s.name}, you deal the cards.`);
}
function shooterGo(auto){
  if(G.phase !== 'shooter') return false;
  const s = P(G.turn), kind = G.shoot;
  G.turn = null; G.turnEnds = 0;
  G.shotBy = s ? s.name : null;
  if(kind === 'spin'){ rlSpin(); if(s) say(auto ? `I'll spin for ${s.name}.` : `${s.name} spins!`); }
  else { bacDeal(); G.bac.by = G.shotBy; G.shotBy = null; if(s) say(auto ? `I'll deal for ${s.name}.` : `${s.name} deals. Cards out!`); }
  return true;
}

// chips on spots. Blackjack spots: main / pp / p21. Roulette + baccarat: their layouts.
function validSpot(k){
  const g = GAME();
  return g === 'blackjack' ? !!BJ_BETS[k] : g === 'roulette' ? rlValidKey(k) : g === 'buckshot' ? k === 'stake' : g === 'imposter' ? false : !!BAC_BETS[k];
}
function putChip(p, k, amt){
  amt = Math.floor(Number(amt) || 0);
  if(amt > p.chips) amt = p.chips;
  if(amt < 1) return false;
  p.bets[k] = (p.bets[k] || 0) + amt; p.betOrder.push([k, amt]);
  p.chips -= amt; p.bet += amt; p.inRound = true;
  return true;
}
function addChip(p, k, amt){
  if(G.phase !== 'betting' || p.ready || !validSpot(k)) return false;
  return putChip(p, k, amt);
}
// Same bets as last round (only if they were on this game)
function rebet(p){
  if(G.phase !== 'betting' || p.ready || p.bet > 0 || !p.lastBets || p.lastGame !== GAME()) return false;
  const tot = Object.values(p.lastBets).reduce((a,b) => a + b, 0);
  if(tot > p.chips){ addEvent({type:'toast', to:p.id, text:`Not enough chips to rebet ${fmt(tot)}.`, bad:true}); return true; }
  const keys = Object.keys(p.lastBets).sort((a,b) => (a === 'main' ? -1 : 0) - (b === 'main' ? -1 : 0));
  for(const k of keys) if(validSpot(k)) putChip(p, k, p.lastBets[k]);
  return true;
}
// Double every chip already on the table
function doubleBets(p){
  if(G.phase !== 'betting' || p.ready || !p.bet) return false;
  if(p.bet > p.chips){ addEvent({type:'toast', to:p.id, text:'Not enough chips to double your bets.', bad:true}); return true; }
  for(const [k, amt] of Object.entries({...p.bets})) putChip(p, k, amt);
  return true;
}
function undoChip(p){

}
function clearChips(p){

}
function doneBetting(p, out){

  if(GAME() === 'buckshot' && p.bet && (p.bets.stake || 0) < MIN_BET){ addEvent({type:'toast', to:p.id, text:`The minimum stake is ${MIN_BET}.`, bad:true}); return true; }

/* ---------- blackjack ---------- */
function deal(){
  const ps = G.players.filter(p => p.inRound);
  G.phase = 'playing'; G.dealer = {hand:[], hidden:true}; G.dealerBJ = false;
  for(const p of ps){
    p.hand = []; p.status = 'playing'; p.main = p.bets.main || 0;
    if(activeCurse(p) === 'double'){
      const extra = Math.min(p.main, p.chips);
      if(extra > 0){ p.chips -= extra; p.main += extra; p.bet += extra; p.bets.main = p.main; note(`DOUBLE TROUBLE! ${p.name}'s bet got doubled to ${fmt(p.main)}.`, {bad:true}); }
    }
  }
  for(let i=0;i<2;i++){ for(const p of ps) p.hand.push(draw()); G.dealer.hand.push(draw()); }
  for(const p of ps){
    p.side = {};
    const up = G.dealer.hand[0];
    for(const k of ['pp','p21']){
      const amt = p.bets[k] || 0; if(!amt) continue;
      const r = k === 'pp' ? ppResult(p.hand[0], p.hand[1]) : p21Result([p.hand[0], p.hand[1], up]);
      if(r){ const win = amt*r.mult; p.chips += amt + win; p.side[k] = {amt, name:r.name, mult:r.mult, net:win}; note(`${p.name} wins ${BJ_BETS[k]}: ${r.name}! +${fmt(win)}`, {delay:1900, good:true}); }
      else p.side[k] = {amt, name:null, mult:0, net:-amt};
    }
  }
  for(const p of ps) if(pNatural(p)){ p.status = 'blackjack'; note(`${p.name} has BLACKJACK!`, {delay:1900}); }

  const up = G.dealer.hand[0].r;

    say(up === 'A' ? 'Ace showing. Let me check for blackjack...' : 'Ten showing. Let me check for blackjack...');

function endPeek(){

}
function nextTurn(extra = 0){
  const order = G.turnOrder;
  let i = G.turn ? order.indexOf(G.turn) + 1 : 0;
  for(; i < order.length; i++){
    const p = P(order[i]); if(!p) continue;
    if(p.status === 'playing'){
      if(p.connected){ G.turn = p.id; G.turnTotal = turnTime(p) + extra; G.turnEnds = Date.now() + G.turnTotal; return; }
      p.status = 'stand';
    }
  }
  G.turn = null;
  dealerPlay();
}
function playerAct(p, a){
  if(G.phase !== 'playing' || G.turn !== p.id || p.status !== 'playing') return false;
  const lim = limitOf(p);
  if(a === 'hit'){
    p.hand.push(draw()); p.hits++;
    const v = pv(p);
    if(v > lim){ p.status = 'bust'; note(`${p.name} BUSTS with ${v}!`, {bad:true}); nextTurn(); }
    else if(v === lim){ p.status = 'stand'; if(v === TGT() && TGT() === 33) note(`${p.name} hit exactly 33!`); nextTurn(); }
    else { G.turnTotal = turnTime(p); G.turnEnds = Date.now() + G.turnTotal; }
    return true;
  }
  if(a === 'stand'){
    if(activeCurse(p) === 'nochicken' && p.hits === 0){ addEvent({type:'toast', to:p.id, text:'NO CHICKENS! You have to hit at least once first.', bad:true}); return true; }
    p.status = 'stand'; nextTurn(); return true;
  }
  if(a === 'double'){
    if(p.hand.length !== 2 || p.hits > 0 || p.chips < p.main) return false;
    p.chips -= p.main; p.bet += p.main; p.main *= 2; p.bets.main = p.main; p.hits++; p.doubled = true;

    else { p.status = 'stand'; note(`${p.name} doubled down: ${v}.`); }

}
function dealerPlay(){
  G.phase = 'dealer'; G.dealer.hidden = false; G.turn = null;

  const anyBJ = G.players.some(p => p.inRound && p.status === 'blackjack');
  say(live ? "Let's see what I've got..." : anyBJ ? 'Nothing left to play for. Let me flip my card.' : "Everybody busted? I didn't even have to try.");
  const g = G;
  const step = () => {
    if(G !== g || G.phase !== 'dealer') return;
    const v = handValue(G.dealer.hand, TGT()).total;
    if(live && v < DSTAND()){ G.dealer.hand.push(draw()); broadcast(); setTimeout(step, 850); }
    else setTimeout(() => { if(G === g && G.phase === 'dealer'){ finishBlackjack(); broadcast(); } }, 650);
  };
  setTimeout(step, 900);

function finishBlackjack(){
  const T = TGT(), d = handValue(G.dealer.hand, T).total, dBust = d > T, dBJ = isNatural(G.dealer.hand);

  for(const p of G.players.filter(p => p.inRound)){
    const v = pv(p);
    p.finalTotal = v; p.finalLimit = limitOf(p);
    let res;
    if(p.status === 'blackjack') res = dBJ ? 'push' : 'bj';
    else if(dBJ) res = 'lose';
    else if(p.status === 'bust') res = 'lose';
    else if(dBust || v > d) res = (T === 33 && v === 33) ? 'win33' : 'win';
    else if(v < d) res = 'lose';
    else res = 'push';
    const m = p.main;
    let delta;
    if(res === 'win'){ p.chips += m*2; delta = m; }
    else if(res === 'win33'){ p.chips += m*3; delta = m*2; }
    else if(res === 'bj'){ const w = Math.floor(m*1.5); p.chips += m + w; delta = w; }
    else if(res === 'push'){ p.chips += m; delta = 0; }
    else delta = -m;
    const sideNet = p.side ? Object.values(p.side).reduce((a,x) => a + x.net, 0) : 0;
    p.result = res; p.mainDelta = delta; p.delta = delta + sideNet;
  }
  settle();
}

/* ---------- roulette ---------- */
function rlSpin(){
  G.phase = 'spinning';
  G.rl.result = rnd(37); G.rl.spinId++;
  G.phaseTotal = SPIN_TIME; G.phaseEnds = Date.now() + SPIN_TIME;
  say('No more bets!');
  G.rl.by = G.shotBy || null; G.shotBy = null;
}
function rlFinish(){
  const n = G.rl.result;
  G.rl.history.unshift(n); G.rl.history = G.rl.history.slice(0, 16);
  say(n === 0 ? 'Zero! Green zero.' : `${n} ${rlColor(n)}.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)) if(rlCovers(k, n)) ret += amt*(rlPays(k) + 1);
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }

/* ---------- baccarat ---------- */
function bacDeal(){
  G.phase = 'dealing';
  const p1 = draw(), b1 = draw(), p2 = draw(), b2 = draw();
  const PH = [p1, p2], BH = [b1, b2], seq = [['P',p1],['B',b1],['P',p2],['B',b2]];
  const pt = bacTotal(PH), bt = bacTotal(BH);
  if(pt < 8 && bt < 8){
    let p3 = null;
    if(pt <= 5){ p3 = draw(); PH.push(p3); seq.push(['P',p3]); }
    let bDraw;
    if(p3 === null) bDraw = bt <= 5;
    else { const v = bacVal(p3); bDraw = bt <= 2 || (bt === 3 && v !== 8) || (bt === 4 && v >= 2 && v <= 7) || (bt === 5 && v >= 4 && v <= 7) || (bt === 6 && (v === 6 || v === 7)); }
    if(bDraw){ const b3 = draw(); BH.push(b3); seq.push(['B',b3]); }
  }
  Object.assign(G.bac, {seq, shown:0, nextAt:Date.now() + 700, winner:null});
  G.phaseTotal = 1; G.phaseEnds = 0;

}
function bacStep(now){
  const b = G.bac;
  if(b.shown < b.seq.length){
    b.shown++;
    b.nextAt = now + (b.shown >= 4 ? BAC_STEP + 500 : BAC_STEP);
    if(b.shown === 4){
      const pt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'P').map(x => x[1])), bt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'B').map(x => x[1]));
      if(pt >= 8 || bt >= 8) say(`Natural ${Math.max(pt, bt)}!`);
      else if(b.seq.length > 4) say(b.seq[4][0] === 'P' ? 'Player draws.' : 'Banker draws.');
    } else if(b.shown === 5 && b.seq.length === 6) say('Banker draws.');
    return true;
  }
  bacFinish(); return true;
}
function bacFinish(){
  const b = G.bac;
  const PH = b.seq.filter(x => x[0] === 'P').map(x => x[1]), BH = b.seq.filter(x => x[0] === 'B').map(x => x[1]);
  const pt = bacTotal(PH), bt = bacTotal(BH);
  const w = pt > bt ? 'P' : bt > pt ? 'B' : 'T';
  const pPair = PH[0].r === PH[1].r, bPair = BH[0].r === BH[1].r;
  Object.assign(b, {winner:w, pt, bt, pPair, bPair});
  b.history.push(w); if(b.history.length > 60) b.history.shift();
  say(w === 'P' ? `Player wins, ${pt} over ${bt}.` : w === 'B' ? `Banker wins, ${bt} over ${pt}.` : `It's a tie, ${pt} all.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)){
      if(k === 'P') ret += w === 'P' ? amt*2 : w === 'T' ? amt : 0;
      else if(k === 'B') ret += w === 'B' ? amt + Math.floor(amt*0.95) : w === 'T' ? amt : 0;
      else if(k === 'T') ret += w === 'T' ? amt*9 : 0;
      else if(k === 'PP') ret += pPair ? amt*12 : 0;
      else if(k === 'BP') ret += bPair ? amt*12 : 0;
    }
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }
  settle();
}

/* ---------- results + Wheel of Doom (all games) ---------- */
function settle(extra = 0){
  const losers = [];
  for(const p of G.players.filter(p => p.inRound)){
    if(p.curse && p.curse.round <= G.round) p.curse = null;   // curse served
    if(p.result === 'win' || p.result === 'bj' || p.result === 'win33' || (p.result !== 'lose' && p.delta > 0)){
      p.wins++;
      if(p.renamed){ note(`${p.baseName} won their real name back!`); p.name = p.baseName; p.renamed = false; }
    }
    if(p.result === 'lose'){ p.losses++; losers.push(p); }
  }
  if(G.settings.doom) for(const p of losers) applyCurse(p);
  G.phase = 'results';
  G.phaseTotal = RESULT_TIME + extra + (G.settings.doom && losers.length ? CURSE_TIME : 0);
  G.phaseEnds = Date.now() + G.phaseTotal;

function weightedPick(ids){
  const tot = ids.reduce((a,id) => a + CURSES[id].w, 0);
  let r = Math.random() * tot;
  for(const id of ids){ r -= CURSES[id].w; if(r <= 0) return id; }
  return ids[ids.length-1];
}
function applyCurse(p){
  const before = p.name;
  const id = weightedPick(Object.keys(CURSES).filter(k => k !== p.lastCurse && (GAME() === 'blackjack' || !CURSES[k].bj)));
  p.lastCurse = id;
  const c = CURSES[id], ev = {type:'curse', pid:p.id, pname:before, curse:id};
  switch(id){
    case 'tax': { const take = Math.min(p.chips, Math.max(5, Math.ceil(p.chips*0.15))); p.chips -= take; ev.amount = take; break; }
    case 'robin': {
      const amt = Math.ceil(p.chips*0.10);
      const others = G.players.filter(o => o.id !== p.id && !o.left);
      p.chips -= amt; ev.amount = amt;
      if(others.length){ const poor = others.reduce((a,b) => b.chips < a.chips ? b : a); poor.chips += amt; ev.toName = poor.name; }
      else ev.toName = "Myla's tip jar";

    }
    case 'roast': ev.line = pick(ROASTS); say(`${before}: ${ev.line}`); break;
    case 'rename': { const nn = pick(NAMES.filter(n => n !== p.name)); p.name = nn; p.renamed = true; ev.newName = nn; break; }
    case 'pity': p.chips += 50; break;

}

function beg(p){

  p.chips += BEG_AMOUNT; p.begs++;
  note(`${p.name} begged Myla for chips${p.begs > 1 ? ` (${p.begs} times now)` : ''}.`);
  say(pick(LINES.beg).replace('{n}', p.name));

}
function markAway(p){
  if(!p.connected) return;
  p.connected = false;

}
function removePlayer(p){
  if(p.id === G.hostId) return;

  if(c) setTimeout(() => { try{ c.close(); }catch(e){} }, 300);

function tick(){
  if(!G) return;
  const now = Date.now(); let ch = false;
  const hp = P(G.hostId); if(hp) hp.lastSeen = now;
  for(const p of G.players){
    if(p.id !== G.hostId && p.connected && now - p.lastSeen > 15000){ markAway(p); ch = true; }
  }
  switch(G.phase){
    case 'betting':
      if(allBetsIn() && G.phaseEnds - now > 1000){ G.phaseEnds = now + 1000; ch = true; }
      if(now >= G.phaseEnds){ closeBetting(); ch = true; }
      break;
    case 'peek':
      if(now >= G.phaseEnds){ endPeek(); ch = true; }
      break;
    case 'playing':
      if(G.turn && now >= G.turnEnds){
        const p = P(G.turn);
        if(p && p.status === 'playing'){ p.status = 'stand'; note(`${p.name} ran out of time and stands.`); }
        nextTurn(); ch = true;

    case 'spinning':
      if(now >= G.phaseEnds){ rlFinish(); ch = true; }
      break;
    case 'shooter':
      if(now >= G.turnEnds || !P(G.turn) || !P(G.turn).connected){ shooterGo(true); ch = true; }
      break;
    case 'dealing':

      break;
    case 'shotgun': if(bsTick(now)) ch = true; break;
    case 'imp': if(impTick(now)) ch = true; break;
    case 'results':

// What each player is allowed to see (no peeking at the dealer's hole card!)

      winner:G.phase === 'results' ? G.bac.winner : null, pPair:G.phase === 'results' && G.bac.pPair, bPair:G.phase === 'results' && G.bac.bPair,

}
function broadcast(){
  if(!G) return;

function bsStart(){

function curseDetail(e, long){
  switch(e.curse){
    case 'tax':    return long ? `<br><b>-${fmt(e.amount)} chips</b>` : ` (-${fmt(e.amount)} chips)`;
    case 'robin':  return long ? `<br><b>${fmt(e.amount)} chips</b> went to <b>${esc(e.toName)}</b>.` : ` (${fmt(e.amount)} chips to ${esc(e.toName)})`;
    case 'rename': return long ? `<br>You are now <b>"${esc(e.newName)}"</b>.` : `: now called "${esc(e.newName)}"`;
    case 'roast':  return long ? `<br><i>"${esc(e.line)}"</i>` : `: "${esc(e.line)}"`;
    case 'pity':   return long ? `<br><b>+50 chips</b>` : ' (+50 chips)';
  }
  return '';
}
function runFx(e){
  if(e.curse === 'quake') quake();
  else if(e.curse === 'lrain') rainL();
  else if(e.curse === 'roast') speak(e.line);
}
function showDoom(e){
  const c = CURSES[e.curse]; if(!c) return;
  const names = shuffle(Object.values(CURSES).map(x => x.name));
  openModal(`<div class="doom"><div class="k">YOU LOST</div><h2>WHEEL OF DOOM</h2><div class="reel" id="reel">???</div><div class="desc" id="doomDesc">Spinning...</div><button class="btn stand" id="doomOk" style="visibility:hidden">I accept my fate</button></div>`, 'doom');
  let i = 0, delay = 40;
  const step = () => {
    const r = $('#reel'); if(!r) return;
    if(i < 20){ r.textContent = names[i % names.length]; sfx('tick'); i++; delay *= 1.1; setTimeout(step, delay); return; }
    r.textContent = c.name; r.classList.add('landed');
    $('#doomDesc').innerHTML = esc(c.desc) + curseDetail(e, true);
    const ok = $('#doomOk'); ok.style.visibility = 'visible'; ok.onclick = closeModal;
    sfx('doom'); buzz([80,40,160]); runFx(e);
    doomTimer = setTimeout(() => { if(modalKind === 'doom') closeModal(); }, 5500);
  };
  step();
}

  if(e.type === 'curse'){

    if(e.pid === MY_ID) setTimeout(() => showDoom(e), 1500);

function transitions(prev, s){
  if(!prev || prev.settings.game !== s.settings.game) return;
  const me = s.players.find(p => p.id === MY_ID), pm = prev.players.find(p => p.id === MY_ID);
  const nNew = cardCount(s) - cardCount(prev);
  for(let i=0;i<Math.min(nNew,12);i++) setTimeout(() => sfx('card'), i*170);
  if(s.phase === 'playing' && s.turn === MY_ID && prev.turn !== MY_ID) setTimeout(() => { sfx('turn'); buzz(60); }, nNew > 3 ? 1200 : 150);
  if(s.phase === 'shooter' && s.turn === MY_ID && (prev.phase !== 'shooter' || prev.turn !== MY_ID)){ sfx('turn'); buzz(80); }
  if(me && pm && me.status === 'bust' && pm.status !== 'bust') sfx('bust');
  if(me && pm && me.status === 'blackjack' && pm.status !== 'blackjack') setTimeout(() => { banner('BLACKJACK!'); sfx('big'); confetti(90); }, 900);
  if(s.dealer.bj && !prev.dealer.bj) sfx('bust');
  if(me && pm && me.side && !pm.side){   // side bet paid when the cards came out
    const w = Object.values(me.side).filter(x => x.net > 0).sort((a,b) => b.net - a.net)[0];
    if(w) setTimeout(() => { banner(w.name.toUpperCase() + '!', true); sfx(w.mult >= 25 ? 'big' : 'win'); confetti(w.mult >= 25 ? 120 : 60); }, me.status === 'blackjack' ? 3000 : 1900);
  }
  if(s.phase === 'results' && prev.phase !== 'results' && me && me.inRound){
    if(me.result === 'win33'){ banner('THIRTY-THREE!'); sfx('big'); confetti(150); }

function seeded(seed){ let s = seed >>> 0; return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }
function landDelay(cards){
  const now = performance.now(); let d = 0;
  for(const c of cards){ const m = cardMeta.get(c.id); if(m){ const r = (m.d - (now - m.t0)/1000)*1000 + 420; if(r > d) d = r; } }
  return d > 0 ? ` style="animation-delay:${Math.round(d)}ms"` : '';
}
// fade-in a badge only until the cards it describes have landed (so re-renders don't replay it)
function late(cards){
  const now = performance.now(); let d = 0;
  for(const c of cards){ const m = cardMeta.get(c.id); if(m){ const r = (m.d - (now - m.t0)/1000)*1000 + 420; if(r > d) d = r; } }
  return d > 0 ? {c:' late', s:` style="animation-delay:${Math.round(d)}ms"`, ms:d} : {c:'', s:'', ms:0};
}
const handHTML = (cards, mini, sideIdx = -1) => `<div class="hand${cards.length >= 6 ? ' n6' : cards.length >= 4 ? ' n4' : ''}">${cards.map((c,i) => cardHTML(c, mini, i === sideIdx)).join('')}</div>`;
function prepareCardMeta(){
  const ids = [];
  S.dealer.hand.forEach(c => ids.push(c.id));
  S.players.forEach(p => p.hand.forEach(c => ids.push(c.id)));
  if(S.bac){ S.bac.player.forEach(c => ids.push(c.id)); S.bac.banker.forEach(c => ids.push(c.id)); }
  const fresh = ids.filter(id => !cardMeta.has(id));
  animBase = fresh.length ? Math.min(...fresh) : 0;
}
function runAnims(){
  const shoe = $('#shoe'), sr = shoe ? shoe.getBoundingClientRect() : null;
  document.querySelectorAll('#stage .card[data-deal]').forEach(el => {
    const d = +el.dataset.deal, r = el.getBoundingClientRect();
    const dx = sr ? (sr.left + sr.width/2) - (r.left + r.width/2) : 0, dy = sr ? (sr.top + sr.height/2) - (r.top + r.height/2) : -200;
    const end = el.classList.contains('side') ? 'rotate(90deg)' : 'none';
    try{ el.animate([{transform:`translate(${dx}px,${dy}px) rotate(-70deg) scale(.6)`, opacity:0},{opacity:1, offset:.1},{transform:end, opacity:1}], {duration:450, delay:d, easing:'cubic-bezier(.2,.7,.2,1)', fill:'backwards'}); }catch(e){}
  });
  document.querySelectorAll('#stage .card[data-flip]').forEach(el => {
    try{ el.animate([{transform:'rotateY(90deg)'},{transform:'rotateY(0deg)'}], {duration:450, delay:+el.dataset.flip, easing:'ease-out', fill:'backwards'}); }catch(e){}
  });
}

/* ---------- chips ---------- */
const CHIP_VALS = [10,25,100,500,1000];
const CHIPC = {1000:'#d26e12', 500:'#6c34cf', 100:'#232328', 25:'#1c8c4c', 10:'#1f5fc4'};
const chipColor = t => t >= 1000 ? CHIPC[1000] : t >= 500 ? CHIPC[500] : t >= 100 ? CHIPC[100] : t >= 25 ? CHIPC[25] : CHIPC[10];
const short = t => t >= 1000 ? (t/1000).toFixed(t % 1000 >= 100 ? 1 : 0) + 'K' : String(t);
function chipStack(amount, below){
  const list = []; let left = amount;
  for(const d of [1000,500,100,25,10]) while(left >= d && list.length < 7){ list.push(d); left -= d; }
  if(!list.length) list.push(10);
  return `<div class="stk">${list.map((d,i) => `<i class="sc" style="--c:${CHIPC[d]};--i:${i};--dx:${[0,1,-1,.5,-1.5,1,-.5][i]}px"></i>`).join('')}</div><span class="amt${below ? ' b' : ''}">${fmt(amount)}</span>`;
}
function betTotals(){
  const tot = {}, mine = {};
  for(const p of S.players) for(const [k,a] of Object.entries(p.bets || {})){ tot[k] = (tot[k] || 0) + a; if(p.id === MY_ID) mine[k] = (mine[k] || 0) + a; }
  return {tot, mine};
}
const isWide = () => (document.documentElement.clientWidth || innerWidth) >= 720;
function gameLabel(st){
  if(st.game === 'blackjack') return `<span class="long">BLACKJACK </span><span class="short">BJ </span>${st.target}`;
  return st.game.toUpperCase();
}
function waitingNames(){
  const w = S.players.filter(p => p.connected && !p.ready && (p.chips >= MIN_BET || p.bet > 0) && p.id !== MY_ID).map(p => esc(p.name));
  return w.length ? w.join(', ') : 'the deal';
}

function chandelierSVG(x, s, seed){
  // brass frame, five candle bulbs with bloom, strands of cut crystal that catch the light
  const r = seeded(seed || 3);
  const arms = [-46,-23,0,23,46].map(dx => `<path d="M0 14 C${dx*.4} 22 ${dx*.9} 22 ${dx} 8" stroke="url(#brassV)" stroke-width="2.6" fill="none"/><rect x="${dx - 3.2}" y="4" width="6.4" height="5" rx="1" fill="url(#brassV)"/><rect x="${dx - 1.7}" y="-6" width="3.4" height="10" rx="1" fill="#fbf4e2"/><ellipse cx="${dx}" cy="-9" rx="2.6" ry="3.6" fill="#fffef6"/>`).join('');
  let strands = '';
  for(let i=0;i<11;i++){
    const t = i/10, sx = -44 + t*88, len = 3 + Math.round((1 - Math.abs(t - .5)*1.6)*4), sag = 22 + Math.sin(t*Math.PI)*10;
    for(let k=0;k<len;k++){
      const y = sag + k*6.2, big = k === len - 1;
      strands += big ? `<path d="M${sx.toFixed(1)} ${y - 1} l2.8 5 l-2.8 6.5 l-2.8 -6.5 Z" fill="url(#crysV)" stroke="#fff" stroke-opacity=".7" stroke-width=".4"/>` : `<circle cx="${sx.toFixed(1)}" cy="${y}" r="1.9" fill="url(#crysV)"/>`;
      if(r() < .25) strands += `<circle cx="${(sx + .6).toFixed(1)}" cy="${(y - .6).toFixed(1)}" r=".7" fill="#fff"/>`;
    }
  }
  return `<g transform="translate(${x.toFixed(1)} 0) scale(${s})">
    <circle cx="0" cy="42" r="96" fill="url(#chGlow)"/>
    <line x1="0" y1="0" x2="0" y2="22" stroke="url(#brassH)" stroke-width="2.4"/>
    <g transform="translate(0 22)">
      <path d="M-50 10 Q0 36 50 10" stroke="url(#brassV)" stroke-width="3.4" fill="none"/>
      <path d="M-30 16 Q0 30 30 16" stroke="url(#brassV)" stroke-width="2" fill="none" opacity=".8"/>
      ${arms}${strands}
      <ellipse cx="0" cy="16" rx="7" ry="9" fill="url(#brassV)"/><circle cx="-2" cy="12" r="2" fill="#fff8dc" opacity=".8"/>
      <path d="M0 64 l4.5 8 l-4.5 13 l-4.5 -13 Z" fill="url(#crysV)" stroke="#fff" stroke-opacity=".8" stroke-width=".5"/>
    </g>
  </g>`;
}

function chandelierFlames(x, s){
  return [-46,-23,0,23,46].map(dx => `<i class="flame" style="left:${(x + dx*s).toFixed(1)}px;top:${(22 - 9*s).toFixed(1)}px;--fr:${(13*s).toFixed(1)}px;animation-delay:${(-Math.abs(dx)/37).toFixed(2)}s"></i>`).join('');
}

let wAngle = 0, bAngle = 0, lastSpinId = null, wAnim = null, bAnim = null, dAnim = null, spinP = null;
function spinSound(dur){
  let t = 0, iv = 55;
  while(t < dur*0.88){ setTimeout(() => sfx('ball'), t); iv *= 1.035; t += iv; }
}
function syncWheel(){
  const wr = $('#wheelRot'), br = $('#ballRot'), ball = $('#ball');
  if(!wr || !S.rl) return;
  const rl = S.rl;
  if(S.phase === 'spinning' && rl.result != null && rl.spinId !== lastSpinId){ lastSpinId = rl.spinId; startSpin(rl, wr, br, ball); return; }
  if(!wAnim){
    wr.style.transform = `rotate(${wAngle}deg)`; br.style.transform = `rotate(${bAngle}deg)`;
    ball.style.transform = rl.history.length ? 'translateY(21px)' : '';
  }
}
function startSpin(rl, wr, br, ball){
  const dur = SPIN_TIME - 900;
  if(!spinP || spinP.id !== rl.spinId){
    const pa = RL_ORDER.indexOf(rl.result)*360/37;
    const sw = wAngle, ew = sw + 1120 + rnd(280);
    const target = ((pa + ew) % 360 + 360) % 360;
    const sb = bAngle; let eb = sb - 1620; eb -= (((eb - target) % 360) + 360) % 360;
    const elapsed = Math.max(0, (S.phaseTotal || SPIN_TIME) - S.phaseLeft);
    spinP = {id:rl.spinId, sw, ew, sb, eb, t0:performance.now() - elapsed};
    wAngle = ew % 360; bAngle = ((eb % 360) + 360) % 360;
    if(elapsed < 1500) spinSound(dur - elapsed);
  }
  [wAnim, bAnim, dAnim].forEach(a => { try{ a && a.cancel(); }catch(e){} });
  ball.style.transform = '';
  const ease = 'cubic-bezier(.1,.62,.16,1)';
  try{
    wAnim = wr.animate([{transform:`rotate(${spinP.sw}deg)`},{transform:`rotate(${spinP.ew}deg)`}], {duration:dur, easing:ease, fill:'forwards'});
    bAnim = br.animate([{transform:`rotate(${spinP.sb}deg)`},{transform:`rotate(${spinP.eb}deg)`}], {duration:dur, easing:ease, fill:'forwards'});
    dAnim = ball.animate([{transform:'translateY(0)'},{transform:'translateY(9px)', offset:.55},{transform:'translateY(5px)', offset:.7},{transform:'translateY(21px)'}], {duration:dur*.3, delay:dur*.58, easing:'ease-in', fill:'both'});
    const t = Math.min(performance.now() - spinP.t0, dur);
    wAnim.currentTime = t; bAnim.currentTime = t; dAnim.currentTime = t;
  }catch(e){
    wr.style.transform = `rotate(${wAngle}deg)`; br.style.transform = `rotate(${bAngle}deg)`; ball.style.transform = 'translateY(21px)';
  }
}

function bjControls(me){
  const sitOut = `<div class="msg">You're sitting this hand out. You're in next hand.</div>`;
  switch(S.phase){
    case 'betting': {
      if(me.ready) return `<div class="msg">You're in for <b>${fmt(me.bet)}</b>. Waiting for ${waitingNames()}...</div>${timerBar('phase')}`;
      if(me.chips < MIN_BET && !me.bet) return begHTML();
      return bettingHTML(me);
    }
    case 'peek': {
      if(!me.inRound) return sitOut;
      const L = late(me.hand);
      return (me.status === 'blackjack' ? `<div class="result bj${L.c}"${L.s}>BLACKJACK!</div>` : '') + `<div class="msg">Myla is checking for blackjack...</div>`;
    }
    case 'playing': {
      if(!me.inRound) return sitOut;
      const L = late(me.hand);
      if(me.status === 'blackjack') return `<div class="result bj${L.c}"${L.s}>BLACKJACK!</div><div class="msg">Waiting for the others...</div>`;
      if(S.turn === MY_ID && me.status === 'playing'){
        const canDbl = me.hand.length === 2 && me.hits === 0 && me.chips >= me.main;
        const chicken = me.curse === 'nochicken' && me.hits === 0;
        return `${chicken ? '<div class="note">NO CHICKENS: you have to hit before you can stand.</div>' : ''}
          ${me.curse === 'blind' ? '<div class="note">BLINDFOLDED: ask your friends what you have...</div>' : ''}
          <div class="acts" id="actRow">${rbtn('double', 'dbl', '<b>2&times;</b>', 'DOUBLE', !canDbl)}${rbtn('hit', 'hit', IC.plus, 'HIT', false)}${rbtn('stand', 'stand', IC.minus, 'STAND', false)}</div>
          <div class="msg">You have <b>${me.total ?? '?'}</b>. Your move.</div>
          ${timerBar('turn')}`;
      }
      if(me.status === 'bust') return `<div class="msg">Busted. Myla thanks you for your donation.</div>`;
      if(me.status === 'stand') return `<div class="msg">You stand on <b>${me.total ?? '?'}</b>. Waiting for <b>${turnName()}</b>...</div>`;
      return `<div class="msg">Waiting for <b>${turnName()}</b>...</div>`;
    }
    case 'dealer': return me.inRound ? `<div class="msg">Myla is playing her hand...</div>` : sitOut;
    case 'results': {
      if(!me.inRound) return `<div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
      const md = me.mainDelta ?? me.delta;
      let txt, cls = me.result;
      if(me.result === 'bj') txt = `BLACKJACK! +${fmt(md)}`;
      else if(me.result === 'win33') txt = `THIRTY-THREE! +${fmt(md)}`;
      else if(me.result === 'win') txt = `YOU WIN +${fmt(md)}`;
      else if(me.result === 'push') txt = 'PUSH &middot; BET BACK';
      else txt = `${me.status === 'bust' ? 'BUSTED' : S.dealer.bj ? 'DEALER BLACKJACK' : 'YOU LOST'} -${fmt(-md)}`;
      const net = me.side && Object.keys(me.side).length ? `<div class="msg">Total this hand: <b class="${me.delta > 0 ? 'g' : me.delta < 0 ? 'r' : ''}">${me.delta > 0 ? '+' : me.delta < 0 ? '-' : ''}${fmt(Math.abs(me.delta))}</b></div>` : '';
      return `<div class="result ${cls}">${txt}</div>${sideSummary(me)}${net}<div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
    }
  }
  return '';
}

/* =====================================================================
   RELAY NETWORK
   Game messages travel through public MQTT relay servers over secure
   WebSockets, so friends on any network (home Wi-Fi, school, 4G/5G,
   other countries) can reach each other. Three relays are used at once:
   every message goes to all of them and duplicates are dropped, so the
   table keeps working if one relay is slow or down.
   Messages are compressed and encrypted with a key made from the table
   code, so other people on the public relays can't read or fake them.
   ===================================================================== */
// The last one runs on the normal web port (443), for school/work Wi-Fi that blocks the others.
const RELAY_443 = {url:'wss://public.cloud.shiftr.io', user:'public', pass:'public'};
const RELAYS = Array.isArray(window.WC_RELAYS) ? window.WC_RELAYS : /[?&]relay=443\b/.test(location.search) ? [RELAY_443] : [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
  RELAY_443,

const RELAY_NS = 'whyloscasino/v1/';
const TE = new TextEncoder(), TD = new TextDecoder();

/* Repeating timers that keep running when the tab is in the background.
   Browsers slow normal timers in hidden tabs to once a minute after a while,
   which would freeze the table for everyone if the host switches apps.
   Timers inside a Web Worker aren't slowed, so the worker does the ticking. */
const bgTimers = new Map(); let bgWorker = null, bgSeq = 0;
function bgEvery(fn, ms){
  const id = ++bgSeq;
  try{
    if(!bgWorker){
      const src = 'const t={};onmessage=e=>{const d=e.data;if(d.on)t[d.id]=setInterval(()=>postMessage(d.id),d.ms);else{clearInterval(t[d.id]);delete t[d.id];}};';
      bgWorker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
      bgWorker.onmessage = e => { const f = bgTimers.get(e.data); if(f) try{ f(); }catch(err){ console.warn(err); } };
    }
    bgTimers.set(id, fn); bgWorker.postMessage({on:true, id, ms});
  }catch(e){ bgTimers.set(id, setInterval(fn, ms)); }
  return id;
}
function bgClear(id){
  if(!id) return;
  const f = bgTimers.get(id); bgTimers.delete(id);
  if(typeof f === 'number') clearInterval(f);
  else if(bgWorker) bgWorker.postMessage({on:false, id});
}

function mqttLen(n){ const out = []; do{ let b = n % 128; n = Math.floor(n / 128); if(n > 0) b |= 128; out.push(b); }while(n > 0); return out; }
function mqttStr(s){ const b = TE.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
function mqttPacket(head, body){
  const len = mqttLen(body.length), out = new Uint8Array(1 + len.length + body.length);
  out[0] = head; out.set(len, 1); out.set(body, 1 + len.length); return out;
}

/* One connection to one relay server, with automatic reconnect. */
class MqttLink {
  constructor(relay, onMsg, onChange){
    const r = typeof relay === 'string' ? {url:relay} : relay;
    this.url = r.url; this.user = r.user || ''; this.pass = r.pass || ''; this.onMsg = onMsg; this.onChange = onChange;
    this.subs = new Set(); this.ws = null; this.ready = false; this.closed = false;
    this.buf = new Uint8Array(0); this.pid = 1; this.backoff = 800; this.lastIn = 0;
    this.cid = 'wc' + Math.random().toString(36).slice(2, 12);
    this.open();

  }
  open(){
    if(this.closed) return;
    let ws;
    try{ ws = new WebSocket(this.url, 'mqtt'); }catch(e){ return this.retry(); }
    ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
    const giveUp = setTimeout(() => { if(this.ws === ws && !this.ready){ try{ ws.close(); }catch(e){} } }, 9000);
    ws.onopen = () => {
      if(this.ws !== ws) return;
      // CONNECT: MQTT 3.1.1, clean session, keep-alive 45s (+ username/password if the relay wants one)
      const fl = 2 | (this.user ? 128 : 0) | (this.pass ? 64 : 0);
      this.raw(mqttPacket(0x10, [...mqttStr('MQTT'), 4, fl, 0, 45, ...mqttStr(this.cid), ...(this.user ? mqttStr(this.user) : []), ...(this.pass ? mqttStr(this.pass) : [])]));
    };
    ws.onmessage = e => { if(this.ws === ws){ this.lastIn = Date.now(); this.feed(new Uint8Array(e.data)); } };
    ws.onclose = () => { clearTimeout(giveUp); if(this.ws !== ws) return; this.ws = null; this.setReady(false); this.retry(); };
    ws.onerror = () => {};
  }
  retry(){
    if(this.closed) return;
    clearTimeout(this.rt);

    this.backoff = Math.min(this.backoff * 2, 8000);
  }
  setReady(v){ if(this.ready !== v){ this.ready = v; this.onChange && this.onChange(); } }
  raw(bytes){ const ws = this.ws; if(ws && ws.readyState === 1){ try{ ws.send(bytes); return true; }catch(e){} } return false; }
  feed(chunk){
    let b = this.buf.length ? (() => { const x = new Uint8Array(this.buf.length + chunk.length); x.set(this.buf); x.set(chunk, this.buf.length); return x; })() : chunk;
    let i = 0;
    while(true){
      if(b.length - i < 2) break;
      let mult = 1, len = 0, j = i + 1, byte;
      do{ if(j >= b.length){ len = -1; break; } byte = b[j++]; len += (byte & 127) * mult; mult *= 128; }while(byte & 128);
      if(len < 0 || j + len > b.length) break;
      this.packet(b[i], b.subarray(j, j + len));
      i = j + len;
    }
    this.buf = i < b.length ? b.slice(i) : new Uint8Array(0);
  }
  packet(h, body){
    const type = h >> 4;
    if(type === 2){ // CONNACK
      if(body[1] === 0){
        this.backoff = 800; this.setReady(true);
        for(const t of this.subs) this.sendSub(t);

    } else if(type === 3){ // PUBLISH
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = TD.decode(body.subarray(2, 2 + tl));
      const start = 2 + tl + (qos ? 2 : 0);

    }
  }
  sendSub(topic){ const id = this.pid = (this.pid % 65000) + 1; this.raw(mqttPacket(0x82, [id >> 8, id & 255, ...mqttStr(topic), 0])); }
  subscribe(topic){ this.subs.add(topic); if(this.ready) this.sendSub(topic); }
  publish(topic, payload){
    if(!this.ready) return false;
    const t = mqttStr(topic), body = new Uint8Array(t.length + payload.length);
    body.set(t); body.set(payload, t.length);
    return this.raw(mqttPacket(0x30, body));
  }
  keepAlive(){
    if(!this.ws || this.ws.readyState !== 1) return;
    if(this.ready && Date.now() - this.lastIn > 50000){ try{ this.ws.close(); }catch(e){} return; } // dead link
    this.raw(new Uint8Array([0xC0, 0]));
  }
  close(){
    this.closed = true; bgClear(this.timer); clearTimeout(this.rt);
    const ws = this.ws; this.ws = null; this.ready = false;
    if(ws){ try{ if(ws.readyState === 1) ws.send(new Uint8Array([0xE0, 0])); ws.close(); }catch(e){} }
  }
}

/* ---------- table crypto: key and topic names come from the table code ---------- */
async function sha256(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(s))); }
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
async function roomSecrets(code){
  const t = await sha256('whylos-casino-topic:' + code), k = await sha256('whylos-casino-key:' + code);
  return {topic: RELAY_NS + hex(t).slice(0, 24), key: await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt', 'decrypt'])};
}
async function streamBytes(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
const CAN_ZIP = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function sealMsg(key, obj){
  let data = TE.encode(JSON.stringify(obj)), flag = 0;
  if(CAN_ZIP && data.length > 300){ try{ data = await streamBytes(data, new CompressionStream('deflate-raw')); flag = 1; }catch(e){} }
  const plain = new Uint8Array(data.length + 1); plain[0] = flag; plain.set(data, 1);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function openMsg(key, bytes){
  try{
    if(bytes.length < 30) return null;
    const plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes.subarray(0, 12)}, key, bytes.subarray(12)));
    let data = plain.subarray(1);
    if(plain[0] === 1){ if(!CAN_ZIP) return null; data = await streamBytes(data, new DecompressionStream('deflate-raw')); }
    return JSON.parse(TD.decode(data));
  }catch(e){ return null; }
}

/* ---------- a table's relay hub: every link, ordered sends, de-duplication ---------- */
class RelayHub {
  constructor(code, onEnvelope){
    this.code = code; this.onEnvelope = onEnvelope; this.secrets = null;
    this.nonce = Math.random().toString(36).slice(2, 10); this.seq = 0;
    this.seen = new Map(); this.sendQ = Promise.resolve(); this.recvQ = Promise.resolve();
    this.pending = new Map(); this.listeners = new Set(); this.closed = false; this.subs = [];
    this.links = [];
  }
  async start(){
    this.secrets = await roomSecrets(this.code);
    if(this.closed) return;
    this.links = RELAYS.map(u => new MqttLink(u, (t, b) => this.incoming(t, b), () => this.changed()));
    for(const t of this.subs) this.links.forEach(l => l.subscribe(t));
  }
  topic(sub){ return this.secrets.topic + '/' + sub; }
  listen(sub){ const t = this.topic(sub); this.subs.push(t); this.links.forEach(l => l.subscribe(t)); }
  liveCount(){ return this.links.filter(l => l.ready).length; }
  changed(){ for(const f of this.listeners) f(this.liveCount()); }
  onLinks(f){ this.listeners.add(f); }
  waitLive(ms){
    return new Promise(res => {
      if(this.liveCount()) return res(true);
      const f = n => { if(n){ this.listeners.delete(f); clearTimeout(to); res(true); } };
      const to = setTimeout(() => { this.listeners.delete(f); res(false); }, ms);
      this.listeners.add(f);
    });
  }
  /* send(sub, msg, key): with a key, a newer message replaces an older one still waiting (used for full table states) */
  send(sub, msg, key){
    if(this.closed || !this.secrets) return;
    const env = {f:MY_ID, s:this.nonce, m:msg};
    if(key){
      const had = this.pending.has(key);
      this.pending.set(key, env);
      if(had) return;
    }
    this.sendQ = this.sendQ.then(async () => {
      let e = env;
      if(key){ e = this.pending.get(key); this.pending.delete(key); if(!e) return; }
      e.n = ++this.seq;
      const bytes = await sealMsg(this.secrets.key, e);
      const t = this.topic(sub);
      for(const l of this.links) l.publish(t, bytes);
    }).catch(err => console.warn('relay send', err));
  }
  incoming(topic, bytes){
    if(this.closed || !this.secrets) return;
    this.recvQ = this.recvQ.then(async () => {
      const env = await openMsg(this.secrets.key, bytes);
      if(!env || typeof env !== 'object' || !env.f || !env.s || typeof env.n !== 'number' || env.f === MY_ID && env.s === this.nonce) return;
      const k = env.f + '#' + env.s;
      let s = this.seen.get(k);
      if(!s){ s = {set:new Set(), max:0}; this.seen.set(k, s); if(this.seen.size > 200) this.seen.delete(this.seen.keys().next().value); }
      if(s.set.has(env.n) || env.n < s.max - 400) return;
      s.set.add(env.n); if(env.n > s.max) s.max = env.n;
      if(s.set.size > 600){ for(const n of s.set){ if(n < s.max - 400) s.set.delete(n); } }
      env.newest = env.n >= s.max;
      this.onEnvelope(topic.slice(this.secrets.topic.length + 1), env);
    }).catch(err => console.warn('relay recv', err));
  }
  close(){ this.closed = true; this.links.forEach(l => l.close()); this.links = []; this.listeners.clear(); }
}

/* A host-side stand-in for one player's connection (same shape the game engine already uses). */
class RelayConn {
  constructor(hub, clientId){ this.hub = hub; this.peerId = clientId; this.open = true; this.h = {}; }
  on(ev, fn){ this.h[ev] = fn; return this; }
  emit(ev, x){ const f = this.h[ev]; if(f) try{ f(x); }catch(e){ console.warn(e); } }
  send(msg){ if(this.open) this.hub.send('c/' + this.peerId, msg, msg && msg.t === 'state' ? 'st:' + this.peerId : null); }
  close(){ if(!this.open) return; this.open = false; this.emit('close'); }
}
/* =====================================================================
   NETWORK (relay servers; the host's browser runs the game)
   ===================================================================== */
let hub = null, isHost = false, joinCode = null, myName = '', hostSender = null;
let lastHostMsg = 0, pingTimer = null, joinTimer = null, lostShown = false;

function netSupported(){ return !!(window.crypto && crypto.subtle && window.WebSocket && window.TextEncoder); }
const NO_RELAY = "Couldn't reach the online game servers. Check your internet connection and try again.";
function send(msg){
  if(isHost){ if(G) hostHandle(MY_ID, msg); return; }
  if(hub && hub.liveCount()) hub.send('h', msg);
  else if(S && !lostShown && Date.now() - lastHostMsg > 6000) showLost();
}
function setRoomURL(code){ try{ history.replaceState(null, '', location.pathname + (code ? '?room=' + code : '')); }catch(e){} }

/* ---------- hosting ---------- */
async function createTable(){
  const name = readName(); if(!name) return;
  if(!netSupported()) return homeError("This browser can't do online play. Try Chrome, Safari, Edge, or Firefox.");
  setHomeBusy('Opening your table...');
  myName = name;
  const code = Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join('');
  const h = new RelayHub(code, (sub, env) => hostEnvelope(h, sub, env));
  hub = h;
  try{ await h.start(); }catch(e){ if(hub === h){ hub = null; h.close(); homeError(NO_RELAY); } return; }
  h.listen('h');
  const ok = await h.waitLive(12000);
  if(hub !== h) return;
  if(!ok){ hub = null; h.close(); return homeError(NO_RELAY); }
  isHost = true; G = newGame(code);
  setRoomURL(code);
  handleJoin({id:MY_ID, name}, null);
  const sg = store.get('startGame', 'blackjack');
  if(GAMES[sg] && sg !== G.settings.game){ G.settings.game = sg; G.events = []; broadcast(); }
  startHostLoop();
}
function hostEnvelope(h, sub, env){
  if(hub !== h || !G || sub !== 'h') return;
  const msg = env.m; if(!msg || typeof msg !== 'object') return;
  const id = String(env.f).slice(0, 40);
  if(msg.t === 'join'){
    if(String(msg.id) !== id) return;
    const c = new RelayConn(h, id);
    setupHostConn(c);
    handleJoin(msg, c);
    return;
  }
  const c = conns.get(id);
  if(c) c.emit('data', msg);
}
function setupHostConn(conn){
  conn.on('data', msg => {
    if(!G || !msg || typeof msg !== 'object') return;
    if(msg.t === 'join'){ handleJoin(msg, conn); return; }
    if(conn.clientId && conns.get(conn.clientId) === conn) hostHandle(conn.clientId, msg);
  });
  conn.on('close', () => {
    if(!G || !conn.clientId || conns.get(conn.clientId) !== conn) return;
    conns.delete(conn.clientId);
    const p = P(conn.clientId);
    if(p && p.connected){ markAway(p); broadcast(); }
  });
}

/* ---------- joining ---------- */
async function joinTable(code){
  const name = readName(); if(!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 5) return showHomeMsg('Table codes are 5 characters long.');
  if(!netSupported()) return homeError("This browser can't do online play. Try Chrome, Safari, Edge, or Firefox.");
  setHomeBusy(`Finding table ${code}...`);
  joinCode = code; myName = name; isHost = false; hostSender = null;
  startClient();
}
async function startClient(){
  if(hub){ const old = hub; hub = null; old.close(); }
  const h = new RelayHub(joinCode, (sub, env) => clientEnvelope(h, sub, env));
  hub = h;
  try{ await h.start(); }catch(e){ if(hub === h){ if(!S) homeError(NO_RELAY); else showLost(); } return; }
  h.listen('c/' + MY_ID);
  let wasLive = false;
  h.onLinks(n => {               // a relay came back after a drop: say hello again
    if(hub !== h) return;
    if(n && !wasLive && S) sendJoin();
    wasLive = n > 0;
  });
  const ok = await h.waitLive(12000);
  if(hub !== h) return;
  if(!ok){ if(!S) homeError(NO_RELAY); else if(!lostShown) showLost(); return; }
  wasLive = true;
  sendJoin();
  startPing();
}
function sendJoin(){
  if(!hub) return;
  hub.send('h', {t:'join', id:MY_ID, name:myName});
  clearTimeout(joinTimer);
  joinTimer = setTimeout(() => {
    if(!S) homeError(`Couldn't find table ${joinCode}. Check the code, and make sure the host still has the game open.`);
    else if(!lostShown && Date.now() - lastHostMsg > 9000) showLost();
  }, 12000);
}
function clientEnvelope(h, sub, env){
  if(hub !== h) return;
  const msg = env.m; if(!msg || typeof msg !== 'object') return;
  if(msg.t === 'state'){
    if(hostSender && env.f !== hostSender) return;
    if(!env.newest) return;
    if(!msg.s || msg.s.hostId !== env.f) return;
    hostSender = env.f;
    lastHostMsg = Date.now();
    clearTimeout(joinTimer); if(lostShown) hideLost(); onState(msg.s);
  }
  else if(hostSender && env.f !== hostSender) return;
  else if(msg.t === 'reject'){ homeError(msg.reason || 'The host turned you away.'); }
  else if(msg.t === 'closed'){ leaveLocal(); renderHome('The host closed the table. Thanks for playing!', true); }
}
function startPing(){
  bgClear(pingTimer);
  pingTimer = bgEvery(() => {
    if(hub && hub.liveCount()) hub.send('h', {t:'ping'});
    if(S && !isHost && !lostShown && Date.now() - lastHostMsg > 15000) showLost();
  }, 3000);
}
function showLost(msg){
  lostShown = true;
  dialog({kind:'lost', title:'Connection lost', ok:'Reconnect', cancel:'Leave',
    text: msg || "Lost connection to the table. This happens when the host's screen locks, their tab closes, or someone's internet drops. It reconnects by itself when things come back.",
    onOk: reconnect, onCancel: () => { leaveLocal(); renderHome(); }});
}
function hideLost(){ lostShown = false; if(modalKind === 'lost') closeModal(); }
function reconnect(){
  lostShown = false; lastHostMsg = Date.now();
  if(hub && hub.liveCount()) sendJoin();
  else startClient();
}

/* ---------- leaving ---------- */
function leaveLocal(keepURL){
  bgClear(pingTimer); clearTimeout(joinTimer); bgClear(hostTimer); clearInterval(chaosTimer);
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
  const h = hub; hub = null; hostSender = null;
  if(h) setTimeout(() => h.close(), 700);
  conns.clear(); G = null; S = null; isHost = false; lostShown = false; joinCode = null;
  closeModal(); if(!keepURL) setRoomURL(null);
  $('#stage').className = ''; document.body.classList.remove('fx-blackout');
}
function leaveTable(){
  if(!isHost && hub){ hub.send('h', {t:'leave'}); }
  leaveLocal(); renderHome();
}
window.addEventListener('beforeunload', () => {
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
});

/* =====================================================================
   HOME SCREEN
   ===================================================================== */

  {k:'baccarat', name:'Baccarat', line:'Player or Banker? Closest to 9 wins.', who:'1-6 players', turns:'Take turns flipping the cards'},

  {k:'imposter', name:'Imposter', line:"One friend doesn't know the secret word. Find them.", who:'3-6 players', turns:'Take turns giving clues'},
];
function gameIcon(k){

  if(k === 'buckshot') return `<div class="gi giShells">${shellIcon(true)}${shellIcon(false)}${shellIcon(true)}${shellIcon(true)}</div>`;
  return `<div class="gi giImp"><svg viewBox="0 0 96 64" aria-hidden="true"><g fill="#f3e3c4"><circle cx="18" cy="24" r="9"/><path d="M4 60c0-12 6-20 14-20s14 8 14 20z"/><circle cx="78" cy="24" r="9"/><path d="M64 60c0-12 6-20 14-20s14 8 14 20z"/></g><g fill="#ff4d5e"><circle cx="48" cy="20" r="11"/><path d="M31 62c0-14 7-23 17-23s17 9 17 23z"/></g><text x="48" y="25" text-anchor="middle" font-size="15" font-weight="800" fill="#2a0610" font-family="Rubik,Arial,sans-serif">?</text></svg></div>`;
}
function renderHome(msg, info){

  $('#stage').className = ''; document.body.classList.remove('fx-blackout');

  const name = store.get('name', '');

  const tiles = LINEUP.map(g => `<button class="gtile${g.k === pickG ? ' on' : ''}" data-g="${g.k}" role="radio" aria-checked="${g.k === pickG}" ${room ? 'tabindex="-1"' : ''}>
      ${gameIcon(g.k)}<span class="gtext"><b>${g.name}</b><span class="gline">${g.line}</span><span class="gmeta">${g.who} &middot; ${g.turns}</span></span><i class="gpick" aria-hidden="true">&#10003;</i></button>`).join('');
  $('#stage').innerHTML = `<div class="title${room ? ' joining' : ''}">
    <div class="marqWrap">
      <div class="marq"><i class="mqb a"></i><i class="mqb b"></i>
        <div class="mqIn"><span class="mqPre">Welcome to</span><h1 class="mqName">Whylo's</h1><span class="mqCas"><i></i>CASINO<i></i></span></div>
      </div>
      <div class="tMyla"><div class="mylaStand" style="--mx:50%;height:170px;width:136px">${MYLA_BIG()}</div></div>
      <p class="tSay"><b>Myla</b>${room ? `Your friends are waiting at table <span class="code">${esc(room)}</span>. Pull up a chair.` : `Hi, I'm Myla, your dealer tonight. Pick a game and bring your friends. They can join from anywhere.`}</p>
    </div>
    <section class="lineup" aria-label="Games">
      <h2>${room ? 'Games at Whylo\'s' : 'Pick a game to start'}</h2>
      <div class="gtiles" role="radiogroup" aria-label="Starting game">${tiles}</div>
    </section>
    <section class="panel tPanel" aria-label="Play">
      <div class="field"><label for="nameIn">Your name</label><input id="nameIn" class="inp" maxlength="14" autocomplete="off" spellcheck="false" value="${esc(name)}" placeholder="Your name"></div>
      ${room
        ? `<button class="btn xl" id="joinLinkBtn">Join table ${esc(room)}</button><div class="or">or</div><button class="btn ghost" id="createBtn">Open my own table</button>`
        : `<button class="btn xl" id="createBtn">Open a <span id="createGame">${GAMES[pickG]}</span> table</button><div class="or">or join friends</div><div class="joinrow"><input id="codeIn" class="inp code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Table code"><button class="btn ghost" id="joinBtn">Join</button></div>`}
      <div class="err${info ? ' info' : ''}" id="homeMsg">${esc(msg || '')}</div>
      <p class="tNote">You get 1,000 chips. The host can switch games between rounds, and your chips come with you.</p>
    </section>
    <details class="rules tRules"${isWide() && innerWidth >= 900 ? ' open' : ''}><summary>How to play</summary>
      <div class="rgrid">
        <div><h3>Playing with friends</h3><p>One person opens a table and shares the 5-character code or the invite link. Everyone joins from their own phone or computer, on any Wi-Fi or mobile data. You'll see everyone's seat, chips and bets, and the game shows whose turn it is. Keep the host's tab open.</p></div>
        <div><h3>Blackjack</h3><p>Get closer to the target than Myla without going over: <b>21</b> (she stands on 17) or <b>33</b> (she stands on 29, and exactly 33 pays 2:1). Players take turns: hit, stand or double. Blackjack pays 3:2. Side bets: Perfect Pairs and 21+3.</p></div>
        <div><h3>Roulette</h3><p>Everyone places chips on the layout. Then one player gets the honor of spinning, and the job passes to the next player each round. A single number pays 35:1, red/black and odd/even pay 1:1.</p></div>
        <div><h3>Baccarat</h3><p>Bet on Player, Banker or Tie. One player flips the cards each round, taking turns around the table. Closest to 9 wins. Player 1:1, Banker 0.95:1, Tie 8:1.</p></div>
        <div><h3>Buckshot</h3><p>Put down a stake and face The Dealer with a shotgun of live and blank shells. Players take turns: shoot The Dealer or yourself. Use items, survive all 3 rounds, and get paid.</p></div>

        <div><h3>Wheel of Doom</h3><p>When it's on, losing spins the wheel: taxes, earthquakes, upside-down screens, cursed aces, embarrassing names. The host can turn it off.</p></div>
      </div>
    </details>
  </div>`;
  const createBtn = $('#createBtn'), joinBtn = $('#joinBtn'), joinLinkBtn = $('#joinLinkBtn'), codeIn = $('#codeIn'), nameIn = $('#nameIn');
  document.querySelectorAll('.gtile').forEach(t => t.onclick = () => {

    const cg = $('#createGame'); if(cg) cg.textContent = GAMES[pickG];
    if(SFX.on) try{ actx(); sfx('chip'); }catch(e){}
  });
  createBtn.onclick = () => { if(SFX.on) actx(); createTable(); };
  if(joinBtn) joinBtn.onclick = () => { if(SFX.on) actx(); joinTable(codeIn.value); };

  if(codeIn) codeIn.addEventListener('keydown', e => { if(e.key === 'Enter') joinBtn.click(); });
  nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') (joinLinkBtn || createBtn).click(); });
  if(!name) setTimeout(() => nameIn.focus(), 50);
  marqueeBulbs();
}
/* Marquee bulbs: evenly spaced around the sign's rounded border, alternating so they chase. */
function marqueeBulbs(){
  const m = document.querySelector('.marq'); if(!m) return;
  const old = m.querySelector('.bulbRing'); if(old) old.remove();
  const W = m.clientWidth, H = m.clientHeight, inset = 11, r = 15;
  if(W < 50 || H < 50) return;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'bulbRing'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
  path.setAttribute('d', `M${x0 + r} ${y0}H${x1 - r}A${r} ${r} 0 0 1 ${x1} ${y0 + r}V${y1 - r}A${r} ${r} 0 0 1 ${x1 - r} ${y1}H${x0 + r}A${r} ${r} 0 0 1 ${x0} ${y1 - r}V${y0 + r}A${r} ${r} 0 0 1 ${x0 + r} ${y0}Z`);
  svg.appendChild(path); m.prepend(svg);
  const L = path.getTotalLength(), n = Math.max(12, Math.round(L / 19) & ~1);
  let a = '', b = '';
  for(let i = 0; i < n; i++){
    const pt = path.getPointAtLength(L * i / n);
    const c = `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="6.5" fill="url(#mqHalo)"/><circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="url(#mqGlass)"/>`;
    if(i % 2) b += c; else a += c;
  }
  svg.innerHTML = `<defs><radialGradient id="mqGlass" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff2c8"/><stop offset="1" stop-color="#e8b24a"/></radialGradient><radialGradient id="mqHalo"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset=".5" stop-color="#ffc864" stop-opacity=".3"/><stop offset="1" stop-color="#ffc864" stop-opacity="0"/></radialGradient></defs><g class="bl">${a}</g><g class="bl o">${b}</g>`;
}
let bulbRT = null;
window.addEventListener('resize', () => { clearTimeout(bulbRT); bulbRT = setTimeout(() => { if(screen === 'home') marqueeBulbs(); }, 150); });
document.fonts && document.fonts.ready && document.fonts.ready.then(() => { if(screen === 'home') marqueeBulbs(); });
function readName(){
  const el = $('#nameIn'); const v = el ? el.value.replace(/\s+/g, ' ').trim().slice(0,14) : '';
  if(!v){ showHomeMsg('Type your name first.'); if(el) el.focus(); return null; }
  store.set('name', v); return v;
}
function showHomeMsg(m, info){ const el = $('#homeMsg'); if(el){ el.textContent = m; el.classList.toggle('info', !!info); } }
function setHomeBusy(m){
  document.querySelectorAll('.title button, .title input').forEach(b => b.disabled = true);
  showHomeMsg(m, true);
}
function homeError(m){ leaveLocal(true); renderHome(m); }

renderHome();
