};

const ROASTS = [
  "I've seen better decisions from a broken vending machine.",
  "Bold strategy. Wrong, but bold.",
  "You play like you're allergic to winning.",
  "That was so bad it should come with a warning label.",
  "Congratulations, you just paid for my vacation.",
  "I'd say better luck next time, but let's be realistic.",
  "You're the reason this casino has such nice carpets.",
  "Even the cards felt bad for you on that one.",
  "Math called. It wants an apology.",
  "That wasn't a bet. That was a donation.",
  "My goldfish gambles better than you, and he's a goldfish.",
  "Sweetie, no.",
];
const NAMES = ["Sir Loses-a-Lot","Captain Bust","Professor 34","Chip Donor","The Human ATM","Lil' Bust","Wet Napkin","Budget Gambler","Mr. Almost","Myla's Fan","Twenty-Two","Señor Sad"];
const LINES = {
  bsBet:["Put your chips on the table. If you survive, you get paid.","Care to play a game? Stakes first.","The gun is loaded with patience. Bet."],
  impBet:["Party time! Tap I'M IN to play Imposter.","Who's in for Imposter? Three players minimum.","Get ready to lie to your friends. Tap I'M IN."],
  bjBet:["Place your bets, everyone.","Chips in the circle, please.","Who's feeling lucky tonight?","Bets in, please. Good luck."],
  bjDeal:["Cards are out. Good luck.","Here we go.","Two cards each. Play smart.","Cards are out. I'm watching you."],
  rlBet:["Place your bets on the layout.","Pick your numbers, everyone.","Feeling lucky? Pick a number.","Bets on the layout, please."],
  bacBet:["Player, Banker, or Tie. Place your bets.","Who do you trust tonight, Player or Banker?","Bets on the layout, please."],
  idle:["Anybody going to bet? I don't have all night.","Hello? Chips go on the table.","I'll wait. I'm very patient. That's a lie."],
  dBust:["Dealer busts! Everybody still standing gets paid.","I went over. Don't get used to it.","Bust! Take your chips."],
  beg:["Fine, {n}. Here's 300. Everyone saw that.","I'm generous, {n}. I also have a long memory.","Take it, {n}. Try to make it last more than one hand."],
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
function rnd(n){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }catch(e){ return Math.floor(Math.random()*n); } }
const pick = a => a[rnd(a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem('bj33.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bj33.'+k, JSON.stringify(v)); }catch(e){} }
};
// One id per browser tab (survives reloads), so two tabs = two players and a reload keeps your seat.
function tabId(){
  let id = null;
  try{ id = sessionStorage.getItem('bj33.id'); }catch(e){}
  if(!id){ id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); try{ sessionStorage.setItem('bj33.id', id); }catch(e){} }
  return id;
}
const MY_ID = tabId();
const isTen = r => r === '10' || r === 'J' || r === 'Q' || r === 'K';

function handValue(cards, limit = 21, acesLow = false){
  let t = 0, aces = 0;
  for(const c of cards){
    if(!c || c.back) continue;
    if(c.r === 'A'){ if(acesLow) t += 1; else { t += 11; aces++; } }
    else if(isTen(c.r)) t += 10;
    else t += Number(c.r);
  }
  while(t > limit && aces > 0){ t -= 10; aces--; }
  return {total:t, soft:aces > 0};
}
// A "blackjack" is an Ace + a 10-value card as your first two cards (in both 21 and 33 mode).
function isNatural(cards, acesLow = false){
  return cards.length === 2 && !acesLow && cards.every(c => !c.back) && cards.some(c => c.r === 'A') && cards.some(c => isTen(c.r));
}

/* =====================================================================
   HOST: the game engine. Only runs in the browser that created the table.
   ===================================================================== */
let G = null;
const conns = new Map();   // player id -> PeerJS connection
let hostTimer = null, lastBroadcast = 0;

function newGame(code){
  return {code, round:0, phase:'lobby', settings:{game:'blackjack', target:33, doom:true, impHint:true}, bs:null, imp:null,
    players:[], dealer:{hand:[],hidden:true}, dealerBJ:false,
    say:"Welcome to my table. I'm Myla. Take a seat.", sayId:1,
    turn:null, turnOrder:[], turnEnds:0, turnTotal:TURN_TIME, phaseEnds:0, phaseTotal:1,
    shoe:newShoe(), cardSeq:0, events:[], evSeq:0, hostId:MY_ID, ghosts:{},
    rl:{result:null, spinId:0, history:[]},
    bac:{seq:[], shown:0, nextAt:0, winner:null, pt:0, bt:0, history:[]}};
}
function newShoe(){ const s=[]; for(let d=0;d<DECKS;d++) for(const su of SUITS) for(const r of RANKS) s.push({r,s:su}); return shuffle(s); }
function draw(){ if(!G.shoe.length) G.shoe = newShoe(); const c = G.shoe.pop(); return {r:c.r, s:c.s, id:++G.cardSeq}; }
function P(id){ return G.players.find(p => p.id === id); }
function addEvent(e){ e.id = ++G.evSeq; G.events.push(e); if(G.events.length > 40) G.events.shift(); }
function note(text, extra = {}){ addEvent({type:'toast', text, ...extra}); }
function say(t){ G.say = t; G.sayId++; }
const GAME = () => G.settings.game;
const TGT = () => G.settings.target;
const DSTAND = () => G.settings.target === 21 ? 17 : 29;
function activeCurse(p){ return p.curse && p.curse.round <= G.round ? p.curse.id : null; }
function limitOf(p){ return activeCurse(p) === 'shrink' ? TGT() - 3 : TGT(); }
function pv(p){ return handValue(p.hand, limitOf(p), activeCurse(p) === 'aces').total; }
function pNatural(p){ return isNatural(p.hand, activeCurse(p) === 'aces'); }
function turnTime(p){ return activeCurse(p) === 'speed' ? SPEED_TIME : TURN_TIME; }
function cleanName(n){ n = String(n || '').replace(/\s+/g,' ').trim().slice(0,14); return n || 'Player'; }
const LOCKED = ['playing','peek','dealer','spinning','dealing','shotgun','imp'];

function handleJoin(msg, conn){
  if(!G) return;
  const id = String(msg.id || '').slice(0,40); if(!id) return;
  let p = P(id);
  const name = cleanName(msg.name);
  if(!p){
    if(G.players.filter(x => !x.left).length >= MAX_PLAYERS){
      if(conn){ try{ conn.send({t:'reject', reason:'That table is full (6 players max).'}); }catch(e){} setTimeout(()=>{ try{ conn.close(); }catch(e){} }, 600); }
      return;
    }
    let nm = name, k = 2;
    while(G.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = name.slice(0,11) + ' ' + (k++);
    p = {id, name:nm, baseName:nm, renamed:false, chips:START_CHIPS, bet:0, bets:{}, betOrder:[], lastBets:null, lastGame:null, main:0, side:null, ready:false, inRound:false,
         hand:[], status:'', result:'', delta:0, doubled:false, finalTotal:null, finalLimit:null, curse:null, lastCurse:null,
         connected:true, left:false, lastSeen:Date.now(), begs:0, hits:0, wins:0, losses:0};
    const ghost = G.ghosts[id];
    if(ghost){ p.chips = ghost.chips; p.begs = ghost.begs; delete G.ghosts[id]; }
    G.players.push(p);
    if(id !== G.hostId){
      note(`${nm} sat down at the table.`);
      if(LOCKED.includes(G.phase) || G.phase === 'results') say(`Welcome, ${nm}. You're in next round.`);
    }
  } else {
    const was = p.connected; p.connected = true; p.left = false;
    if(!was) note(`${p.name} is back.`);
  }
  p.lastSeen = Date.now();
  if(conn){
    const old = conns.get(id);
    conns.set(id, conn); conn.clientId = id;
    if(old && old !== conn){ try{ old.close(); }catch(e){} }
  }
  broadcast();
}

function hostHandle(fromId, msg){
  if(!G || !msg || typeof msg !== 'object') return;
  const p = P(fromId); if(!p) return;
  p.lastSeen = Date.now();
  let changed = false;
  if(!p.connected && msg.t !== 'leave'){ p.connected = true; p.left = false; note(`${p.name} is back.`); changed = true; }
  switch(msg.t){
    case 'ping': break;
    case 'start': if(fromId === G.hostId && G.phase === 'lobby'){ startRound(); changed = true; } break;
    case 'settings': changed = changeSettings(p, msg) || changed; break;
    case 'rebet': changed = rebet(p) || changed; break;
    case 'x2': changed = doubleBets(p) || changed; break;
    case 'chip': changed = addChip(p, msg.k, msg.amt) || changed; break;
    case 'undo': changed = undoChip(p) || changed; break;
    case 'clearbets': changed = clearChips(p) || changed; break;
    case 'done': changed = doneBetting(p, !!msg.out) || changed; break;
    case 'act': changed = playerAct(p, msg.a) || changed; break;
    case 'bs': changed = bsAct(p, msg) || changed; break;
    case 'imp': changed = impAct(p, msg) || changed; break;
    case 'beg': changed = beg(p) || changed; break;
    case 'leave': removePlayer(p); changed = true; break;
  }
  if(changed) broadcast();
}

/* ---------- settings ---------- */
function changeSettings(p, s){
  if(p.id !== G.hostId) return false;
  if(!(G.phase === 'lobby' || G.phase === 'betting' || G.phase === 'results')) return false;
  const st = G.settings, before = JSON.stringify(st);
  if(s.game && GAMES[s.game]) st.game = s.game;
  if(s.target === 21 || s.target === 33) st.target = s.target;
  if(typeof s.doom === 'boolean'){ st.doom = s.doom; if(!st.doom) G.players.forEach(x => { x.curse = null; }); }
  if(typeof s.impHint === 'boolean') st.impHint = s.impHint;
  if(JSON.stringify(st) === before) return false;
  note(`Host switched the table to ${tableLabel(st)}.`);
  if(G.phase === 'betting'){
    for(const x of G.players){ x.chips += x.bet; x.bet = 0; x.bets = {}; x.betOrder = []; x.ready = false; x.inRound = false; }
    startRound();
  }
  return true;
}
function tableLabel(st){
  const g = st.game === 'blackjack' ? `Blackjack ${st.target}` : GAMES[st.game];
  if(st.game === 'imposter') return g + (st.doom ? ' with the Wheel of Doom' : '');
  return g + (st.doom ? ' with the Wheel of Doom' : ' (no punishments)');
}

/* ---------- round flow (all games) ---------- */
function saveGhost(p){ G.ghosts[p.id] = {chips:p.chips, begs:p.begs}; }
function startRound(){
  G.players.filter(p => p.left).forEach(saveGhost);
  G.players = G.players.filter(p => !p.left);
  G.round++; G.phase = 'betting'; G.turn = null; G.turnOrder = [];
  G.dealer = {hand:[], hidden:true}; G.dealerBJ = false; G.bs = null; G.imp = null;
  for(const p of G.players) Object.assign(p, {bet:0, bets:{}, betOrder:[], main:0, side:null, mainDelta:0, ready:false, inRound:false, hand:[], status:'', result:'', delta:0, doubled:false, hits:0, finalTotal:null, finalLimit:null});
  const g = GAME();
  if((g === 'blackjack' || g === 'baccarat') && G.shoe.length < DECKS*52*0.3){ G.shoe = newShoe(); note('Fresh shoe! Myla shuffles six decks.'); }
  if(g === 'baccarat') Object.assign(G.bac, {seq:[], shown:0, winner:null, pt:0, bt:0});
  G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME;
  say(pick(LINES[{roulette:'rlBet', baccarat:'bacBet', buckshot:'bsBet', imposter:'impBet'}[g] || 'bjBet']));
}
function eligibleBettors(){ return G.players.filter(p => p.connected && !p.left && (p.ready || p.bet > 0 || p.chips >= MIN_BET || FREE_GAMES.includes(GAME()))); }
function allBetsIn(){ const e = eligibleBettors(); return e.length > 0 && e.every(p => p.ready) && G.players.some(p => p.inRound); }
function closeBetting(){
  const g0 = GAME();
  if(g0 === 'blackjack'){
    for(const p of G.players.filter(p => p.inRound && (p.bets.main || 0) < MIN_BET)){
      p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
      addEvent({type:'toast', to:p.id, text:`Your chips came back: you need at least ${MIN_BET} on the main circle to play a hand.`, bad:true});
    }
  }
  if(g0 === 'buckshot'){
    for(const p of G.players.filter(p => p.inRound && (p.bets.stake || 0) < MIN_BET)){
      p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
      addEvent({type:'toast', to:p.id, text:`Your chips came back: the minimum stake is ${MIN_BET}.`, bad:true});
    }
  }
  if(g0 === 'imposter' && G.players.filter(p => p.inRound).length < IMP_MIN){
    G.players.forEach(p => { p.ready = false; p.inRound = false; });
    G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME;
    say(`Imposter needs at least ${IMP_MIN} players. Invite some friends!`); return;
  }
  for(const p of G.players.filter(p => p.inRound)){ if(p.bet) p.lastBets = {...p.bets}; p.lastGame = g0; }
  if(!G.players.some(p => p.inRound)){ G.phaseTotal = BET_TIME; G.phaseEnds = Date.now() + BET_TIME; say(pick(LINES.idle)); return; }
  const g = GAME();
  if(g === 'blackjack') deal();
  else if(g === 'roulette') rlSpin();
  else if(g === 'buckshot') bsStart();
  else if(g === 'imposter') impStart();
  else bacDeal();
}

// chips on spots. Blackjack spots: main / pp / p21. Roulette + baccarat: their layouts.
function validSpot(k){
  const g = GAME();
  return g === 'blackjack' ? !!BJ_BETS[k] : g === 'roulette' ? rlValidKey(k) : g === 'buckshot' ? k === 'stake' : g === 'imposter' ? false : !!BAC_BETS[k];
}
function putChip(p, k, amt){
  amt = Math.floor(Number(amt) || 0);
  if(amt > p.chips) amt = p.chips;
  if(amt < 1) return false;
  p.bets[k] = (p.bets[k] || 0) + amt; p.betOrder.push([k, amt]);
  p.chips -= amt; p.bet += amt; p.inRound = true;
  return true;
}
function addChip(p, k, amt){
  if(G.phase !== 'betting' || p.ready || !validSpot(k)) return false;
  return putChip(p, k, amt);
}
// Same bets as last round (only if they were on this game)
function rebet(p){
  if(G.phase !== 'betting' || p.ready || p.bet > 0 || !p.lastBets || p.lastGame !== GAME()) return false;
  const tot = Object.values(p.lastBets).reduce((a,b) => a + b, 0);
  if(tot > p.chips){ addEvent({type:'toast', to:p.id, text:`Not enough chips to rebet ${fmt(tot)}.`, bad:true}); return true; }
  const keys = Object.keys(p.lastBets).sort((a,b) => (a === 'main' ? -1 : 0) - (b === 'main' ? -1 : 0));
  for(const k of keys) if(validSpot(k)) putChip(p, k, p.lastBets[k]);
  return true;
}
// Double every chip already on the table
function doubleBets(p){
  if(G.phase !== 'betting' || p.ready || !p.bet) return false;
  if(p.bet > p.chips){ addEvent({type:'toast', to:p.id, text:'Not enough chips to double your bets.', bad:true}); return true; }
  for(const [k, amt] of Object.entries({...p.bets})) putChip(p, k, amt);
  return true;
}
function undoChip(p){
  if(G.phase !== 'betting' || p.ready || !p.betOrder.length) return false;
  const [k, amt] = p.betOrder.pop();
  p.bets[k] -= amt; if(p.bets[k] <= 0) delete p.bets[k];
  p.chips += amt; p.bet -= amt; p.inRound = p.bet > 0;
  return true;
}
function clearChips(p){
  if(G.phase !== 'betting' || p.ready || !p.bet) return false;
  p.chips += p.bet; p.bet = 0; p.bets = {}; p.betOrder = []; p.inRound = false;
  return true;
}
function doneBetting(p, out){
  if(G.phase !== 'betting' || p.ready) return false;
  if(GAME() === 'imposter'){ p.ready = true; p.inRound = !out; return true; }
  if(GAME() === 'buckshot' && p.bet && (p.bets.stake || 0) < MIN_BET){ addEvent({type:'toast', to:p.id, text:`The minimum stake is ${MIN_BET}.`, bad:true}); return true; }
  if(GAME() === 'blackjack' && (p.bets.main || 0) < MIN_BET){
    addEvent({type:'toast', to:p.id, text:p.bet ? `Put at least ${MIN_BET} on the main circle first.` : `Tap the main circle to bet first (minimum ${MIN_BET}).`, bad:true});
    return true;
  }
  p.ready = true; p.inRound = p.bet > 0;
  return true;
}

/* ---------- blackjack ---------- */
function deal(){
  const ps = G.players.filter(p => p.inRound);
  G.phase = 'playing'; G.dealer = {hand:[], hidden:true}; G.dealerBJ = false;
  for(const p of ps){
    p.hand = []; p.status = 'playing'; p.main = p.bets.main || 0;
    if(activeCurse(p) === 'double'){
      const extra = Math.min(p.main, p.chips);
      if(extra > 0){ p.chips -= extra; p.main += extra; p.bet += extra; p.bets.main = p.main; note(`DOUBLE TROUBLE! ${p.name}'s bet got doubled to ${fmt(p.main)}.`, {bad:true}); }
    }
  }
  for(let i=0;i<2;i++){ for(const p of ps) p.hand.push(draw()); G.dealer.hand.push(draw()); }
  for(const p of ps){
    p.side = {};
    const up = G.dealer.hand[0];
    for(const k of ['pp','p21']){
      const amt = p.bets[k] || 0; if(!amt) continue;
      const r = k === 'pp' ? ppResult(p.hand[0], p.hand[1]) : p21Result([p.hand[0], p.hand[1], up]);
      if(r){ const win = amt*r.mult; p.chips += amt + win; p.side[k] = {amt, name:r.name, mult:r.mult, net:win}; note(`${p.name} wins ${BJ_BETS[k]}: ${r.name}! +${fmt(win)}`, {delay:1900, good:true}); }
      else p.side[k] = {amt, name:null, mult:0, net:-amt};
    }
  }
  for(const p of ps) if(pNatural(p)){ p.status = 'blackjack'; note(`${p.name} has BLACKJACK!`, {delay:1900}); }
  G.turnOrder = ps.map(p => p.id); G.turn = null;
  const up = G.dealer.hand[0].r;
  if(up === 'A' || isTen(up)){
    G.phase = 'peek'; G.phaseTotal = DEAL_ANIM + PEEK_TIME; G.phaseEnds = Date.now() + G.phaseTotal;
    say(up === 'A' ? 'Ace showing. Let me check for blackjack...' : 'Ten showing. Let me check for blackjack...');
  } else { say(pick(LINES.bjDeal)); nextTurn(DEAL_ANIM); }
}
function endPeek(){
  if(isNatural(G.dealer.hand)){ G.dealer.hidden = false; G.dealerBJ = true; say('Dealer blackjack! Sorry, everyone.'); finishBlackjack(); }
  else { G.phase = 'playing'; say('No blackjack. Your move.'); nextTurn(); }
}
function nextTurn(extra = 0){
  const order = G.turnOrder;
  let i = G.turn ? order.indexOf(G.turn) + 1 : 0;
  for(; i < order.length; i++){
    const p = P(order[i]); if(!p) continue;
    if(p.status === 'playing'){
      if(p.connected){ G.turn = p.id; G.turnTotal = turnTime(p) + extra; G.turnEnds = Date.now() + G.turnTotal; return; }
      p.status = 'stand';
    }
  }
  G.turn = null;
  dealerPlay();
}
function playerAct(p, a){
  if(G.phase !== 'playing' || G.turn !== p.id || p.status !== 'playing') return false;
  const lim = limitOf(p);
  if(a === 'hit'){
    p.hand.push(draw()); p.hits++;
    const v = pv(p);
    if(v > lim){ p.status = 'bust'; note(`${p.name} BUSTS with ${v}!`, {bad:true}); nextTurn(); }
    else if(v === lim){ p.status = 'stand'; if(v === TGT() && TGT() === 33) note(`${p.name} hit exactly 33!`); nextTurn(); }
    else { G.turnTotal = turnTime(p); G.turnEnds = Date.now() + G.turnTotal; }
    return true;
  }
  if(a === 'stand'){
    if(activeCurse(p) === 'nochicken' && p.hits === 0){ addEvent({type:'toast', to:p.id, text:'NO CHICKENS! You have to hit at least once first.', bad:true}); return true; }
    p.status = 'stand'; nextTurn(); return true;
  }
  if(a === 'double'){
    if(p.hand.length !== 2 || p.hits > 0 || p.chips < p.main) return false;
    p.chips -= p.main; p.bet += p.main; p.main *= 2; p.bets.main = p.main; p.hits++; p.doubled = true;
    p.hand.push(draw());
    const v = pv(p);
    if(v > lim){ p.status = 'bust'; note(`${p.name} doubled down and BUSTED with ${v}!`, {bad:true}); }
    else { p.status = 'stand'; note(`${p.name} doubled down: ${v}.`); }
    nextTurn(); return true;
  }
  return false;
}
function dealerPlay(){
  G.phase = 'dealer'; G.dealer.hidden = false; G.turn = null;
  const live = G.players.some(p => p.inRound && p.status !== 'bust' && p.status !== 'blackjack');
  const anyBJ = G.players.some(p => p.inRound && p.status === 'blackjack');
  say(live ? "Let's see what I've got..." : anyBJ ? 'Nothing left to play for. Let me flip my card.' : "Everybody busted? I didn't even have to try.");
  const g = G;
  const step = () => {
    if(G !== g || G.phase !== 'dealer') return;
    const v = handValue(G.dealer.hand, TGT()).total;
    if(live && v < DSTAND()){ G.dealer.hand.push(draw()); broadcast(); setTimeout(step, 850); }
    else setTimeout(() => { if(G === g && G.phase === 'dealer'){ finishBlackjack(); broadcast(); } }, 650);
  };
  setTimeout(step, 900);
}
function finishBlackjack(){
  const T = TGT(), d = handValue(G.dealer.hand, T).total, dBust = d > T, dBJ = isNatural(G.dealer.hand);
  G.dealerBJ = dBJ;
  if(!dBJ) say(dBust ? pick(LINES.dBust) : `Dealer has ${d}.`);
  for(const p of G.players.filter(p => p.inRound)){
    const v = pv(p);
    p.finalTotal = v; p.finalLimit = limitOf(p);
    let res;
    if(p.status === 'blackjack') res = dBJ ? 'push' : 'bj';
    else if(dBJ) res = 'lose';
    else if(p.status === 'bust') res = 'lose';
    else if(dBust || v > d) res = (T === 33 && v === 33) ? 'win33' : 'win';
    else if(v < d) res = 'lose';
    else res = 'push';
    const m = p.main;
    let delta;
    if(res === 'win'){ p.chips += m*2; delta = m; }
    else if(res === 'win33'){ p.chips += m*3; delta = m*2; }
    else if(res === 'bj'){ const w = Math.floor(m*1.5); p.chips += m + w; delta = w; }
    else if(res === 'push'){ p.chips += m; delta = 0; }
    else delta = -m;
    const sideNet = p.side ? Object.values(p.side).reduce((a,x) => a + x.net, 0) : 0;
    p.result = res; p.mainDelta = delta; p.delta = delta + sideNet;
  }
  settle();
}

/* ---------- roulette ---------- */
function rlSpin(){
  G.phase = 'spinning';
  G.rl.result = rnd(37); G.rl.spinId++;
  G.phaseTotal = SPIN_TIME; G.phaseEnds = Date.now() + SPIN_TIME;
  say('No more bets!');
}
function rlFinish(){
  const n = G.rl.result;
  G.rl.history.unshift(n); G.rl.history = G.rl.history.slice(0, 16);
  say(n === 0 ? 'Zero! Green zero.' : `${n} ${rlColor(n)}.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)) if(rlCovers(k, n)) ret += amt*(rlPays(k) + 1);
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }
  settle();
}

/* ---------- baccarat ---------- */
function bacDeal(){
  G.phase = 'dealing';
  const p1 = draw(), b1 = draw(), p2 = draw(), b2 = draw();
  const PH = [p1, p2], BH = [b1, b2], seq = [['P',p1],['B',b1],['P',p2],['B',b2]];
  const pt = bacTotal(PH), bt = bacTotal(BH);
  if(pt < 8 && bt < 8){
    let p3 = null;
    if(pt <= 5){ p3 = draw(); PH.push(p3); seq.push(['P',p3]); }
    let bDraw;
    if(p3 === null) bDraw = bt <= 5;
    else { const v = bacVal(p3); bDraw = bt <= 2 || (bt === 3 && v !== 8) || (bt === 4 && v >= 2 && v <= 7) || (bt === 5 && v >= 4 && v <= 7) || (bt === 6 && (v === 6 || v === 7)); }
    if(bDraw){ const b3 = draw(); BH.push(b3); seq.push(['B',b3]); }
  }
  Object.assign(G.bac, {seq, shown:0, nextAt:Date.now() + 700, winner:null});
  G.phaseTotal = 1; G.phaseEnds = 0;
  say('Cards, please.');
}
function bacStep(now){
  const b = G.bac;
  if(b.shown < b.seq.length){
    b.shown++;
    b.nextAt = now + (b.shown >= 4 ? BAC_STEP + 500 : BAC_STEP);
    if(b.shown === 4){
      const pt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'P').map(x => x[1])), bt = bacTotal(b.seq.slice(0,4).filter(x => x[0] === 'B').map(x => x[1]));
      if(pt >= 8 || bt >= 8) say(`Natural ${Math.max(pt, bt)}!`);
      else if(b.seq.length > 4) say(b.seq[4][0] === 'P' ? 'Player draws.' : 'Banker draws.');
    } else if(b.shown === 5 && b.seq.length === 6) say('Banker draws.');
    return true;
  }
  bacFinish(); return true;
}
function bacFinish(){
  const b = G.bac;
  const PH = b.seq.filter(x => x[0] === 'P').map(x => x[1]), BH = b.seq.filter(x => x[0] === 'B').map(x => x[1]);
  const pt = bacTotal(PH), bt = bacTotal(BH);
  const w = pt > bt ? 'P' : bt > pt ? 'B' : 'T';
  const pPair = PH[0].r === PH[1].r, bPair = BH[0].r === BH[1].r;
  Object.assign(b, {winner:w, pt, bt, pPair, bPair});
  b.history.push(w); if(b.history.length > 60) b.history.shift();
  say(w === 'P' ? `Player wins, ${pt} over ${bt}.` : w === 'B' ? `Banker wins, ${bt} over ${pt}.` : `It's a tie, ${pt} all.`);
  for(const p of G.players.filter(p => p.inRound)){
    let ret = 0;
    for(const [k, amt] of Object.entries(p.bets)){
      if(k === 'P') ret += w === 'P' ? amt*2 : w === 'T' ? amt : 0;
      else if(k === 'B') ret += w === 'B' ? amt + Math.floor(amt*0.95) : w === 'T' ? amt : 0;
      else if(k === 'T') ret += w === 'T' ? amt*9 : 0;
      else if(k === 'PP') ret += pPair ? amt*12 : 0;
      else if(k === 'BP') ret += bPair ? amt*12 : 0;
    }
    p.chips += ret; p.delta = ret - p.bet;
    p.result = p.delta > 0 ? 'win' : p.delta < 0 ? 'lose' : 'push';
  }
  settle();
}

/* ---------- results + Wheel of Doom (all games) ---------- */
function settle(extra = 0){
  const losers = [];
  for(const p of G.players.filter(p => p.inRound)){
    if(p.curse && p.curse.round <= G.round) p.curse = null;   // curse served
    if(p.result === 'win' || p.result === 'bj' || p.result === 'win33' || (p.result !== 'lose' && p.delta > 0)){
      p.wins++;
      if(p.renamed){ note(`${p.baseName} won their real name back!`); p.name = p.baseName; p.renamed = false; }
    }
    if(p.result === 'lose'){ p.losses++; losers.push(p); }
  }
  if(G.settings.doom) for(const p of losers) applyCurse(p);
  G.phase = 'results';
  G.phaseTotal = RESULT_TIME + extra + (G.settings.doom && losers.length ? CURSE_TIME : 0);
  G.phaseEnds = Date.now() + G.phaseTotal;
}
function weightedPick(ids){
  const tot = ids.reduce((a,id) => a + CURSES[id].w, 0);
  let r = Math.random() * tot;
  for(const id of ids){ r -= CURSES[id].w; if(r <= 0) return id; }
  return ids[ids.length-1];
}
function applyCurse(p){
  const before = p.name;
  const id = weightedPick(Object.keys(CURSES).filter(k => k !== p.lastCurse && (GAME() === 'blackjack' || !CURSES[k].bj)));
  p.lastCurse = id;
  const c = CURSES[id], ev = {type:'curse', pid:p.id, pname:before, curse:id};
  switch(id){
    case 'tax': { const take = Math.min(p.chips, Math.max(5, Math.ceil(p.chips*0.15))); p.chips -= take; ev.amount = take; break; }
    case 'robin': {
      const amt = Math.ceil(p.chips*0.10);
      const others = G.players.filter(o => o.id !== p.id && !o.left);
      p.chips -= amt; ev.amount = amt;
      if(others.length){ const poor = others.reduce((a,b) => b.chips < a.chips ? b : a); poor.chips += amt; ev.toName = poor.name; }
      else ev.toName = "Myla's tip jar";
      break;
    }
    case 'roast': ev.line = pick(ROASTS); say(`${before}: ${ev.line}`); break;
    case 'rename': { const nn = pick(NAMES.filter(n => n !== p.name)); p.name = nn; p.renamed = true; ev.newName = nn; break; }
    case 'pity': p.chips += 50; break;
    default: if(c.kind === 'next') p.curse = {id, round:G.round + 1};
  }
  addEvent(ev);
}

function beg(p){
  if(p.chips >= MIN_BET || p.bet > 0 || p.ready || LOCKED.includes(G.phase)) return false;
  p.chips += BEG_AMOUNT; p.begs++;
  note(`${p.name} begged Myla for chips${p.begs > 1 ? ` (${p.begs} times now)` : ''}.`);
  say(pick(LINES.beg).replace('{n}', p.name));
  return true;
}
function markAway(p){
  if(!p.connected) return;
  p.connected = false;
  note(`${p.name} lost connection.`, {bad:true});
  if(G.phase === 'playing' && G.turn === p.id){ p.status = 'stand'; nextTurn(); }
}
function removePlayer(p){
  if(p.id === G.hostId) return;
  note(`${p.name} left the table.`);
  const c = conns.get(p.id); conns.delete(p.id);
  if(c) setTimeout(() => { try{ c.close(); }catch(e){} }, 300);
  if(p.inRound && LOCKED.includes(G.phase)){
    p.left = true; p.connected = false;
    if(G.phase === 'shotgun' && G.bs){ G.bs.lives[p.id] = 0; if(!bsPlayers().length && G.bs.stage !== 'over') bsPause({type:'matchLose'}, 600); else if(G.bs.turn === p.id) bsBeginTurn('dealer'); }
    else if(G.phase === 'imp' && G.imp && p.id === G.imp.imposter && G.imp.stage !== 'done'){ G.imp.why = 'left'; impFinish('crew'); }
    else if(G.turn === p.id && G.phase === 'playing'){ p.status = 'stand'; nextTurn(); }
  } else {
    if(G.phase === 'betting'){ p.chips += p.bet; p.bet = 0; }
    saveGhost(p); G.players = G.players.filter(x => x !== p);
  }
}

function tick(){
  if(!G) return;
  const now = Date.now(); let ch = false;
  const hp = P(G.hostId); if(hp) hp.lastSeen = now;
  for(const p of G.players){
    if(p.id !== G.hostId && p.connected && now - p.lastSeen > 15000){ markAway(p); ch = true; }
  }
  switch(G.phase){
    case 'betting':
      if(allBetsIn() && G.phaseEnds - now > 1000){ G.phaseEnds = now + 1000; ch = true; }
      if(now >= G.phaseEnds){ closeBetting(); ch = true; }
      break;
    case 'peek':
      if(now >= G.phaseEnds){ endPeek(); ch = true; }
      break;
    case 'playing':
      if(G.turn && now >= G.turnEnds){
        const p = P(G.turn);
        if(p && p.status === 'playing'){ p.status = 'stand'; note(`${p.name} ran out of time and stands.`); }
        nextTurn(); ch = true;
      }
      break;
    case 'spinning':
      if(now >= G.phaseEnds){ rlFinish(); ch = true; }
      break;
    case 'dealing':
      if(now >= G.bac.nextAt){ bacStep(now); ch = true; }
      break;
    case 'shotgun': if(bsTick(now)) ch = true; break;
    case 'imp': if(impTick(now)) ch = true; break;
    case 'results':
      if(now >= G.phaseEnds){ startRound(); ch = true; }
      break;
  }
  if(ch || now - lastBroadcast > 4000) broadcast();
}

// What each player is allowed to see (no peeking at the dealer's hole card!)
function viewFor(rid){
  const now = Date.now(), g = GAME();
  const v = {
    code:G.code, round:G.round, phase:G.phase, hostId:G.hostId, say:G.say, sayId:G.sayId, settings:{...G.settings},
    turn:G.turn, turnLeft:G.turn ? Math.max(0, G.turnEnds - now) : 0, turnTotal:G.turnTotal,
    phaseLeft:Math.max(0, G.phaseEnds - now), phaseTotal:G.phaseTotal,
    dealer:{hidden:G.dealer.hidden, bj:G.dealerBJ, hand:G.dealer.hand.map((c,i) => (G.dealer.hidden && i === 1) ? {back:true, id:c.id} : c)},
    players:G.players.map(p => {
      const ac = activeCurse(p);
      const blind = ac === 'blind' && p.id === rid && (G.phase === 'playing' || G.phase === 'peek');

  dealerHit:['Ugh...','You got me. Lucky.','That stung.','Fine. FINE.'],
  playerHit:['Oops.','Did that hurt?','Messy.','Next.'],

function bsStart(){

function bsUseItem(by, idx){

function bsAct(p, m){

// The Dealer thinks one step at a time (an item, or a shot)
function bsDealerStep(){

  const liveLeft = b.shells.filter(x => x).length;   // he counts the shells like a pro
  let know = b.dKnow;
  if(know === undefined){ if(liveLeft === 0) know = false; else if(liveLeft === left) know = true; }
  const has = k => inv.indexOf(k);
  const anyCuffed = b.order.some(id => b.cuffed[id]);
  const step = (k) => { if(bsUseItem('dealer', has(k))){ b.until = Date.now() + BS_ITEM_PAUSE; return true; } return false; };
  if(know === undefined && has('glass') >= 0 && step('glass')) return;
  if(know === undefined && has('beer') >= 0 && left > 1 && liveLeft/left >= .5 && rnd(2) && step('beer')) return;
  if(know === true && has('saw') >= 0 && !b.saw && step('saw')) return;
  if(has('cuffs') >= 0 && !anyCuffed && (know === true || rnd(3) === 0) && step('cuffs')) return;
  if(b.stage !== 'turn') return;   // the beer emptied the gun

  if(know === true) self = false;
  else if(know === false) self = true;

function bsTick(now){

function bsFinish(won){

/* =====================================================================

const IMP_WORDS = {

  Things:['Umbrella','Toothbrush','Guitar','Mirror','Candle','Pillow','Backpack','Ladder','Camera','Clock','Scissors','Balloon','Hammer','Key','Sunglasses','Blanket','Microwave','Headphones','Wallet','Trampoline'],

  Vehicles:['Bicycle','Helicopter','Submarine','Motorcycle','Train','Taxi','Rocket','Sailboat','Tractor','Ambulance','Scooter','Hot Air Balloon','Limo','Monster Truck'],

const impNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '').replace(/(es|s)$/, '');

function impStart(){

  const cats = Object.keys(IMP_WORDS), cat = pick(cats), word = pick(IMP_WORDS[cat]);

function impAct(p, msg){

function cardHTML(c, mini, side){
  const now = performance.now(); let m = cardMeta.get(c.id), attr = '';
  if(!m){ m = {t0:now, d:Math.max(0, c.id - animBase)*0.17, back:!!c.back}; cardMeta.set(c.id, m); }
  else if(m.back && !c.back){ m.back = false; m.flipT0 = now; }
  const since = (now - m.t0)/1000;
  if(since < m.d + 0.45) attr = ` data-deal="${Math.round((m.d - since)*1000)}"`;
  else if(m.flipT0 && now - m.flipT0 < 450) attr = ` data-flip="${-Math.round(now - m.flipT0)}"`;
  const cls = 'card' + (side ? ' side' : '');

function onState(s){
  const prev = S, now = performance.now();

    seenEv = s.events.length ? s.events[s.events.length-1].id : 0;
    toast(`You're at table ${s.code}.`);
    setRoomURL(s.code);
  } else {
    for(const e of s.events) if(e.id > seenEv){ seenEv = e.id; playEvent(e); }
  }
  if(!prev || s.round !== prev.round || s.settings.game !== prev.settings.game) cardMeta.clear();
  if(s.sayId !== lastSayId){ lastSayId = s.sayId; sayAt = now; }

}

function playEvent(e){
  if(e.type === 'toast'){ if(e.delay) setTimeout(() => toast(e.text, e.bad ? 'bad' : ''), e.delay); else toast(e.text, e.bad ? 'bad' : ''); return; }
  if(e.type === 'curse'){
    const c = CURSES[e.curse]; if(!c) return;
    if(e.pid === MY_ID) setTimeout(() => showDoom(e), 1500);
    else setTimeout(() => { toast(`<b>${esc(e.pname)}</b> lost &rarr; <span class="cr">${c.name}</span>${curseDetail(e, false)}`, 'bad', true); runFx(e); }, 3900);
  }
}

function cardCount(st){
  let n = st.dealer.hand.length + st.players.reduce((a,p) => a + p.hand.length, 0);
  if(st.bac) n += st.bac.player.length + st.bac.banker.length;
  return n;
}
function transitions(prev, s){
  if(!prev || prev.settings.game !== s.settings.game) return;
  const me = s.players.find(p => p.id === MY_ID), pm = prev.players.find(p => p.id === MY_ID);
  const nNew = cardCount(s) - cardCount(prev);
  for(let i=0;i<Math.min(nNew,12);i++) setTimeout(() => sfx('card'), i*170);
  if(s.phase === 'playing' && s.turn === MY_ID && prev.turn !== MY_ID) setTimeout(() => { sfx('turn'); buzz(60); }, nNew > 3 ? 1200 : 150);
  if(me && pm && me.status === 'bust' && pm.status !== 'bust') sfx('bust');
  if(me && pm && me.status === 'blackjack' && pm.status !== 'blackjack') setTimeout(() => { banner('BLACKJACK!'); sfx('big'); confetti(90); }, 900);
  if(s.dealer.bj && !prev.dealer.bj) sfx('bust');
  if(me && pm && me.side && !pm.side){   // side bet paid when the cards came out
    const w = Object.values(me.side).filter(x => x.net > 0).sort((a,b) => b.net - a.net)[0];
    if(w) setTimeout(() => { banner(w.name.toUpperCase() + '!', true); sfx(w.mult >= 25 ? 'big' : 'win'); confetti(w.mult >= 25 ? 120 : 60); }, me.status === 'blackjack' ? 3000 : 1900);
  }
  if(s.phase === 'results' && prev.phase !== 'results' && me && me.inRound){
    if(me.result === 'win33'){ banner('THIRTY-THREE!'); sfx('big'); confetti(150); }
    else if(me.result === 'bj') sfx('win');
    else if(me.delta > 0){ sfx('win'); confetti(me.delta >= 300 ? 140 : 70); if(s.settings.game !== 'blackjack' && me.delta >= me.bet*5 && me.delta >= 200) banner('BIG WIN!'); }
    else if(me.delta < 0) setTimeout(() => sfx('lose'), 200);
    else sfx('push');
  }
}

function seeded(seed){ let s = seed >>> 0; return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }
function landDelay(cards){
  const now = performance.now(); let d = 0;
  for(const c of cards){ const m = cardMeta.get(c.id); if(m){ const r = (m.d - (now - m.t0)/1000)*1000 + 420; if(r > d) d = r; } }
  return d > 0 ? ` style="animation-delay:${Math.round(d)}ms"` : '';
}
// fade-in a badge only until the cards it describes have landed (so re-renders don't replay it)
function late(cards){
  const now = performance.now(); let d = 0;
  for(const c of cards){ const m = cardMeta.get(c.id); if(m){ const r = (m.d - (now - m.t0)/1000)*1000 + 420; if(r > d) d = r; } }
  return d > 0 ? {c:' late', s:` style="animation-delay:${Math.round(d)}ms"`, ms:d} : {c:'', s:'', ms:0};
}

function dealerSpotHTML(){
  const g = GEO, h = S.dealer.hand, T = S.settings.target;
  if(S.phase === 'betting' && !h.length) return `<div class="dspot" style="left:${g.cx}px;top:${g.dTop + 6}px">${pybHTML()}</div>`;
  const hs = handHTML(h, false);
  let badge = '';
  if(h.length){
    const hidden = h.some(c => c.back), v = handValue(h, T).total, L = late(h);
    if(S.dealer.bj) badge = `<span class="tb bj${L.c}"${L.s}>BLACKJACK</span>`;
    else badge = `<span class="tb${L.c}${v > T ? ' bust' : ''}"${L.s}>${hidden ? v : (v > T ? 'BUST ' + v : v)}</span>`;
  }
  return `<div class="dspot${S.phase === 'peek' ? ' peeking' : ''}" style="left:${g.cx}px;top:${g.dTop}px;--cw:${g.sz.dCw}px">${hs}${badge}</div>`;
}
function seatNote(p){
  if(!p.connected) return 'away';
  if(S.phase === 'betting') return p.ready ? '' : (p.chips < MIN_BET && !p.bet ? 'broke' : 'betting...');
  if(S.phase === 'lobby') return '';
  if(!p.inRound) return S.phase === 'results' ? '' : 'next hand';
  return '';
}
function resultTag(p){
  const d = p.mainDelta ?? p.delta;
  switch(p.result){
    case 'bj': return `<div class="rtag bj">BLACKJACK +${fmt(d)}</div>`;
    case 'win33': return `<div class="rtag win33">33! +${fmt(d)}</div>`;
    case 'win': return `<div class="rtag win">WIN +${fmt(d)}</div>`;
    case 'push': return `<div class="rtag push">PUSH</div>`;
    case 'lose': return `<div class="rtag lose">${p.status === 'bust' ? 'BUST' : 'LOST'} -${fmt(-d)}</div>`;
  }
  return '';
}
// one side-bet circle (Perfect Pairs or 21+3)
function sideSpot(p, k, mine, openB){
  const amt = (p.bets || {})[k] || 0, res = p.side && p.side[k];
  let inner = '', tag = '';
  if(amt){
    if(res && S.phase !== 'betting'){
      const L = late(p.hand.slice(0, 2).concat(S.dealer.hand.slice(0, 1)));
      if(res.net > 0){
        inner = chipStack(amt, false).replace(/<span class="amt">.*<\/span>$/, '');
        tag = `<span class="amt b sw${L.c}"${L.s} title="${esc(res.name)}">+${fmt(res.net)}</span>`;
      } else if(L.c) tag = `<div class="gone"${L.s}>${chipStack(amt, mine)}</div>`;
    } else inner = chipStack(amt, mine);
  }
  const lbl = k === 'pp' ? (mine ? 'PERFECT<br>PAIRS' : 'PP') : '21+3';
  const tagName = mine && openB ? 'button' : 'div';
  return `<${tagName} class="bspot s-${k}${openB ? ' open' : ''}"${mine && openB ? ` data-act="rk" data-k="${k}" aria-label="Bet on ${k === 'pp' ? 'Perfect Pairs' : '21+3'}"` : ''}>${inner ? '' : `<span class="sl">${lbl}</span>`}${inner}${tag}</${tagName}>`;
}
function seatHTML(p, pos, mine){
  const panel = !pos, self = !mine && p.id === MY_ID;
  const sz = GEO.sz, cw = mine ? sz.myCw : sz.oCw, mini = !mine && cw < 44, compact = !mine && GEO.phone;
  const cr = mine ? sz.cr : sz.ocr;
  const isTurn = S.phase === 'playing' && S.turn === p.id;
  const cards = p.inRound && p.hand.length > 0;
  const handStr = cards ? handHTML(p.hand, mini, p.doubled ? 2 : -1) : '';
  let tb = '';
  if(cards){
    const L = late(p.hand);
    if(p.status === 'blackjack') tb = `<span class="tb bj${L.c}"${L.s}>BJ</span>`;
    else if(p.total == null) tb = `<span class="tb${L.c}"${L.s}>?</span>`;
    else tb = `<span class="tb${L.c}${p.status === 'bust' ? ' bust' : ''}${p.total === S.settings.target && S.settings.target === 33 ? ' t33' : ''}"${L.s}>${p.status === 'bust' ? 'BUST' : p.total}</span>`;
    if(compact && S.phase === 'results'){
      const r = p.result, d = p.delta;
      tb = r === 'bj' ? '<span class="tb bj">BJ</span>' : r === 'win33' ? '<span class="tb t33">33!</span>' : d > 0 ? `<span class="tb rw">+${short(d)}</span>` : d === 0 ? '<span class="tb rp">PUSH</span>' : `<span class="tb rl">${p.status === 'bust' ? 'BUST' : '-' + short(-d)}</span>`;
    }
  }
  const c = p.curse && CURSES[p.curse], pc = p.pendingCurse && CURSES[p.pendingCurse];
  const curseB = c ? `<div class="cb" title="${esc(c.desc)}">${c.name}</div>` : (pc ? `<div class="cb pend" title="${esc(pc.desc)}">NEXT: ${pc.name}</div>` : '');
  const note = mine && S.phase === 'betting' ? '' : seatNote(p);
  const openB = mine && S.phase === 'betting' && !p.ready && (p.chips > 0);
  const mainAmt = (p.bets && p.bets.main) || 0;
  const showMain = (S.phase === 'betting' ? mainAmt : (p.inRound ? (p.main || mainAmt) : 0));
  const ring = isTurn ? '<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" pathLength="100" data-ring="turn"/></svg>' : '';
  const mainTag = mine && openB ? 'button' : 'div';
  const main = `<${mainTag} class="spot${openB ? ' open' : ''}"${mine && openB ? ' data-act="rk" data-k="main" aria-label="Main bet"' : ''}>${showMain ? chipStack(showMain, mine) : (mine ? '<span class="sl">BET</span>' : '')}${ring}</${mainTag}>`;
  let spots;
  if(mine) spots = `<div class="spots">${sideSpot(p, 'pp', true, openB)}${main}${sideSpot(p, 'p21', true, openB)}</div>`;
  else {
    const sides = ['pp','p21'].filter(k => (p.bets || {})[k] && (S.phase === 'betting' || p.inRound));
    spots = `<div class="spots">${main}${sides.map(k => `<i class="sdot sd-${k}" title="${k === 'pp' ? 'Perfect Pairs' : '21+3'} ${fmt(p.bets[k])}" style="--c:${chipColor(p.bets[k])}"></i>`).join('')}</div>`;
  }
  const below = sz.ph + cr + 5 + (mine ? 13 : 0);
  const place = panel ? `--cw:${cw}px;--cr:${cr}px;--sr:${sz.sr}px;--ph:${sz.ph}px` : `left:${pos.x.toFixed(1)}px;top:${pos.y.toFixed(1)}px;--cw:${cw}px;--cr:${cr}px;--sr:${sz.sr}px;--ph:${sz.ph}px;transform:translate(-50%,calc(-100% + ${below}px))`;
  const plaque = panel ? '' : compact
    ? `<div class="plaque sm"><b>${self ? 'YOU' : esc(p.name)}</b><span>${short(p.chips)}</span></div>`
    : `<div class="plaque"><b>${esc(p.name)}${p.id === S.hostId ? '<i class="host">HOST</i>' : ''}</b><span>${fmt(p.chips)}</span></div>`;
  return `<div class="seat${mine ? ' me' : ''}${panel ? ' zoom' : ''}${self ? ' self' : ''}${compact ? ' cpt' : ''}${isTurn ? ' turn' : ''}${!p.connected ? ' away' : ''}" style="${place}">
    ${S.phase === 'results' && p.inRound && !compact ? resultTag(p) : ''}
    <div class="sh">${cards ? handStr : (note && !panel ? `<div class="snote">${note}</div>` : '')}${tb}</div>
    ${spots}
    ${plaque}
    ${compact || panel ? '' : curseB}
  </div>`;
}
function renderBlackjack(me){
  const ps = S.players, i = ps.findIndex(p => p.id === MY_ID);
  const rest = i >= 0 ? ps.slice(i + 1).concat(ps.slice(0, i)) : ps.slice();
  const L = Math.ceil(rest.length/2), left = rest.slice(0, L), right = rest.slice(L).reverse();
  let html = dealerSpotHTML();
  if(me) html += seatHTML(me, GEO.seat(0, 0), !GEO.phone);
  const pn = $('#myPanel');
  if(pn) pn.innerHTML = me ? seatHTML(me, null, true) : '';
  left.forEach((p,k) => { html += seatHTML(p, GEO.seat(-1, k), false); });
  right.forEach((p,k) => { html += seatHTML(p, GEO.seat(1, k), false); });
  $('#dyn').innerHTML = html;
}

function rlSideHTML(){

  else if(S.phase === 'spinning') disc = `<div class="rlres">?</div>`;
  else disc = rl.history.length ? `<div class="rlres ${rlColor(rl.history[0])}" style="opacity:.7">${rl.history[0]}</div>` : `<div class="rlres">&ndash;</div>`;
  const hist = rl.history.slice(0, 12).map(n => `<i class="${rlColor(n)}">${n}</i>`).join('');

function boardHTML(vert){
  const {tot, mine} = betTotals();
  const res = S.phase === 'results' && S.rl && S.rl.result != null ? S.rl.result : null;
  const cell = (k, label, area, cls) => {
    const t = tot[k], win = res != null && rlCovers(k, res);
    return `<button class="rc ${cls}${win ? (k[0] === 'n' ? ' win' : ' cover') : ''}" data-act="rk" data-k="${k}" style="grid-area:${area}">${label}${t ? `<span class="mk${mine[k] ? ' mine' : ''}" style="--c:${chipColor(t)}">${short(t)}</span>` : ''}</button>`;
  };
  const outs = [['low','1 to 18'],['even','EVEN'],['red','<i class="dia red"></i>'],['black','<i class="dia black"></i>'],['odd','ODD'],['high','19 to 36']];
  const dz = ['1st 12','2nd 12','3rd 12'];
  let h = '';
  if(!vert){
    h += cell('n0', '0', '1/1/4/2', 'green');
    for(let j=0;j<12;j++) for(let r=0;r<3;r++){ const num = 3*(j+1) - r; h += cell('n'+num, num, `${r+1}/${j+2}/${r+2}/${j+3}`, rlColor(num)); }
    ['c3','c2','c1'].forEach((k,r) => { h += cell(k, '2 to 1', `${r+1}/14/${r+2}/15`, 'out'); });
    ['d1','d2','d3'].forEach((k,i) => { h += cell(k, dz[i], `4/${2+4*i}/5/${6+4*i}`, 'out'); });
    outs.forEach(([k,l],i) => { h += cell(k, l, `5/${2+2*i}/6/${4+2*i}`, 'out'); });
  } else {
    h += cell('n0', '0', '1/3/2/6', 'green');
    for(let r=0;r<12;r++) for(let c=0;c<3;c++){ const num = 3*r + c + 1; h += cell('n'+num, num, `${r+2}/${c+3}/${r+3}/${c+4}`, rlColor(num)); }
    ['c1','c2','c3'].forEach((k,c) => { h += cell(k, '2:1', `14/${c+3}/15/${c+4}`, 'out'); });
    ['d1','d2','d3'].forEach((k,i) => { h += cell(k, `<span>${dz[i]}</span>`, `${2+4*i}/2/${6+4*i}/3`, 'out vt'); });
    outs.forEach(([k,l],i) => { h += cell(k, k === 'red' || k === 'black' ? l : `<span>${l}</span>`, `${2+2*i}/1/${4+2*i}/2`, 'out vt'); });
  }
  return h;
}
function pstripHTML(){
  return S.players.map(p => {
    let em = '';
    if(S.phase === 'betting') em = p.bet ? `<em>BET ${fmt(p.bet)}</em>` : `<em>${p.ready ? 'SITTING OUT' : 'BETTING...'}</em>`;
    else if(S.phase === 'results' && p.inRound) em = p.delta > 0 ? `<em class="win">WON +${fmt(p.delta)}</em>` : p.delta < 0 ? `<em class="lose">LOST ${fmt(-p.delta)}</em>` : '<em>PUSH</em>';
    else if(p.inRound) em = `<em>BET ${fmt(p.bet)}</em>`;
    const c = p.curse && CURSES[p.curse];
    return `<div class="pp${p.id === MY_ID ? ' me' : ''}${!p.connected ? ' away' : ''}">${S.phase === 'betting' && p.ready ? '<i class="ok">&#10003;</i>' : ''}<b>${esc(p.name)}</b><span>${fmt(p.chips)}</span>${em}${c ? `<em class="lose" title="${esc(c.desc)}">${c.name}</em>` : ''}</div>`;

}

function bettingHTML(me){

    <div class="betbar">${chipTray(me)}<div class="rbs">${rbtn('undo', 'undo', IC.undo, 'UNDO', !has)}${rbtn('clearbets', 'clr', IC.clear, 'CLEAR', !has)}${rebetBtn}${goBtn}</div></div>

function sideSummary(me){
  if(!me.side) return '';
  const parts = Object.entries(me.side).map(([k, r]) => `${k === 'pp' ? 'Perfect Pairs' : '21+3'} ${r.net > 0 ? `<b class="g">${esc(r.name)} +${fmt(r.net)}</b>` : `<b class="r">-${fmt(-r.net)}</b>`}`);
  return parts.length ? `<div class="msg sm">${parts.join(' &middot; ')}</div>` : '';
}
function bjControls(me){
  const sitOut = `<div class="msg">You're sitting this hand out. You're in next hand.</div>`;
  switch(S.phase){
    case 'betting': {
      if(me.ready) return `<div class="msg">You're in for <b>${fmt(me.bet)}</b>. Waiting for ${waitingNames()}...</div>${timerBar('phase')}`;
      if(me.chips < MIN_BET && !me.bet) return begHTML();
      return bettingHTML(me);
    }
    case 'peek': {
      if(!me.inRound) return sitOut;
      const L = late(me.hand);
      return (me.status === 'blackjack' ? `<div class="result bj${L.c}"${L.s}>BLACKJACK!</div>` : '') + `<div class="msg">Myla is checking for blackjack...</div>`;
    }
    case 'playing': {
      if(!me.inRound) return sitOut;
      const L = late(me.hand);
      if(me.status === 'blackjack') return `<div class="result bj${L.c}"${L.s}>BLACKJACK!</div><div class="msg">Waiting for the others...</div>`;
      if(S.turn === MY_ID && me.status === 'playing'){
        const canDbl = me.hand.length === 2 && me.hits === 0 && me.chips >= me.main;
        const chicken = me.curse === 'nochicken' && me.hits === 0;
        return `${chicken ? '<div class="note">NO CHICKENS: you have to hit before you can stand.</div>' : ''}
          ${me.curse === 'blind' ? '<div class="note">BLINDFOLDED: ask your friends what you have...</div>' : ''}
          <div class="acts" id="actRow">${rbtn('double', 'dbl', '<b>2&times;</b>', 'DOUBLE', !canDbl)}${rbtn('hit', 'hit', IC.plus, 'HIT', false)}${rbtn('stand', 'stand', IC.minus, 'STAND', false)}</div>
          <div class="msg">You have <b>${me.total ?? '?'}</b>. Your move.</div>
          ${timerBar('turn')}`;
      }
      if(me.status === 'bust') return `<div class="msg">Busted. Myla thanks you for your donation.</div>`;
      if(me.status === 'stand') return `<div class="msg">You stand on <b>${me.total ?? '?'}</b>. Waiting for <b>${turnName()}</b>...</div>`;
      return `<div class="msg">Waiting for <b>${turnName()}</b>...</div>`;
    }
    case 'dealer': return me.inRound ? `<div class="msg">Myla is playing her hand...</div>` : sitOut;
    case 'results': {
      if(!me.inRound) return `<div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
      const md = me.mainDelta ?? me.delta;
      let txt, cls = me.result;
      if(me.result === 'bj') txt = `BLACKJACK! +${fmt(md)}`;
      else if(me.result === 'win33') txt = `THIRTY-THREE! +${fmt(md)}`;
      else if(me.result === 'win') txt = `YOU WIN +${fmt(md)}`;
      else if(me.result === 'push') txt = 'PUSH &middot; BET BACK';
      else txt = `${me.status === 'bust' ? 'BUSTED' : S.dealer.bj ? 'DEALER BLACKJACK' : 'YOU LOST'} -${fmt(-md)}`;
      const net = me.side && Object.keys(me.side).length ? `<div class="msg">Total this hand: <b class="${me.delta > 0 ? 'g' : me.delta < 0 ? 'r' : ''}">${me.delta > 0 ? '+' : me.delta < 0 ? '-' : ''}${fmt(Math.abs(me.delta))}</b></div>` : '';
      return `<div class="result ${cls}">${txt}</div>${sideSummary(me)}${net}<div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
    }
  }
  return '';
}
function multiControls(me){
  const g = S.settings.game;
  switch(S.phase){
    case 'betting': {
      if(me.ready) return `<div class="msg">${me.bet ? `You're in for <b>${fmt(me.bet)}</b>.` : 'Sitting this one out.'} Waiting for ${waitingNames()}...</div>${timerBar('phase')}`;
      if(me.chips < MIN_BET && !me.bet) return begHTML();
      return bettingHTML(me);
    }
    case 'spinning': return `<div class="msg">No more bets! The ball is rolling...</div>`;
    case 'dealing': return `<div class="msg">Myla is dealing...</div>`;
    case 'results': {
      let head = '';
      if(g === 'roulette' && S.rl && S.rl.result != null){ const n = S.rl.result; head = `<div class="msg"><b>${n} ${rlColor(n).toUpperCase()}</b></div>`; }
      if(g === 'baccarat' && S.bac && S.bac.winner){ head = `<div class="msg"><b>${S.bac.winner === 'P' ? 'PLAYER WINS' : S.bac.winner === 'B' ? 'BANKER WINS' : 'TIE'}</b></div>`; }
      if(!me.inRound) return head + `<div class="msg">Next round in <b data-count="phase"></b>...</div>`;
      const r = me.delta > 0 ? `<div class="result win">YOU WIN +${fmt(me.delta)}</div>` : me.delta < 0 ? `<div class="result lose">YOU LOST -${fmt(-me.delta)}</div>` : `<div class="result push">PUSH &middot; BETS BACK</div>`;
      return head + r + `<div class="msg">Next round in <b data-count="phase"></b>...</div>`;
    }
  }
  return '';
}

function rulesText(){
  const st = S.settings;
  let t;
  if(st.game === 'blackjack'){
    t = `Get closer to <b>${st.target}</b> than Myla without going over. Everyone gets 2 cards; Myla's second card stays face-down until everyone's done (she peeks for blackjack when she shows an Ace or a 10).<br><br>An Ace + a 10/J/Q/K as your first two cards is a <b>Blackjack</b> and pays 3:2. Myla stands on <b>${st.target === 21 ? 17 : 29}</b>.${st.target === 33 ? ' Hitting exactly 33 pays 2:1.' : ''} Double = double your main bet and take exactly one more card.<br><br><b>Side bets</b> (optional, need a main bet): <b>Perfect Pairs</b> wins if your first two cards are a pair: mixed colors 6:1, same color 12:1, same suit 25:1. <b>21+3</b> uses your two cards + Myla's face-up card as a poker hand: flush 5:1, straight 10:1, three of a kind 30:1, straight flush 40:1, suited trips 100:1.`;
  } else if(st.game === 'roulette'){
    t = `Pick a chip, then tap the layout to bet (as many spots as you like). A single number pays <b>35:1</b>. Red/Black, Odd/Even, 1-18/19-36 pay <b>1:1</b>. Dozens and columns pay <b>2:1</b>. Green zero beats every outside bet.`;
  } else if(st.game === 'buckshot'){
    t = `Put down a stake and face <b>The Dealer</b>. The shotgun is loaded with a mix of <b class="r">LIVE</b> and <b>BLANK</b> shells. You see how many of each, but not the order.<br><br>On your turn, shoot <b>The Dealer</b> or <b>yourself</b>. A blank on yourself gives you another turn. The Dealer takes a turn after each player. Run out of lives and you're down for the round.<br><br><b>Items:</b> Magnifying Glass (peek at the chambered shell), Hand Saw (next shot does 2 damage), Beer (eject the chambered shell), Handcuffs (The Dealer skips his next turn).<br><br>Beat The Dealer in all <b>3 rounds</b>: survivors are paid <b>${BS_PAYS} to 1</b>, fallen teammates get their stake back. If everyone goes down, The Dealer keeps it all.`;
  } else if(st.game === 'imposter'){
    t = `Everyone gets the same <b>secret word</b>, except one player: the <b>imposter</b>, who ${st.impHint ? 'only gets the category as a hint' : 'gets nothing at all'}.<br><br>Take turns giving <b>one-word clues</b> about the word (two rounds). Don't make it too obvious, or the imposter will figure it out! The imposter has to bluff a clue that fits.<br><br>Then everyone <b>votes</b>. Catch the imposter and the crew wins ${IMP_CREW_PAY} chips each, unless the imposter then guesses the secret word. If the imposter escapes (or a tie), they win ${IMP_IMP_PAY} chips. Free to play, ${IMP_MIN}+ players.`;
  } else {
    t = `Bet on <b>Player</b>, <b>Banker</b>, or <b>Tie</b>. The hand closest to 9 wins (A = 1, 2-9 face value, 10/J/Q/K = 0, only the last digit counts). Player pays 1:1, Banker pays 0.95:1, Tie pays 8:1 (Player and Banker bets get their money back on a tie). Pairs pay 11:1. Myla follows the standard third-card rules.`;
  }
  return t + (st.doom ? '<br><br><b>Wheel of Doom is ON:</b> lose and something crazy happens to you.' : '<br><br>Wheel of Doom is off. Just the normal game.');
}

  ensureSkeleton();
  $('#stage').classList.toggle('lobbymode', S.phase === 'lobby');
  applyCurseFx(me);
  prepareCardMeta();
  $('#hdr').innerHTML = headerHTML();
  updateMyla();
  const g = S.settings.game;
  if(g === 'blackjack') renderBlackjack(me);
  else if(g === 'roulette') renderRoulette();
  else if(g === 'buckshot') renderBuckshot(me);
  else if(g === 'imposter') renderImposter(me);
  else renderBaccarat();
  // only touch the console when it actually changed (keeps typed text and focus)
  const ch = consoleHTML(me), cons = $('#cons');
  if(ch !== lastConsole || !cons.firstChild){
    const inp = $('#impIn'), val = inp ? inp.value : null, foc = inp && document.activeElement === inp;
    cons.innerHTML = ch; lastConsole = ch;
    const ni = $('#impIn'); if(ni && val !== null){ ni.value = val; if(foc) ni.focus(); }
    else if(ni && !matchMedia('(pointer:coarse)').matches) ni.focus();
  }
  runAnims();
  applyButtonChaos(!!(me && me.curse === 'buttons' && S.phase === 'playing' && S.turn === MY_ID));
  if(modalKind === 'settings'){ const b = $('#setBody'); if(b) b.innerHTML = settingsBody(); }
}
// timer bars, countdowns and turn rings, updated every frame without re-rendering
function timerLoop(){
  if(S && screen === 'table'){
    const now = performance.now();
    document.querySelectorAll('[data-timer]').forEach(el => {
      const turn = el.dataset.timer === 'turn';
      const left = Math.max(0, (turn ? S._turnEnd : S._phaseEnd) - now);
      const total = Math.max(1, turn ? S.turnTotal : S.phaseTotal);
      el.style.width = Math.min(100, 100*left/total) + '%';
      el.classList.toggle('low', left < 5000);
    });
    document.querySelectorAll('[data-ring]').forEach(el => {
      const turn = el.dataset.ring === 'turn';
      const left = Math.max(0, (turn ? S._turnEnd : S._phaseEnd) - now), total = Math.max(1, turn ? S.turnTotal : S.phaseTotal);
      el.style.strokeDashoffset = String(100 - Math.min(100, 100*left/total));
      el.classList.toggle('low', left < 5000);
    });
    document.querySelectorAll('[data-count]').forEach(el => { el.textContent = Math.ceil(Math.max(0, S._phaseEnd - now)/1000); });
    const m = document.querySelector('.mylaBig');
    if(m){ const t = now - sayAt < 1800; if(m.classList.contains('talking') !== t) m.classList.toggle('talking', t); }
  }
  requestAnimationFrame(timerLoop);
}
requestAnimationFrame(timerLoop);
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(S) render(); }, 150); });
/* =====================================================================
   INPUT
   ===================================================================== */
function onAct(e){
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled || !S) return;
  if(SFX.on) actx();
  act(b.dataset.act, b);
}
$('#stage').addEventListener('click', onAct);
$('#stage').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target && e.target.id === 'impIn'){ const btn = document.querySelector('[data-act="impclue"],[data-act="impguess"]'); if(btn) btn.click(); } });
$('#modal').addEventListener('click', e => { if(e.target.closest('[data-act]') && S) onAct(e); });
function act(a, b){
  const me = S.players.find(p => p.id === MY_ID);
  const v = b.dataset.v;
  switch(a){
    case 'sel': selChip = Number(v); store.set('chip', selChip); sfx('chip'); render(); break;
    case 'rebet': send({t:'rebet'}); sfx('chip'); break;
    case 'x2': send({t:'x2'}); sfx('chip'); break;
    case 'rk':
      if(!me || S.phase !== 'betting') return;
      if(me.ready){ toast('Your bets are locked in for this round.'); return; }
      if(me.chips <= 0){ toast("You're out of chips."); return; }
      send({t:'chip', k:b.dataset.k, amt:selChip}); sfx('chip'); b.classList.remove('tap'); void b.offsetWidth; b.classList.add('tap'); break;
    case 'undo': send({t:'undo'}); break;
    case 'bsshoot': { const now = Date.now(); if(now - lastActAt < 400) return; lastActAt = now; send({t:'bs', a:'shoot', who:b.dataset.who}); break; }
    case 'bsitem': { const now = Date.now(); if(now - lastActAt < 300) return; lastActAt = now; send({t:'bs', a:'item', i:+b.dataset.i}); sfx('item'); break; }
    case 'impclue': case 'impguess': { const el = $('#impIn'); const v = el ? el.value.trim() : ''; if(!v){ if(el) el.focus(); return; } send({t:'imp', a:a === 'impclue' ? 'clue' : 'guess', text:v}); el.value = ''; break; }
    case 'impvote': send({t:'imp', a:'vote', target:b.dataset.pid}); sfx('chip'); break;
    case 'imphide': impHide = !impHide; render(); break;
    case 'impout': send({t:'done', out:true}); break;
    case 'sethint': send({t:'settings', impHint:v === 'on'}); break;
    case 'clearbets': send({t:'clearbets'}); break;
    case 'done': send({t:'done'}); sfx('chip'); break;
    case 'hit': case 'stand': case 'double': {
      const now = Date.now(); if(now - lastActAt < 280) return; lastActAt = now;
      send({t:'act', a}); break;
    }
    case 'beg': send({t:'beg'}); break;
    case 'start': send({t:'start'}); break;
    case 'invite': invite(); break;
    case 'settings': openSettings(); break;
    case 'rules': openRules(); break;
    case 'closemodal': closeModal(); break;
    case 'setgame': send({t:'settings', game:v}); break;
    case 'settarget': send({t:'settings', target:Number(v)}); break;
    case 'setdoom': send({t:'settings', doom:v === 'on'}); break;
    case 'sound': SFX.on = !SFX.on; store.set('sound', SFX.on); if(!SFX.on && 'speechSynthesis' in window) speechSynthesis.cancel(); render(); break;
    case 'leave':
      dialog({title:'Leave the table?', danger:true, ok:'Leave', cancel:'Stay',
        text: isHost ? "You're the host. Leaving closes the table for everyone." : "Your chips are saved if you rejoin from this same browser tab.",
        onOk: leaveTable});
      break;
  }
}
async function invite(){
  if(!S) return;
  const link = location.origin + location.pathname + '?room=' + S.code;
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(navigator.share && touch){
    try{ await navigator.share({title:"Myla's Table", text:`Join my table! Code: ${S.code}`, url:link}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(link); toast('Invite link copied. Send it to your friends!'); }
  catch(e){ toast(`Table code: ${S.code}. Link: ${link}`); }
}

/* =====================================================================
   NETWORK (PeerJS, peer-to-peer; the host's browser runs the game)
   ===================================================================== */
let peer = null, hostConn = null, isHost = false, joinCode = null, myName = '';
let lastHostMsg = 0, pingTimer = null, joinTimer = null, lostShown = false;

function peerReady(){
  return new Promise((res, rej) => {
    if(window.Peer) return res();
    let n = 0;
    const iv = setInterval(() => { if(window.Peer){ clearInterval(iv); res(); } else if(++n > 120){ clearInterval(iv); rej(new Error('lib')); } }, 100);
  });
}
function netErrText(err){
  const t = err && err.type;
  if(t === 'peer-unavailable') return "No table found with that code. Check the code, and make sure the host still has the game open.";
  if(t === 'browser-incompatible') return "This browser can't do online play. Try Chrome, Safari, or Firefox.";
  if(['network','server-error','socket-error','socket-closed','disconnected'].includes(t)) return "Couldn't reach the game server. Check your internet and try again.";
  return 'Connection problem' + (t ? ` (${t})` : '') + '. Try again.';
}
function send(msg){
  if(isHost){ if(G) hostHandle(MY_ID, msg); return; }
  if(hostConn && hostConn.open){ try{ hostConn.send(msg); }catch(e){} }
  else if(S && !lostShown) showLost();
}
function setRoomURL(code){ try{ history.replaceState(null, '', location.pathname + (code ? '?room=' + code : '')); }catch(e){} }

/* ---------- hosting ---------- */
async function createTable(){
  const name = readName(); if(!name) return;
  setHomeBusy('Setting up your table...');
  try{ await peerReady(); }catch(e){ return homeError("Couldn't load the online-play library. Check your internet and reload the page."); }
  myName = name;
  let attempts = 0;
  const attempt = () => {
    const code = Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join('');
    const p = new Peer(PREFIX + code, {debug:0});
    peer = p;
    p.on('open', () => {
      if(peer !== p) return;
      isHost = true; G = newGame(code);
      setRoomURL(code);
      handleJoin({id:MY_ID, name}, null);
      startHostLoop();
    });
    p.on('connection', conn => setupHostConn(conn));
    p.on('error', err => {
      if(peer !== p) return;
      if(err && err.type === 'unavailable-id' && attempts++ < 4){ try{ p.destroy(); }catch(e){} attempt(); return; }
      if(!G) homeError(netErrText(err));
      else console.warn('peer error', err);
    });
    p.on('disconnected', () => {
      setTimeout(() => { try{ if(peer === p && !p.destroyed && p.disconnected) p.reconnect(); }catch(e){} }, 1500);
    });
  };
  attempt();
}
function setupHostConn(conn){
  conn.on('data', msg => {
    if(!G || !msg || typeof msg !== 'object') return;
    if(msg.t === 'join'){ handleJoin(msg, conn); return; }
    if(conn.clientId && conns.get(conn.clientId) === conn) hostHandle(conn.clientId, msg);
  });
  conn.on('close', () => {
    if(!G || !conn.clientId || conns.get(conn.clientId) !== conn) return;
    conns.delete(conn.clientId);
    const p = P(conn.clientId);
    if(p && p.connected){ markAway(p); broadcast(); }
  });
  conn.on('error', () => {});
}

/* ---------- joining ---------- */
async function joinTable(code){
  const name = readName(); if(!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 5) return showHomeMsg('Table codes are 5 characters long.');
  setHomeBusy(`Joining table ${code}...`);
  try{ await peerReady(); }catch(e){ return homeError("Couldn't load the online-play library. Check your internet and reload the page."); }
  joinCode = code; myName = name; isHost = false;
  startClientPeer();
}
function startClientPeer(){
  const p = new Peer({debug:0});
  peer = p;
  p.on('open', () => { if(peer === p) connectToHost(); });
  p.on('error', err => {
    if(peer !== p) return;
    if(S){ if(err && err.type === 'peer-unavailable') showLost('Myla can\'t find the table anymore. The host may have closed it or lost connection.'); return; }
    homeError(netErrText(err));
  });
  p.on('disconnected', () => {
    setTimeout(() => { try{ if(peer === p && !p.destroyed && p.disconnected) p.reconnect(); }catch(e){} }, 1500);
  });
}
function connectToHost(){
  clearTimeout(joinTimer);
  if(hostConn){ const old = hostConn; hostConn = null; try{ old.close(); }catch(e){} }
  const c = peer.connect(PREFIX + joinCode, {reliable:true, serialization:'json'});
  hostConn = c;
  c.on('open', () => {
    if(hostConn !== c) return;
    lastHostMsg = Date.now();
    c.send({t:'join', id:MY_ID, name:myName});
    startPing();
  });
  c.on('data', msg => {
    if(hostConn !== c || !msg) return;
    lastHostMsg = Date.now();
    if(msg.t === 'state'){ clearTimeout(joinTimer); if(lostShown) hideLost(); onState(msg.s); }
    else if(msg.t === 'reject'){ homeError(msg.reason || 'The host turned you away.'); }
    else if(msg.t === 'closed'){ leaveLocal(); renderHome('The host closed the table. Thanks for playing!', true); }
  });
  c.on('close', () => { if(hostConn === c && S && !lostShown) showLost(); });
  c.on('error', () => {});
  joinTimer = setTimeout(() => {
    if(!S) homeError("Couldn't connect to that table. Check the code, or try a different Wi-Fi/cell network.");
    else if(!lostShown) showLost();
  }, 15000);
}
function startPing(){
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if(hostConn && hostConn.open){ try{ hostConn.send({t:'ping'}); }catch(e){} }
    if(S && !isHost && !lostShown && Date.now() - lastHostMsg > 15000) showLost();
  }, 3000);
}
function showLost(msg){
  lostShown = true;
  dialog({kind:'lost', title:'Connection lost', ok:'Reconnect', cancel:'Leave',
    text: msg || "Lost connection to the table. This happens when the host's screen locks or someone's Wi-Fi drops.",
    onOk: reconnect, onCancel: () => { leaveLocal(); renderHome(); }});
}
function hideLost(){ lostShown = false; if(modalKind === 'lost') closeModal(); }
function reconnect(){
  lostShown = false; lastHostMsg = Date.now();
  if(peer && !peer.destroyed && peer.open) connectToHost();
  else { try{ peer && peer.destroy(); }catch(e){} startClientPeer(); }
}

/* ---------- leaving ---------- */
function leaveLocal(keepURL){
  clearInterval(pingTimer); clearTimeout(joinTimer); clearInterval(hostTimer); clearInterval(chaosTimer);
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
  const p = peer; peer = null; hostConn = null;
  if(p) setTimeout(() => { try{ p.destroy(); }catch(e){} }, 300);
  conns.clear(); G = null; S = null; isHost = false; lostShown = false; joinCode = null;
  closeModal(); if(!keepURL) setRoomURL(null);
  $('#stage').className = ''; document.body.classList.remove('fx-blackout');
}
function leaveTable(){
  if(!isHost && hostConn && hostConn.open){ try{ hostConn.send({t:'leave'}); }catch(e){} }
  leaveLocal(); renderHome();
}
window.addEventListener('beforeunload', () => {
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
});

/* =====================================================================
   HOME SCREEN
   ===================================================================== */
function renderHome(msg, info){
  screen = 'home'; document.body.classList.remove('horror'); try{ horrorDrone(false); }catch(e){}
  $('#stage').className = ''; document.body.classList.remove('fx-blackout');
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0,5);
  const name = store.get('name', '');
  $('#stage').innerHTML = `<div class="home">
    <div class="hstudio">${studioSVG(440, 150)}<div class="mylaStand" style="--mx:50%;height:146px;width:117px">${MYLA_BIG()}</div><div class="hrim"><span>BLACKJACK PAYS 3 TO 2</span></div></div>
    <div class="logo"><span class="n">33</span><span class="w">BLACKJACK</span><span class="s">ROULETTE &middot; BACCARAT &middot; BUCKSHOT &middot; IMPOSTER</span></div>
    <p class="tag">Myla's casino for you and your friends: blackjack to 33 (or 21), roulette, baccarat, the Imposter party game... and Buckshot, if you dare.</p>
    <div class="panel">
      <div class="field"><label for="nameIn">Your name</label><input id="nameIn" class="inp" maxlength="14" autocomplete="off" spellcheck="false" value="${esc(name)}" placeholder="Your name"></div>
      ${room
        ? `<button class="btn xl" id="joinLinkBtn">Join table ${esc(room)}</button><div class="or">or</div><button class="btn ghost" id="createBtn">Start my own table</button>`
        : `<button class="btn xl" id="createBtn">Create a table</button><div class="or">or join friends</div><div class="joinrow"><input id="codeIn" class="inp code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn ghost" id="joinBtn">Join</button></div>`}
      <div class="err${info ? ' info' : ''}" id="homeMsg">${esc(msg || '')}</div>
    </div>
    <details class="rules"><summary>How to play</summary><ul>
      <li>Everyone plays against <b>Myla</b>, the dealer. In <b>Blackjack 33</b> you try to get closer to 33 than her without going over (she stands on 29). <b>Blackjack 21</b> is the classic game (she stands on 17).</li>
      <li>Everybody gets <b>2 cards</b>. Myla's second card stays face-down until everyone is done. An Ace + a 10/J/Q/K is a <b>Blackjack</b> and pays 3:2.</li>
      <li><b>Hit</b> to take a card, <b>Stand</b> to stop, <b>Double</b> to double your bet and take exactly one more card. In 33 mode, hitting <b>exactly 33 pays 2:1</b>.</li>
      <li>Optional side bets: <b>Perfect Pairs</b> (your first two cards are a pair, up to 25:1) and <b>21+3</b> (your two cards + Myla's up card make a poker hand, up to 100:1).</li>
      <li>The host can switch the table to <b>Roulette</b>, <b>Baccarat</b>, <b>Buckshot</b> (a shotgun showdown with The Dealer) or <b>Imposter</b> (find the friend who doesn't know the secret word). Your chips come with you.</li>
      <li>With the <b>Wheel of Doom</b> on, losing means something crazy happens: taxes, earthquakes, upside-down screens, cursed aces, embarrassing new names... Turn it off for a normal game.</li>
      <li>You start with <b>1,000 chips</b>. Go broke? You can beg Myla for more. Everyone will know.</li>
      <li>Whoever creates the table is the host. Share the code or invite link, and keep the host's tab open.</li>
    </ul></details>
  </div>`;
  const createBtn = $('#createBtn'), joinBtn = $('#joinBtn'), joinLinkBtn = $('#joinLinkBtn'), codeIn = $('#codeIn'), nameIn = $('#nameIn');
  createBtn.onclick = () => { if(SFX.on) actx(); createTable(); };
  if(joinBtn) joinBtn.onclick = () => { if(SFX.on) actx(); joinTable(codeIn.value); };
  if(joinLinkBtn) joinLinkBtn.onclick = () => { if(SFX.on) actx(); joinTable(room); };
  if(codeIn) codeIn.addEventListener('keydown', e => { if(e.key === 'Enter') joinBtn.click(); });
  nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') (joinLinkBtn || createBtn).click(); });
  if(!name) setTimeout(() => nameIn.focus(), 50);
}
function readName(){
  const el = $('#nameIn'); const v = el ? el.value.replace(/\s+/g, ' ').trim().slice(0,14) : '';
  if(!v){ showHomeMsg('Type your name first.'); if(el) el.focus(); return null; }
  store.set('name', v); return v;
}
function showHomeMsg(m, info){ const el = $('#homeMsg'); if(el){ el.textContent = m; el.classList.toggle('info', !!info); } }
function setHomeBusy(m){
  document.querySelectorAll('.home button, .home input').forEach(b => b.disabled = true);
  showHomeMsg(m, true);
}
function homeError(m){ leaveLocal(true); renderHome(m); }

renderHome();
</script>
