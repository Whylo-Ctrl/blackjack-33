/* =====================================================================
   CONSOLE (your controls)
   ===================================================================== */
const timerBar = kind => `<div class="timer"><i data-timer="${kind}"></i></div>`;
function begHTML(){ return `<div class="msg">You're broke. Myla might take pity on you...</div><button class="btn xl" data-act="beg">Beg Myla for ${BEG_AMOUNT} chips</button>${timerBar('phase')}`; }
function draft(me){
  if(draftRound !== S.round){
    draftRound = S.round;
    draftBet = Math.min(me.lastBet || 50, me.chips);
    if(draftBet < MIN_BET) draftBet = Math.min(MIN_BET, me.chips);
  }
  if(draftBet > me.chips) draftBet = me.chips;
  return draftBet;
}
function bjControls(me){
  const sitOut = `<div class="msg">You're sitting this hand out. You're in next hand.</div>`;
  switch(S.phase){
    case 'betting': {
      if(me.ready) return `<div class="msg">You're in for <b>${fmt(me.bet)}</b>. Waiting for ${waitingNames()}...</div>${timerBar('phase')}`;
      if(me.chips < MIN_BET) return begHTML();
      const d = draft(me);
      return `${me.curse === 'double' ? '<div class="note">DOUBLE TROUBLE: whatever you bet gets doubled.</div>' : ''}
        <div class="betrow">
          <div class="betline">${fmt(d)} <small>YOUR BET</small></div>
          <div class="chips">${[10,25,100,500].map(v => `<button class="chip c${v}" data-act="chip" data-v="${v}" ${me.chips - d < v ? 'disabled' : ''} aria-label="Add ${v}"><span>${v}</span></button>`).join('')}</div>
          <div class="btnrow"><button class="btn ghost sm" data-act="clear">Clear</button><button class="btn ghost sm" data-act="allin">All in</button></div>
          <button class="btn xl" data-act="bet" ${d < MIN_BET ? 'disabled' : ''}>Deal me in</button>
        </div>
        <div class="msg">Betting closes in <b data-count="phase"></b>s</div>${timerBar('phase')}`;
    }
    case 'peek': return me.inRound ? (me.status === 'blackjack' ? `<div class="result bj late"${landDelay(me.hand)}>BLACKJACK!</div>` : '') + `<div class="msg">Myla is checking for blackjack...</div>` : sitOut;
    case 'playing': {
      if(!me.inRound) return sitOut;
      if(me.status === 'blackjack') return `<div class="result bj late"${landDelay(me.hand)}>BLACKJACK!</div><div class="msg">Waiting for the others...</div>`;
      if(S.turn === MY_ID && me.status === 'playing'){
        const canDbl = me.hand.length === 2 && me.hits === 0 && me.chips >= me.bet;
        const chicken = me.curse === 'nochicken' && me.hits === 0;
        return `${chicken ? '<div class="note">NO CHICKENS: you have to hit before you can stand.</div>' : ''}
          ${me.curse === 'blind' ? '<div class="note">BLINDFOLDED: ask your friends what you have...</div>' : ''}
          <div class="btnrow" id="actRow"><button class="btn hit" data-act="hit">Hit</button><button class="btn stand" data-act="stand">Stand</button>${canDbl ? '<button class="btn dbl" data-act="double">Double</button>' : ''}</div>
          ${timerBar('turn')}`;
      }
      if(me.status === 'bust') return `<div class="msg">Busted. Myla thanks you for your donation.</div>`;
      if(me.status === 'stand') return `<div class="msg">You stand on <b>${me.total ?? '?'}</b>. Waiting for <b>${turnName()}</b>...</div>`;
      return `<div class="msg">Waiting for <b>${turnName()}</b>...</div>`;
    }
    case 'dealer': return me.inRound ? `<div class="msg">Myla is playing her hand...</div>` : sitOut;
    case 'results': {
      if(!me.inRound) return `<div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
      let txt;
      if(me.result === 'bj') txt = `BLACKJACK! +${fmt(me.delta)}`;
      else if(me.result === 'win33') txt = `THIRTY-THREE! +${fmt(me.delta)}`;
      else if(me.result === 'win') txt = `YOU WIN +${fmt(me.delta)}`;
      else if(me.result === 'push') txt = 'PUSH &middot; BET BACK';
      else txt = `${me.status === 'bust' ? 'BUSTED' : S.dealer.bj ? 'DEALER BLACKJACK' : 'YOU LOST'} -${fmt(-me.delta)}`;
      return `<div class="result ${me.result}">${txt}</div><div class="msg">Next hand in <b data-count="phase"></b>...</div>`;
    }
  }
  return '';
}
function multiControls(me){
  const g = S.settings.game;
  switch(S.phase){
    case 'betting': {
      if(me.ready) return `<div class="msg">${me.bet ? `You're in for <b>${fmt(me.bet)}</b>.` : 'Sitting this one out.'} Waiting for ${waitingNames()}...</div>${timerBar('phase')}`;
      if(me.chips < MIN_BET && !me.bet) return begHTML();

/* ---------- rules + settings dialogs ---------- */
function rulesText(){
  const st = S.settings;
  let t;
  if(st.game === 'blackjack'){
    t = `Get closer to <b>${st.target}</b> than Myla without going over. Everyone gets 2 cards; Myla's second card stays face-down until everyone's done (she peeks for blackjack when she shows an Ace or a 10).<br><br>An Ace + a 10/J/Q/K as your first two cards is a <b>Blackjack</b> and pays 3:2. Myla stands on <b>${st.target === 21 ? 17 : 29}</b>.${st.target === 33 ? ' Hitting exactly 33 pays 2:1.' : ''} Double = double your bet and take exactly one more card.`;
  } else if(st.game === 'roulette'){
    t = `Pick a chip, then tap the layout to bet (as many spots as you like). A single number pays <b>35:1</b>. Red/Black, Odd/Even, 1-18/19-36 pay <b>1:1</b>. Dozens and columns pay <b>2:1</b>. Green zero beats every outside bet.`;
  } else {
    t = `Bet on <b>Player</b>, <b>Banker</b>, or <b>Tie</b>. The hand closest to 9 wins (A = 1, 2-9 face value, 10/J/Q/K = 0, only the last digit counts). Player pays 1:1, Banker pays 0.95:1, Tie pays 8:1 (Player and Banker bets get their money back on a tie). Pairs pay 11:1. Myla follows the standard third-card rules.`;
  }
  return t + (st.doom ? '<br><br><b>Wheel of Doom is ON:</b> lose and something crazy happens to you.' : '<br><br>Wheel of Doom is off. Just the normal game.');
}
function openRules(){ openModal(`<div class="dlg"><h3>How to play ${S.settings.game === 'blackjack' ? 'Blackjack ' + S.settings.target : GAMES[S.settings.game]}</h3><p>${rulesText()}</p><div class="btnrow"><button class="btn" data-act="closemodal">Got it</button></div></div>`, 'rules'); }
function settingsBody(){
  const isHost = S.hostId === MY_ID, can = isHost && ['lobby','betting','results'].includes(S.phase);
  return settingsHTML(can) + `<p class="hint" style="margin-top:14px;text-align:center">${!isHost ? 'Only the host can change the table.' : can ? 'Changing things during betting gives everyone their chips back and restarts the round.' : 'You can change the game between hands.'}</p>`;
}
function openSettings(){ openModal(`<div class="dlg"><h3>Table settings</h3><div id="setBody">${settingsBody()}</div><div class="btnrow"><button class="btn ghost" data-act="rules">How to play</button><button class="btn" data-act="closemodal">Done</button></div></div>`, 'settings'); }

/* =====================================================================
   MAIN RENDER
   ===================================================================== */
function applyCurseFx(me){
  const st = $('#stage');
  const ac = S && S.phase !== 'lobby' && me ? me.curse : null;
  const fx = ac && CURSES[ac] && CURSES[ac].fx;
  const want = fx && fx !== 'blackout' ? 'fx-' + fx : '';
  for(const cls of [...st.classList]) if(cls.startsWith('fx-') && cls !== want) st.classList.remove(cls);
  if(want) st.classList.add(want);
  document.body.classList.toggle('fx-blackout', fx === 'blackout');
}
function applyButtonChaos(on){
  clearInterval(chaosTimer); chaosTimer = null;
  if(!on) return;
  const go = () => {
    const row = $('#actRow'); if(!row) return;
    shuffle([...row.children]).forEach(k => { row.appendChild(k); k.style.transform = `rotate(${rnd(30)-15}deg) translateY(${rnd(18)-9}px)`; });
  };
  go(); chaosTimer = setInterval(go, 1100);
}
function render(){
  if(!S){ if(screen !== 'home') renderHome(); return; }
  const me = S.players.find(p => p.id === MY_ID);
  ensureSkeleton();
  $('#stage').classList.toggle('lobbymode', S.phase === 'lobby');
  applyCurseFx(me);
  prepareCardMeta();
  $('#hdr').innerHTML = headerHTML();
  $('#dbar').innerHTML = dealerBarHTML();
  const g = S.settings.game;
  if(g === 'blackjack') renderBlackjack(me);
  else if(g === 'roulette') renderRoulette();
  else renderBaccarat();
  $('#cons').innerHTML = consoleHTML(me);
  runAnims();
  const now = performance.now();
  if(now - sayAt < 1800) setTimeout(() => { const l = $('.myla'); if(l) l.classList.remove('talking'); }, 1800 - (now - sayAt));
  applyButtonChaos(!!(me && me.curse === 'buttons' && S.phase === 'playing' && S.turn === MY_ID));
  if(modalKind === 'settings'){ const b = $('#setBody'); if(b) b.innerHTML = settingsBody(); }
}

// timer bars, countdowns and turn rings, updated every frame without re-rendering
function timerLoop(){
  if(S && screen === 'table'){
    const now = performance.now();
    document.querySelectorAll('[data-timer]').forEach(el => {
      const turn = el.dataset.timer === 'turn';
      const left = Math.max(0, (turn ? S._turnEnd : S._phaseEnd) - now);
      const total = Math.max(1, turn ? S.turnTotal : S.phaseTotal);
      el.style.width = Math.min(100, 100*left/total) + '%';
      el.classList.toggle('low', left < 5000);
    });
    document.querySelectorAll('[data-ring]').forEach(el => {
      const left = Math.max(0, S._turnEnd - now), total = Math.max(1, S.turnTotal);
      el.style.strokeDashoffset = String(100 - Math.min(100, 100*left/total));
      el.classList.toggle('low', left < 5000);
    });
    document.querySelectorAll('[data-count]').forEach(el => { el.textContent = Math.ceil(Math.max(0, S._phaseEnd - now)/1000); });
  }
  requestAnimationFrame(timerLoop);
}
requestAnimationFrame(timerLoop);
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(S) render(); }, 150); });

/* =====================================================================
   INPUT
   ===================================================================== */
function onAct(e){
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled || !S) return;
  if(SFX.on) actx();
  act(b.dataset.act, b);
}
$('#stage').addEventListener('click', onAct);
$('#modal').addEventListener('click', e => { if(e.target.closest('[data-act]') && S) onAct(e); });
function act(a, b){
  const me = S.players.find(p => p.id === MY_ID);
  const v = b.dataset.v;
  switch(a){
    case 'chip': if(!me) return; draftBet = Math.min(me.chips, draftBet + Number(v)); sfx('chip'); render(); break;
    case 'clear': draftBet = 0; render(); break;
    case 'allin': if(!me) return; draftBet = me.chips; sfx('chip'); render(); break;
    case 'bet': send({t:'bet', amount:draftBet}); sfx('chip'); break;
    case 'sel': selChip = Number(v); sfx('chip'); render(); break;
    case 'rk':
      if(!me || S.phase !== 'betting') return;
      if(me.ready){ toast('Your bets are locked in for this round.'); return; }
      if(me.chips <= 0){ toast("You're out of chips."); return; }
      send({t:'chip', k:b.dataset.k, amt:selChip}); sfx('chip'); break;
    case 'undo': send({t:'undo'}); break;
    case 'clearbets': send({t:'clearbets'}); break;
    case 'done': send({t:'done'}); sfx('chip'); break;
    case 'hit': case 'stand': case 'double': {
      const now = Date.now(); if(now - lastActAt < 280) return; lastActAt = now;
      send({t:'act', a}); break;
    }
    case 'beg': send({t:'beg'}); break;
    case 'start': send({t:'start'}); break;
    case 'invite': invite(); break;
    case 'settings': openSettings(); break;
    case 'rules': openRules(); break;
    case 'closemodal': closeModal(); break;
    case 'setgame': send({t:'settings', game:v}); break;
    case 'settarget': send({t:'settings', target:Number(v)}); break;
    case 'setdoom': send({t:'settings', doom:v === 'on'}); break;
    case 'sound': SFX.on = !SFX.on; store.set('sound', SFX.on); if(!SFX.on && 'speechSynthesis' in window) speechSynthesis.cancel(); render(); break;
    case 'leave':
      dialog({title:'Leave the table?', danger:true, ok:'Leave', cancel:'Stay',
        text: isHost ? "You're the host. Leaving closes the table for everyone." : "Your chips are saved if you rejoin from this same browser tab.",
        onOk: leaveTable});
      break;
  }
}
async function invite(){
  if(!S) return;
  const link = location.origin + location.pathname + '?room=' + S.code;
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(navigator.share && touch){
    try{ await navigator.share({title:"Myla's Table", text:`Join my table! Code: ${S.code}`, url:link}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(link); toast('Invite link copied. Send it to your friends!'); }
  catch(e){ toast(`Table code: ${S.code}. Link: ${link}`); }
}
</script>
<script>
'use strict';
/* =====================================================================
   NETWORK (PeerJS, peer-to-peer; the host's browser runs the game)
   ===================================================================== */
let peer = null, hostConn = null, isHost = false, joinCode = null, myName = '';
let lastHostMsg = 0, pingTimer = null, joinTimer = null, lostShown = false;

function peerReady(){
  return new Promise((res, rej) => {
    if(window.Peer) return res();
    let n = 0;
    const iv = setInterval(() => { if(window.Peer){ clearInterval(iv); res(); } else if(++n > 120){ clearInterval(iv); rej(new Error('lib')); } }, 100);
  });
}
function netErrText(err){
  const t = err && err.type;
  if(t === 'peer-unavailable') return "No table found with that code. Check the code, and make sure the host still has the game open.";
  if(t === 'browser-incompatible') return "This browser can't do online play. Try Chrome, Safari, or Firefox.";
  if(['network','server-error','socket-error','socket-closed','disconnected'].includes(t)) return "Couldn't reach the game server. Check your internet and try again.";
  return 'Connection problem' + (t ? ` (${t})` : '') + '. Try again.';
}
function send(msg){
  if(isHost){ if(G) hostHandle(MY_ID, msg); return; }
  if(hostConn && hostConn.open){ try{ hostConn.send(msg); }catch(e){} }
  else if(S && !lostShown) showLost();
}
function setRoomURL(code){ try{ history.replaceState(null, '', location.pathname + (code ? '?room=' + code : '')); }catch(e){} }

/* ---------- hosting ---------- */
async function createTable(){
  const name = readName(); if(!name) return;
  setHomeBusy('Setting up your table...');
  try{ await peerReady(); }catch(e){ return homeError("Couldn't load the online-play library. Check your internet and reload the page."); }
  myName = name;
  let attempts = 0;
  const attempt = () => {
    const code = Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join('');
    const p = new Peer(PREFIX + code, {debug:0});
    peer = p;
    p.on('open', () => {
      if(peer !== p) return;
      isHost = true; G = newGame(code);
      setRoomURL(code);
      handleJoin({id:MY_ID, name}, null);
      startHostLoop();
    });
    p.on('connection', conn => setupHostConn(conn));
    p.on('error', err => {
      if(peer !== p) return;
      if(err && err.type === 'unavailable-id' && attempts++ < 4){ try{ p.destroy(); }catch(e){} attempt(); return; }
      if(!G) homeError(netErrText(err));
      else console.warn('peer error', err);
    });
    p.on('disconnected', () => {
      setTimeout(() => { try{ if(peer === p && !p.destroyed && p.disconnected) p.reconnect(); }catch(e){} }, 1500);
    });
  };
  attempt();
}
function setupHostConn(conn){
  conn.on('data', msg => {
    if(!G || !msg || typeof msg !== 'object') return;
    if(msg.t === 'join'){ handleJoin(msg, conn); return; }
    if(conn.clientId && conns.get(conn.clientId) === conn) hostHandle(conn.clientId, msg);
  });
  conn.on('close', () => {
    if(!G || !conn.clientId || conns.get(conn.clientId) !== conn) return;
    conns.delete(conn.clientId);
    const p = P(conn.clientId);
    if(p && p.connected){ markAway(p); broadcast(); }
  });
  conn.on('error', () => {});
}

/* ---------- joining ---------- */
async function joinTable(code){
  const name = readName(); if(!name) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 5) return showHomeMsg('Table codes are 5 characters long.');
  setHomeBusy(`Joining table ${code}...`);
  try{ await peerReady(); }catch(e){ return homeError("Couldn't load the online-play library. Check your internet and reload the page."); }
  joinCode = code; myName = name; isHost = false;
  startClientPeer();
}
function startClientPeer(){
  const p = new Peer({debug:0});
  peer = p;
  p.on('open', () => { if(peer === p) connectToHost(); });
  p.on('error', err => {
    if(peer !== p) return;
    if(S){ if(err && err.type === 'peer-unavailable') showLost('Myla can\'t find the table anymore. The host may have closed it or lost connection.'); return; }
    homeError(netErrText(err));
  });
  p.on('disconnected', () => {
    setTimeout(() => { try{ if(peer === p && !p.destroyed && p.disconnected) p.reconnect(); }catch(e){} }, 1500);
  });
}
function connectToHost(){
  clearTimeout(joinTimer);
  if(hostConn){ const old = hostConn; hostConn = null; try{ old.close(); }catch(e){} }
  const c = peer.connect(PREFIX + joinCode, {reliable:true, serialization:'json'});
  hostConn = c;
  c.on('open', () => {
    if(hostConn !== c) return;
    lastHostMsg = Date.now();
    c.send({t:'join', id:MY_ID, name:myName});
    startPing();
  });
  c.on('data', msg => {
    if(hostConn !== c || !msg) return;
    lastHostMsg = Date.now();
    if(msg.t === 'state'){ clearTimeout(joinTimer); if(lostShown) hideLost(); onState(msg.s); }
    else if(msg.t === 'reject'){ homeError(msg.reason || 'The host turned you away.'); }
    else if(msg.t === 'closed'){ leaveLocal(); renderHome('The host closed the table. Thanks for playing!', true); }
  });
  c.on('close', () => { if(hostConn === c && S && !lostShown) showLost(); });
  c.on('error', () => {});
  joinTimer = setTimeout(() => {
    if(!S) homeError("Couldn't connect to that table. Check the code, or try a different Wi-Fi/cell network.");
    else if(!lostShown) showLost();
  }, 15000);
}
function startPing(){
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if(hostConn && hostConn.open){ try{ hostConn.send({t:'ping'}); }catch(e){} }
    if(S && !isHost && !lostShown && Date.now() - lastHostMsg > 15000) showLost();
  }, 3000);
}
function showLost(msg){
  lostShown = true;
  dialog({kind:'lost', title:'Connection lost', ok:'Reconnect', cancel:'Leave',
    text: msg || "Lost connection to the table. This happens when the host's screen locks or someone's Wi-Fi drops.",
    onOk: reconnect, onCancel: () => { leaveLocal(); renderHome(); }});
}
function hideLost(){ lostShown = false; if(modalKind === 'lost') closeModal(); }
function reconnect(){
  lostShown = false; lastHostMsg = Date.now();
  if(peer && !peer.destroyed && peer.open) connectToHost();
  else { try{ peer && peer.destroy(); }catch(e){} startClientPeer(); }
}

/* ---------- leaving ---------- */
function leaveLocal(keepURL){
  clearInterval(pingTimer); clearTimeout(joinTimer); clearInterval(hostTimer); clearInterval(chaosTimer);
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
  const p = peer; peer = null; hostConn = null;
  if(p) setTimeout(() => { try{ p.destroy(); }catch(e){} }, 300);
  conns.clear(); G = null; S = null; isHost = false; lostShown = false; joinCode = null;
  closeModal(); if(!keepURL) setRoomURL(null);
  $('#stage').className = ''; document.body.classList.remove('fx-blackout');
}
function leaveTable(){
  if(!isHost && hostConn && hostConn.open){ try{ hostConn.send({t:'leave'}); }catch(e){} }
  leaveLocal(); renderHome();
}
window.addEventListener('beforeunload', () => {
  if(isHost){ for(const c of conns.values()){ try{ c.send({t:'closed'}); }catch(e){} } }
});

/* =====================================================================
   HOME SCREEN
   ===================================================================== */
function renderHome(msg, info){
  screen = 'home';
  $('#stage').className = ''; document.body.classList.remove('fx-blackout');
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0,5);
  const name = store.get('name', '');
  $('#stage').innerHTML = `<div class="home">
    <div class="logo"><span class="n">33</span><span class="w">BLACKJACK</span><span class="s">ROULETTE &middot; BACCARAT &middot; AT MYLA'S TABLE</span></div>
    <p class="tag">Play to 33 (or classic 21) with your friends.<br>Lose a hand and the Wheel of Doom decides your fate, if you dare turn it on.</p>
    <div class="panel">
      <div class="field"><label for="nameIn">Your name</label><input id="nameIn" class="inp" maxlength="14" autocomplete="off" spellcheck="false" value="${esc(name)}" placeholder="Your name"></div>
      ${room
        ? `<button class="btn xl" id="joinLinkBtn">Join table ${esc(room)}</button><div class="or">or</div><button class="btn ghost" id="createBtn">Start my own table</button>`
        : `<button class="btn xl" id="createBtn">Create a table</button><div class="or">or join friends</div><div class="joinrow"><input id="codeIn" class="inp code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn ghost" id="joinBtn">Join</button></div>`}
      <div class="err${info ? ' info' : ''}" id="homeMsg">${esc(msg || '')}</div>
    </div>
    <details class="rules"><summary>How to play</summary><ul>
      <li>Everyone plays against <b>Myla</b>, the dealer. In <b>Blackjack 33</b> you try to get closer to 33 than her without going over (she stands on 29). <b>Blackjack 21</b> is the classic game (she stands on 17).</li>
      <li>Everybody gets <b>2 cards</b>. Myla's second card stays face-down until everyone is done. An Ace + a 10/J/Q/K is a <b>Blackjack</b> and pays 3:2.</li>
      <li><b>Hit</b> to take a card, <b>Stand</b> to stop, <b>Double</b> to double your bet and take exactly one more card. In 33 mode, hitting <b>exactly 33 pays 2:1</b>.</li>
      <li>The host can switch the table to <b>Roulette</b> or <b>Baccarat</b> between hands. Your chips come with you.</li>
      <li>With the <b>Wheel of Doom</b> on, losing means something crazy happens: taxes, earthquakes, upside-down screens, cursed aces, embarrassing new names... Turn it off for a normal game.</li>
      <li>You start with <b>1,000 chips</b>. Go broke? You can beg Myla for more. Everyone will know.</li>
      <li>Whoever creates the table is the host. Share the code or invite link, and keep the host's tab open.</li>
    </ul></details>
  </div>`;
  const createBtn = $('#createBtn'), joinBtn = $('#joinBtn'), joinLinkBtn = $('#joinLinkBtn'), codeIn = $('#codeIn'), nameIn = $('#nameIn');
  createBtn.onclick = () => { if(SFX.on) actx(); createTable(); };
  if(joinBtn) joinBtn.onclick = () => { if(SFX.on) actx(); joinTable(codeIn.value); };
  if(joinLinkBtn) joinLinkBtn.onclick = () => { if(SFX.on) actx(); joinTable(room); };
  if(codeIn) codeIn.addEventListener('keydown', e => { if(e.key === 'Enter') joinBtn.click(); });
  nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') (joinLinkBtn || createBtn).click(); });
  if(!name) setTimeout(() => nameIn.focus(), 50);
}
function readName(){
  const el = $('#nameIn'); const v = el ? el.value.replace(/\s+/g, ' ').trim().slice(0,14) : '';
  if(!v){ showHomeMsg('Type your name first.'); if(el) el.focus(); return null; }
  store.set('name', v); return v;
}
function showHomeMsg(m, info){ const el = $('#homeMsg'); if(el){ el.textContent = m; el.classList.toggle('info', !!info); } }
function setHomeBusy(m){
  document.querySelectorAll('.home button, .home input').forEach(b => b.disabled = true);
  showHomeMsg(m, true);
}
function homeError(m){ leaveLocal(true); renderHome(m); }

renderHome();
</script>
</body>
